name: Tieni sveglio Supabase
on:
  schedule:
    - cron: "17 6 */3 * *"   # ogni 3 giorni
  workflow_dispatch:          # per avviarlo anche a mano
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -f "${{ secrets.SUPABASE_URL }}/rest/v1/cards?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
