<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<link rel="preload" href="fonts/chakra-petch-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<title>DSR Archive</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --navy:#0a111d;--navy2:#111b2b;--navy3:#1d2b42;--blue:#4b8dff;--blue-d:#3a78e6;
  --bg:#0d131d;--card:#151d2a;--card2:#1a2333;--hover:#1f2a3c;--inp:#0f1622;--line:#273246;--line2:#1f2838;--text:#e3e8f0;--muted:#8d99ad;
  --green:#34c27b;--red:#f0605d;--orange:#f39200;--yellow:#f6c343;
  --r:8px;--sh:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.right{text-align:right}
.nowrap{white-space:nowrap}
.pos{color:var(--green);font-weight:600}
.neg{color:var(--red);font-weight:600}

::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2c374b;border-radius:6px}::-webkit-scrollbar-track{background:transparent}
option{background:var(--card2);color:var(--text)}
/* top bar */
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.45);border-bottom:1px solid var(--line2)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:9px;color:#fff;font-weight:800;font-size:19px;letter-spacing:-.3px;white-space:nowrap}
.logo:hover{text-decoration:none}
.logo i{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 5px;border-radius:7px;background:linear-gradient(135deg,var(--orange),#ffb84d);font-style:normal;color:#0a111d;font-size:12.5px;letter-spacing:.3px}
.logo span{color:#8fb4ff;font-weight:600}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;border:0;border-radius:6px;padding:9px 12px 9px 34px;background:var(--inp);border:1px solid var(--line);color:var(--text);outline:none}
.search input:focus{border-color:var(--blue)}
.search svg{stroke:#8d99ad;position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5}
.top-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.tbtn{background:var(--navy2);border:1px solid var(--navy3);color:#fff;border-radius:6px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:var(--navy3)}
.tbtn:disabled{opacity:.4;cursor:default}
.subnav{background:var(--navy2)}
.subnav-in{max-width:1240px;margin:0 auto;display:flex;gap:2px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.subnav a{color:#aebbd0;padding:10px 12px;white-space:nowrap;border-bottom:3px solid transparent;font-weight:500}
.subnav a:hover{color:#fff;text-decoration:none;background:rgba(255,255,255,.05)}
.subnav a.on{color:#fff;border-bottom-color:var(--orange)}
.subnav .sep{width:1px;background:rgba(255,255,255,.15);margin:8px 6px}
#busy{position:fixed;top:0;left:0;height:3px;width:0;background:var(--orange);z-index:99;transition:width .3s}
#busy.on{width:80%;transition:width 4s cubic-bezier(.1,.6,.2,1)}

/* layout */
main{max-width:1240px;margin:0 auto;padding:16px}
.crumbs{font-size:13px;color:var(--muted);margin:2px 0 12px}
.crumbs a{color:var(--muted)}
.crumbs b{color:var(--text);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:16px}
.panel.flush{padding:0;overflow:hidden}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card2)}
.panel-h h2{margin:0}
.grow{flex:1}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row>*{min-width:0}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}

/* games tiles */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.game{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);color:var(--text)}
.game:hover{border-color:var(--blue);text-decoration:none}
.gicon{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:15px}
.g-ygo{background:linear-gradient(135deg,#7a3cc2,#c0392b)}
.g-pkm{background:linear-gradient(135deg,#f0b90b,#e5532d)}
.g-op{background:linear-gradient(135deg,#d62828,#264aa8)}
.g-x{background:linear-gradient(135deg,#4b6584,#2d3e50)}

/* buttons/forms */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#3a4760;background:var(--hover);text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-d)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.dan{color:var(--red);border-color:#5a2a30}
.btn.dan:hover{background:#2a1a1f}
.btn.dan.fill{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 8px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--inp);color:var(--text);outline:none}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(75,141,255,.2)}
label.f{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fg .full{grid-column:1/-1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--inp);color:var(--muted);padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .inp{width:auto}
fieldset{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0}
legend{font-size:12.5px;color:var(--muted);font-weight:600;padding:0 4px}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--card2);white-space:nowrap}
.t td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t tbody tr:nth-child(even){background:rgba(255,255,255,.018)}
.t tbody tr:hover{background:var(--hover)}
.t th.sortable{cursor:pointer}
.t th.sortable:hover{color:var(--text)}
.t tfoot td{font-weight:700;background:var(--card2);border-top:1px solid var(--line)}
.t .acts{white-space:nowrap;text-align:right}
.t a.cname{font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}
.pager{display:flex;gap:6px;justify-content:flex-end;align-items:center;padding:10px 16px}

/* badges */
.b{display:inline-block;border-radius:4px;padding:1px 6px;font-size:11.5px;font-weight:700;line-height:18px;white-space:nowrap}
.c-MT{background:#17a2b8;color:#fff}.c-NM{background:#2e9b57;color:#fff}.c-EX{background:#8dbb3c;color:#fff}
.c-GD{background:#d6c22b;color:#2b2b00}.c-LP{background:#f29a2e;color:#fff}.c-PL{background:#e8664a;color:#fff}.c-PO{background:#c0392b;color:#fff}
.c-x{background:#2a3446;color:#c9d2e0}
.rar{background:#1d2c4a;color:#a9c4ff;font-weight:600}
.st-d{background:#143326;color:#5fd69a}.st-v{background:#262f3e;color:#9aa6b8}
.lotb{background:#3a2a12;color:#ffbf5e}
.loc{background:#24203a;color:#c6b8ff;font-weight:600}
.lang{background:#262f3e;color:#c9d2e0;font-weight:600}

/* card page */
.cardtop{display:grid;grid-template-columns:220px 1fr;gap:16px}
.cimg{width:220px;aspect-ratio:63/88;border-radius:10px;background:linear-gradient(160deg,#22385e,#0e1a2e);display:grid;place-items:center;color:#fff;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.2);position:relative}
.cimg img{width:100%;height:100%;object-fit:cover}
.cimg .ph{text-align:center;padding:16px}
.cimg .ph b{display:block;font-size:17px;margin-top:10px}
.cimg .ph small{opacity:.7}
.info{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13.5px}
.info dt{color:var(--muted)}
.info dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* immagini */
.thumb{position:relative;display:inline-block;width:30px;height:42px;border-radius:3px;overflow:visible;vertical-align:middle;flex:none}
.thumb>img:first-child{width:30px;height:42px;object-fit:cover;border-radius:3px;display:block;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.thumb>i{display:grid;place-items:center;width:30px;height:42px;border-radius:3px;color:#fff;font-style:normal;font-size:8.5px;font-weight:800;opacity:.55}
.thumb .big{display:none;position:absolute;left:38px;top:50%;transform:translateY(-50%);width:190px;height:auto;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:30;pointer-events:none}
@media (hover:hover){.thumb:hover .big{display:block}}
td.tc{width:44px;padding-right:0}
.cimg{cursor:pointer}
.cimg .imgbtn{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(10,20,40,.75);color:#fff;border:0;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;white-space:nowrap;opacity:0;transition:opacity .15s}
.cimg:hover .imgbtn,.cimg:focus-within .imgbtn{opacity:1}
@media (hover:none){.cimg .imgbtn{opacity:1}}
.imgprev{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.imgprev img{width:110px;border-radius:6px;cursor:pointer;border:3px solid transparent;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.imgprev img:hover{border-color:var(--blue)}

/* vendite, lotti */
.orow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.orow .oq{width:84px;flex:none}.orow .op{width:120px;flex:none}.orow .x{align-self:flex-end;padding-bottom:6px}
.osum{margin-top:14px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.osum-g{display:grid;grid-template-columns:1fr auto;gap:4px 18px;max-width:380px;margin-left:auto;font-variant-numeric:tabular-nums}
.osum-g span{color:var(--muted)}.osum-g .tot{border-top:1px solid var(--line);padding-top:6px;margin-top:4px;font-size:16px;color:var(--text)}
.prog{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin:2px 0 3px}.prog.big{height:12px;border-radius:6px}
.prog i{display:block;height:100%;border-radius:inherit;transition:width .4s}
a.panel.banner{display:flex;gap:12px;align-items:center;color:var(--text);border-color:#4a3a1c;background:linear-gradient(90deg,#2a2213,var(--card))}
a.panel.banner:hover{text-decoration:none;border-color:var(--orange)}
a.panel.banner.ship{border-color:#4a2a24;background:linear-gradient(90deg,#2c1a16,var(--card))}
.seg a{display:inline-block;padding:6px 12px;background:var(--inp);color:var(--muted)}.seg a.on{background:var(--blue);color:#fff}.seg a:hover{text-decoration:none;color:var(--text)}
.hrow{display:grid;grid-template-columns:96px 1fr 38px 40px;gap:8px;align-items:center;font-size:13px;margin:5px 0}.hrow b{text-align:right}
.hbar{height:10px;background:var(--inp);border-radius:5px;overflow:hidden}.hbar i{display:block;height:100%;background:var(--blue);border-radius:5px}.hbar.g i{background:var(--green)}
.picks{display:flex;flex-direction:column;gap:3px;font-size:13px}.subrow td{background:var(--card2);padding-top:4px!important}
.tst.ok{background:#1d5c3d;border-color:#2c7a52}
@media (max-width:760px){.orow{flex-wrap:wrap}.orow .grow{flex-basis:calc(100% - 50px)}.orow .oq,.orow .op{flex:1}}

/* selezione multipla */
th.ck,td.ck{width:30px;padding-right:0}.ck input{width:16px;height:16px;cursor:pointer;accent-color:var(--blue)}
.t tbody tr.sel{background:#16284a !important}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card2);border-top:1px solid var(--blue);box-shadow:0 -6px 20px rgba(0,0,0,.4)}
.selin{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#app:has(#selbar){padding-bottom:80px}
/* vetrina */
.show-m{display:none}
.inp.wq{width:auto;padding:3px 6px;display:inline-block}
@media (max-width:760px){.show-m{display:block}}
/* Cardmarket */
a.askl{color:inherit;text-decoration:none;display:inline-block;padding:2px 4px;border-radius:4px}a.askl:hover{background:var(--hover)}
.ctbox{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card2)}
a.btn.cmlink{border-color:#1f4f8f;color:#8fb4ff}a.btn.cmlink:hover{background:#14233d}
.cmp h3{font-size:15px}.cmgrid{display:flex;gap:10px 28px;flex-wrap:wrap;margin-top:12px}.cmgrid div{display:flex;flex-direction:column}.cmgrid span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}.cmgrid b{font-size:20px;font-variant-numeric:tabular-nums}
.cml{max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:6px}.cmi{display:flex;gap:12px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}.cmi:hover{background:var(--hover)}.cmi:last-child{border-bottom:0}
.mv{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line2)}.mv:last-child{border-bottom:0}.mv a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* modal */
.upg{background:#2a2213;border-bottom:1px solid #4a3a1c;color:#f3d9a6;font-size:13px}.upg>div{max-width:1240px;margin:0 auto;padding:8px 16px}.upg a{color:#ffbf5e;font-weight:600}

.mback{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow-y:auto}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:10px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mbox.wide{max-width:780px}
.mhead{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.mhead h3{flex:1;font-size:16px}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.mbody{padding:16px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:14px;margin-top:14px;border-top:1px solid var(--line)}

/* autocomplete */
.acw{position:relative}
.ac{position:absolute;left:0;right:0;top:100%;margin-top:3px;background:var(--card2);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:60;max-height:300px;overflow-y:auto;color:var(--text)}
.ac:empty{display:none}
.ac div.it{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.ac div.it:last-child{border-bottom:0}
.ac div.it.on,.ac div.it:hover{background:var(--hover)}
.ac div.it small{display:block;color:var(--muted);font-size:11.5px}
.ac .hd{padding:5px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:var(--card)}

/* suggerimenti con espansione e rarità */
.ac small .acx{color:var(--text);font-weight:600}
.ac small .acr{display:inline-block;margin-left:4px;padding:0 5px;border-radius:3px;background:#1d2c4a;color:#a9c4ff;font-weight:600;font-size:11px}
.ac small .acr.q{background:#3a2a12;color:#ffbf5e}
.ac{max-height:min(420px,60vh)}

/* toast */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.tst{background:#263248;border:1px solid #34425c;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;max-width:92vw}
.tst.err{background:var(--red)}
.tst button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:5px;padding:3px 8px;cursor:pointer}

/* auth */
.auth{max-width:440px;margin:7vh auto;padding:0 16px}
.auth .panel{padding:24px}
.auth .logo{color:var(--text);justify-content:center;font-size:24px;margin-bottom:18px}
.auth .logo span{color:#8fb4ff}
.note{background:#17233a;border:1px solid #27385a;border-radius:6px;padding:10px 12px;font-size:13px;color:#c3d0e6}
.dz{display:block;border:2px dashed #34425c;border-radius:8px;padding:22px;margin-top:10px;text-align:center;background:var(--inp);cursor:pointer}
.dz:hover,.dz.on{border-color:var(--blue);background:#14203a}

@media (max-width:760px){
  .top-in{flex-wrap:wrap;gap:10px}
  .search{order:3;max-width:none;flex-basis:100%}
  .tbtn .lbl{display:none}
  main{padding:12px}
  .cardtop{grid-template-columns:1fr}
  .cimg{width:160px;margin:0 auto}
  .hide-m{display:none}
  .t td,.t th{padding:7px 8px}
}
/* ===================== TEMA ARCADE TCG ===================== */
@font-face{font-family:'Chakra Petch';src:url('fonts/chakra-petch-latin-500-normal.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Chakra Petch';src:url('fonts/chakra-petch-latin-600-normal.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Chakra Petch';src:url('fonts/chakra-petch-latin-700-normal.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Barlow';src:url('fonts/barlow-latin-400-normal.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Barlow';src:url('fonts/barlow-latin-500-normal.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Barlow';src:url('fonts/barlow-latin-600-normal.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Barlow';src:url('fonts/barlow-latin-700-normal.woff2') format('woff2');font-weight:700;font-display:swap}
:root{--bg:#0b0820;--card:#140f33;--card2:#191340;--hover:#211a52;--inp:#100c2a;--line:#2d2468;--line2:#211a4d;--text:#f2eeff;--muted:#a198cf;
  --blue:#2de2e6;--blue-d:#1fcfd3;--navy:#0b0820;--navy2:#110c2c;--navy3:#2d2468;--r:4px;--neon:#ff3dcb;--sh:none;
  --green:#3dff9a;--red:#ff5a7a;--yellow:#ffe14d;--orange:#ffb23d;--disp:'Chakra Petch',system-ui,sans-serif}
body{font-family:'Barlow',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;background:linear-gradient(rgba(45,226,230,.03) 1px,transparent 1px) 0 0/100% 28px,var(--bg)}
h1,h2,h3,.stat .v,.logo,.subnav a,.subnav button,.btn,.tbtn,.stat .l,.t th,.seg a,.seg button,.mhead h3,legend{font-family:var(--disp)}
h1{font-size:30px;font-weight:700;letter-spacing:.2px;line-height:1.15}h2{font-size:19px;font-weight:700}h3{font-weight:700}
a{color:var(--blue)}
::-webkit-scrollbar-thumb{background:#2d2468}
.top{background:var(--navy);border-bottom:1px solid var(--line);box-shadow:0 0 30px rgba(255,61,203,.08)}
.logo i{background:linear-gradient(135deg,var(--neon),#2de2e6);color:#0b0820;border-radius:6px}.logo span{color:var(--neon)}
.search input{background:var(--inp);border-color:var(--line)}.search input:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(255,61,203,.15)}
.tbtn{background:var(--navy2);border-color:var(--line)}.tbtn:hover{background:var(--hover);border-color:var(--neon)}
.subnav{background:var(--navy2);border-bottom:1px solid var(--line2)}
.subnav a{color:#b9b0e6;font-weight:600}.subnav a:hover{color:#fff}
.subnav a.on{border-bottom-color:var(--neon);color:#fff;text-shadow:0 0 14px rgba(255,61,203,.8)}
.subnav .more{display:none}
#busy{background:linear-gradient(90deg,var(--neon),var(--blue))}
.panel{border-color:var(--line);background:var(--card)}.panel-h{background:#120d2e;border-bottom-color:var(--line)}
.stat{--c:var(--blue);border:0;border-left:3px solid var(--c);border-radius:0;background:linear-gradient(180deg,#1a1442,#120d2f);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
.stats .stat:nth-child(4n+2){--c:var(--neon)}.stats .stat:nth-child(4n+3){--c:var(--yellow)}.stats .stat:nth-child(4n+4){--c:var(--green)}
.stat .l{color:var(--c);text-transform:none;letter-spacing:.4px;font-weight:600;font-size:12.5px}.stat .v{font-size:29px;font-weight:700}
.games{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.game{min-height:100px;border:1px solid var(--line);border-radius:4px;background:var(--card)}
.game:has(.g-ygo){background:linear-gradient(120deg,rgba(150,60,220,.38),var(--card) 70%);border-color:#6a3cb8}
.game:has(.g-pkm){background:linear-gradient(120deg,rgba(255,200,40,.28),var(--card) 70%);border-color:#8a7020}
.game:has(.g-op){background:linear-gradient(120deg,rgba(230,50,60,.32),var(--card) 70%);border-color:#8a2a35}
.game:hover{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 0 24px rgba(255,61,203,.35)}
.gicon{border-radius:6px}
.btn{border-radius:4px;border-color:var(--line);background:var(--card2);font-weight:600}.btn:hover{border-color:#5a4aa8;background:var(--hover)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#0b0820;box-shadow:0 0 18px rgba(45,226,230,.3)}.btn.pri:hover{background:#6ff0f2}
.btn.ok{background:var(--green);border-color:var(--green);color:#0b0820;box-shadow:0 0 16px rgba(61,255,154,.25)}.btn.ok:hover{filter:brightness(1.1)}
.btn.dan{color:var(--red);border-color:#5a2140}.btn.dan:hover{background:#2a1030}.btn.dan.fill{background:var(--red);border-color:var(--red);color:#0b0820}
a.btn.cmlink{border-color:#1f5d70;color:var(--blue)}a.btn.cmlink:hover{background:#0f2a3a}
.inp,select.inp,textarea.inp{background:var(--inp);border-color:var(--line);border-radius:4px}.inp:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(255,61,203,.15);outline:none}
.t th{background:#120d2e;color:var(--blue);text-transform:none;letter-spacing:.3px;font-weight:600;font-size:12.5px}
.t tbody tr:nth-child(even){background:rgba(255,255,255,.015)}.t tbody tr:hover{background:var(--hover)}.t tbody tr.sel{background:rgba(255,61,203,.1)}
.t tfoot td{background:#120d2e}
.b.rar{background:#2a1d5c;color:#d9ccff}.odisc{margin-top:12px;padding:10px 12px;border:1px dashed rgba(255,255,255,.18);border-radius:10px}.b.src-ptcg{background:#3a2f0b;color:#ffd75e}.b.lang{background:#1a2648;color:#a9c4ff;display:inline-flex;align-items:center;gap:4px}.b.lang .flag{width:16px;height:11px;border-radius:2px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.18)}.b.lang .lq{opacity:.6;margin-left:-2px}.lotb{background:#3a2a10;color:var(--orange)}
.seg{border-color:var(--line);border-radius:4px}.seg button.on,.seg a.on{background:var(--neon);color:#0b0820}
a.panel.banner{border-color:#8a6a20;background:linear-gradient(90deg,rgba(255,225,77,.12),var(--card))}
a.panel.banner.ship{border-color:#8a2a6a;background:linear-gradient(90deg,rgba(255,61,203,.16),var(--card))}
a.panel.banner:hover{border-color:var(--neon)}
.cimg{border-radius:8px;box-shadow:0 0 0 2px #4b3a9c,0 0 40px rgba(150,60,220,.4)}
.selbar{background:var(--card2);border-top:1px solid var(--neon);box-shadow:0 -6px 30px rgba(255,61,203,.18)}
.hbar i{background:var(--blue)}.hbar.g i{background:var(--green)}
/* ultime aggiunte e griglia */
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:124px;gap:14px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
.gridc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;padding:16px}
.gcard{display:block;color:var(--text);position:relative;scroll-snap-align:start;min-width:0}.gcard:hover{text-decoration:none}
.gcard .cimg{width:100%;border-radius:6px;box-shadow:0 0 0 1px var(--line);transition:transform .15s,box-shadow .15s}
.gcard:hover .cimg{transform:translateY(-3px);box-shadow:0 0 0 2px var(--blue),0 0 22px rgba(45,226,230,.35)}
.gcard.foil .cimg{box-shadow:0 0 0 2px var(--neon),0 0 20px rgba(255,61,203,.45)}
.gcard .cimg .ph b{font-size:13px}.gcard .cimg .ph{padding:8px}
.gcard .n{font-weight:600;font-size:13.5px;margin-top:8px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard .m{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard .vb{display:flex;margin-top:4px}.gcard .vb .b{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.gcard .qty{position:absolute;top:6px;right:6px;background:rgba(11,8,32,.85);color:#fff;font-family:var(--disp);font-weight:700;font-size:12px;padding:1px 7px;border-radius:3px;border:1px solid var(--line)}
.gcard .gck{position:absolute;top:6px;left:6px;width:20px;height:20px;accent-color:var(--neon)}
.gcard.sel .cimg{box-shadow:0 0 0 3px var(--neon)}
/* telefono: menu in basso */
@media (max-width:760px){
  h1{font-size:26px}
  .subnav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:rgba(17,12,44,.97);border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px)}
  .subnav-in{justify-content:space-around;padding:0;gap:0}
  .subnav .xm,.subnav .sep{display:none}
  .subnav a,.subnav .more{flex:1;text-align:center;font-size:12.5px;padding:12px 2px 13px;border-bottom:0;border-top:3px solid transparent}
  .subnav a.on,.subnav .more.on{border-top-color:var(--neon)}
  .subnav .more{display:block;background:none;border-left:0;border-right:0;border-bottom:0;color:#b9b0e6;font-weight:600;cursor:pointer}
  .subnav .more.on{color:#fff;text-shadow:0 0 14px rgba(255,61,203,.8)}
  body{padding-bottom:calc(58px + env(safe-area-inset-bottom))}
  .selbar,#gbar{bottom:calc(52px + env(safe-area-inset-bottom))}
  #toast{bottom:calc(70px + env(safe-area-inset-bottom))}
  .gridc{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px}
  .gcard .n{font-size:12.5px}.gcard .m{font-size:11px}
}
.navmenu{display:grid;grid-template-columns:1fr 1fr;gap:8px}.navmenu a{display:block;padding:12px;border:1px solid var(--line);border-radius:4px;background:var(--card2);color:var(--text);font-family:var(--disp);font-weight:600}
.navmenu a.on{border-color:var(--neon);color:#fff}.navmenu a:hover{text-decoration:none;border-color:var(--blue)}
@media (prefers-reduced-motion:reduce){.gcard .cimg{transition:none}}
.auth .logo span{color:var(--neon)}

/* vetrina */
.vbadge{font-family:var(--disp);font-weight:700;font-size:12.5px;padding:4px 10px;border-radius:3px;background:linear-gradient(90deg,var(--neon),#a54dff);color:#fff;letter-spacing:.3px}
.vetrina{max-width:1240px}
.vhero{position:relative;padding:34px 28px 30px;margin:4px 0 18px;border:1px solid var(--line);overflow:hidden;
  background:radial-gradient(600px 240px at 100% 0,rgba(255,61,203,.22),transparent 70%),radial-gradient(500px 260px at 0 100%,rgba(45,226,230,.16),transparent 70%),linear-gradient(180deg,#17113e,#100b2b);
  clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,26px 100%,0 calc(100% - 26px))}
.vhero h1{font-size:40px;line-height:1.05;margin:0 0 10px;max-width:22ch;text-shadow:0 0 30px rgba(255,61,203,.35)}
.vhero p{margin:0;max-width:60ch;font-size:15.5px}
.vcontact{display:flex;gap:8px;margin-top:16px}
.vtools{position:sticky;top:var(--hh,57px);z-index:15;background:rgba(11,8,32,.94);backdrop-filter:blur(8px);padding:10px 16px 8px;margin:0 -16px 6px}
.vsearch{position:relative}.vsearch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.vsearch input{width:100%;font-size:16px;padding:13px 14px 13px 44px;background:var(--inp);border:1px solid var(--line);border-radius:4px;color:var(--text);outline:none}
.vsearch input:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(255,61,203,.15)}
.vrow{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap}
.vchips{display:flex;gap:6px;flex-wrap:wrap}
.vchips button{font-family:var(--disp);font-weight:600;font-size:13px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.vchips button:hover{color:var(--text);border-color:#5a4aa8}
.vchips button.on{color:#0b0820;background:var(--blue);border-color:var(--blue)}
.vchips button.on.g-ygo{background:linear-gradient(135deg,#a066ff,#e0457b);color:#fff;border-color:transparent}
.vchips button.on.g-pkm{background:linear-gradient(135deg,#ffd23d,#ff8a3d);border-color:transparent}
.vchips button.on.g-op{background:linear-gradient(135deg,#ff4d5e,#4d7bff);color:#fff;border-color:transparent}
.vright{display:flex;gap:8px;align-items:center}.vright .inp{width:auto}
#gcount{margin-top:6px;min-height:1px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:18px}
.vcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.vcard:hover{border-color:#5a4aa8}
.vcard.on{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 0 24px rgba(255,61,203,.3)}
.vimg{all:unset;cursor:zoom-in;display:block;position:relative;width:100%;aspect-ratio:63/88;background:linear-gradient(160deg,#22184f,#120d2e)}
.vimg.cimg{width:100%;border-radius:0;box-shadow:none}
.vimg img{width:100%;height:100%;object-fit:cover;display:block}
.vcard.foil .vimg::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,rgba(255,61,203,.16) 52%,transparent 64%);mix-blend-mode:screen;pointer-events:none}
.vimg .qty{position:absolute;top:8px;right:8px;background:rgba(11,8,32,.88);color:#fff;font-family:var(--disp);font-weight:700;font-size:13px;padding:2px 8px;border-radius:3px;border:1px solid var(--line)}
.vimg:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.vinfo{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.vinfo .n{font-family:var(--disp);font-weight:700;font-size:14.5px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vinfo .m{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vb{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.vw{display:flex;gap:6px;margin-top:auto;padding-top:9px}.vinfo .vw .vwant{flex:1;justify-content:center}
.vw .wq{width:auto;padding:3px 6px}
.vmore{display:flex;gap:12px;align-items:center;justify-content:center;margin:22px 0}
.vempty{text-align:center;padding:40px 16px}
.vskel{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:18px}.vskel i{aspect-ratio:63/100;border-radius:6px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:vsk 1.2s linear infinite}
@keyframes vsk{to{background-position:-200% 0}}
.vdetail{display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:24px;align-items:start}.vdetail .cimg{width:100%}
.vdl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:0}.vdl dt{color:var(--muted)}.vdl dd{margin:0}
@media (max-width:760px){
  .vhero{padding:22px 18px}.vhero h1{font-size:30px}
  .vtools{position:static;margin:0 0 6px;padding:4px 0 8px;background:none;backdrop-filter:none}
  #gbar .selin{flex-wrap:wrap;gap:6px}#gbar [data-g=copy]{display:none}
  .vgrid,.vskel{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .vinfo{padding:8px 9px 10px}.vinfo .n{font-size:13.5px}
  .vdetail{grid-template-columns:1fr}.vdetail .cimg{max-width:240px;margin:0 auto}
}
@media (prefers-reduced-motion:reduce){.vskel i{animation:none}.vcard{transition:none}}
/* etichette rarità */
.b.rar{border:1px solid transparent;font-family:var(--disp);font-weight:700;letter-spacing:.2px;padding:1px 7px}
.b.var{background:#211b47;color:#a198cf;font-weight:600;font-size:11px;vertical-align:1px}
.b.buy{background:#123a4a;color:#8eeaff}
.b.r-x{background:#2a1d5c;color:#d9ccff}
.b.r-common{background:#2a2550;color:#c3bde3;border-color:#3a3470!important}
.b.r-unc{background:#173a33;color:#9fe8cc;border-color:#25594d!important}
.b.r-rare{background:linear-gradient(180deg,#6a7194,#424866);color:#fff;border-color:#9aa3c8!important}
.b.r-super{background:linear-gradient(180deg,#2f6bff,#1a44c4);color:#fff;border-color:#6f97ff!important}
.b.r-ultra{background:linear-gradient(135deg,#ffe58f,#d8a21c 55%,#ffd65a);color:#2a1a00;border-color:#fff0b8!important}
.b.r-ultimate{background:linear-gradient(180deg,#c0803f,#7a4317);color:#ffe9d1;border-color:#e0a066!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.35)}
.b.r-gold{background:linear-gradient(135deg,#fff1a8,#c99a0e 45%,#ffe066 70%,#a87b00);color:#241700;border-color:#ffe066!important}
.b.r-secret{background:linear-gradient(110deg,#ff8ad8,#9bb8ff 35%,#86f5d6 65%,#ffe88a);color:#1c0d33;border-color:rgba(255,255,255,.55)!important}
.b.r-plat{background:linear-gradient(110deg,#ffffff,#b8c2e2 35%,#efe3ff 65%,#cfd8f0);color:#191b33;border-color:#ffffff!important;box-shadow:0 0 8px rgba(220,225,255,.35)}
.b.r-qcsr{background:linear-gradient(110deg,#ffd75e,#ff8ad8 30%,#9bb8ff 60%,#ffd75e);color:#1c0d33;border-color:#ffe9a6!important;box-shadow:0 0 8px rgba(255,215,94,.4)}
.b.r-prism{background:repeating-linear-gradient(115deg,#ff7aa5 0 7px,#ffd56b 7px 14px,#7ff2a8 14px 21px,#6fcaff 21px 28px,#c09bff 28px 35px);color:#1c0d33;border-color:#fff!important;text-shadow:0 0 3px rgba(255,255,255,.9)}
.b.r-star{background:radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 75% 65%,#fff 0 1px,transparent 1.5px),linear-gradient(110deg,#1a1050,#2b1a7a);color:#fff;border-color:#a28cff!important;box-shadow:0 0 10px rgba(162,140,255,.55)}
.b.r-star::before{content:"✦ "}
.b.r-ghost{background:rgba(255,255,255,.05);color:#f6f6ff;border-color:#e6e6ff!important;text-shadow:0 0 6px rgba(255,255,255,.9)}
.b.r-coll{background:linear-gradient(110deg,#17cfc0,#4b7bff 50%,#c56bff);color:#fff;border-color:#8ff5ec!important}
.b.r-foil{background:linear-gradient(110deg,#6a39d6,#b25bff);color:#fff;border-color:#c99bff!important}
.b.r-holo{background:linear-gradient(110deg,#2f66f2,#62dcff);color:#06142e;border-color:#9eeaff!important}
.b.r-double{background:linear-gradient(180deg,#e0405e,#9e1f39);color:#fff;border-color:#ff8aa0!important}
.b.r-ir{background:linear-gradient(110deg,#14a39a,#5fe3b2);color:#03291f;border-color:#a2f5d6!important}
.b.r-sir{background:linear-gradient(110deg,#ff8ad8,#ffd75e 50%,#86f5d6);color:#1c0d33;border-color:#fff!important}
.b.r-leader{background:linear-gradient(180deg,#e2262f,#8e0f16);color:#fff;border-color:#ff7880!important}

/* carrello vetrina */
#gcartn{color:var(--neon)}
.cartbar .cicon{font-size:20px;margin-right:4px}
.cart{display:flex;flex-direction:column;gap:10px}
.citem{display:grid;grid-template-columns:64px 1fr auto auto;gap:14px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--card2)}
.cthumb.cimg{width:64px;border-radius:4px;box-shadow:none}.cthumb .ph{padding:4px}.cthumb .ph b,.cthumb .ph small{display:none}.cthumb .gicon{width:30px;height:30px;font-size:10px}
.cinfo{min-width:0}.cinfo .n{font-family:var(--disp);font-weight:700;font-size:15px;line-height:1.2}
.cqty{text-align:center}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--inp)}
.stepper button{width:34px;height:34px;border:0;background:transparent;color:var(--text);font-size:18px;cursor:pointer;font-family:var(--disp)}
.stepper button:hover:not(:disabled){background:var(--hover);color:var(--blue)}.stepper button:disabled{opacity:.3;cursor:default}
.stepper b{min-width:34px;text-align:center;font-family:var(--disp);font-size:16px}
.ctot{display:flex;gap:12px;align-items:center;padding:12px 4px 2px;border-top:1px solid var(--line);margin-top:4px}.ctot b{font-family:var(--disp);font-size:16px;flex:1}
.cform{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.cerr{color:var(--red);margin-top:8px}
@media (max-width:760px){.citem{grid-template-columns:52px 1fr;gap:10px}.cthumb.cimg{width:52px}.cqty{grid-column:2;text-align:left;display:flex;gap:10px;align-items:center}.cdel{grid-column:2;justify-self:start}}

/* richieste */
.nbadge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--neon);color:#0b0820;font-size:11px;font-weight:700;margin-left:4px;vertical-align:1px;text-shadow:none}
a.panel.banner.req{border-color:#1f7a7c;background:linear-gradient(90deg,rgba(45,226,230,.14),var(--card))}
.rq .rqn{font-family:var(--disp);font-size:17px}.rq.evasa,.rq.annullata{opacity:.72}
.rq .acts{display:flex;gap:6px;flex-wrap:wrap}
.rqnote{padding:10px 16px;border-bottom:1px solid var(--line2);background:rgba(255,225,77,.06);font-size:14px}
/* carrello: invio */
.btn.big{padding:10px 22px;font-size:15px}
.cfall{margin-top:12px;padding:10px 12px;border:1px dashed var(--line);border-radius:4px}.cfb{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

<body>
<div id="busy"></div>
<div id="root"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* =====================================================================
   CONFIGURAZIONE OPZIONALE
   Se incolli qui URL e chiave "anon public" del tuo progetto Supabase,
   l'app non te li chiederà su nessun dispositivo (PC e telefono).
   ===================================================================== */
const SUPABASE_URL = '';
const SUPABASE_ANON_KEY = '';

/* ===================== utilità ===================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EUR = new Intl.NumberFormat('it-IT', {style:'currency', currency:'EUR'});
const eur = n => (n == null || isNaN(n)) ? '—' : EUR.format(n);
const signEur = n => (n == null || isNaN(n)) ? '—' : `<span class="${n >= 0 ? 'pos' : 'neg'}">${n > 0 ? '+' : ''}${EUR.format(n)}</span>`;
const pad = n => String(n).padStart(2, '0');
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoLocal(new Date());
const fdate = d => d ? d.slice(0,10).split('-').reverse().join('/') : '—';
const MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const fmonth = m => { const [y, mm] = m.split('-'); return `${MESI[+mm-1]} ${y}`; };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c === 'x' ? r : (r&3|8)).toString(16); }));
const clean = s => String(s ?? '').replace(/\s+/g, ' ').trim();
const norm = s => clean(s).toLowerCase();
const fold = s => norm(s).normalize('NFD').replace(/[̀-ͯ]/g, '');
const keyOf = c => [c.game, c.expansion, c.name, c.rarity].map(norm).join('|');
const sum = (a, f) => a.reduce((t, x) => t + (f(x) || 0), 0);
const round2 = n => Math.round(n * 100) / 100;
const enc = s => encodeURIComponent(s === '' ? '~' : s);
const dec = s => { const v = decodeURIComponent(s); return v === '~' ? '' : v; };
function num(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).replace(/[€\s]/g, '').replace(/eur/i, '');
  if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, '');
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

const GAMES = ['Yu-Gi-Oh!', 'Pokémon', 'One Piece'];
function gameName(v){
  const s = fold(v);
  if (!s) return '';
  if (/yu.?gi/.test(s)) return 'Yu-Gi-Oh!';
  if (/pok/.test(s)) return 'Pokémon';
  if (/one.?piece/.test(s)) return 'One Piece';
  if (/magic|mtg/.test(s)) return 'Magic';
  if (/lorcana/.test(s)) return 'Lorcana';
  return clean(v);
}
const gameCls = g => g === 'Yu-Gi-Oh!' ? 'g-ygo' : g === 'Pokémon' ? 'g-pkm' : g === 'One Piece' ? 'g-op' : 'g-x';
const gameAbbr = g => g === 'Yu-Gi-Oh!' ? 'YGO' : g === 'Pokémon' ? 'PKM' : g === 'One Piece' ? 'OP' : (g || '?').slice(0,3).toUpperCase();

const CONDS = ['MT','NM','EX','GD','LP','PL','PO'];
const COND_LBL = {MT:'Mint', NM:'Near Mint', EX:'Excellent', GD:'Good', LP:'Light Played', PL:'Played', PO:'Poor'};
function normCond(v){
  const s = fold(v); if (!s) return 'NM';
  const u = s.toUpperCase(); if (CONDS.includes(u)) return u;
  const map = [[/^near ?mint|^nm/, 'NM'], [/^mint|^perfett/, 'MT'], [/excellent|slightly|ottim/, 'EX'], [/^good|moderately|buon/, 'GD'],
               [/light|^played|^lp/, 'LP'], [/heavily|^pl/, 'PL'], [/poor|damag|rovinat/, 'PO']];
  for (const [re, c] of map) if (re.test(s)) return c;
  return clean(v).toUpperCase().slice(0, 12);
}
const condB = c => c ? `<span class="b ${CONDS.includes(c) ? 'c-'+c : 'c-x'}" title="${esc(COND_LBL[c] || c)}">${esc(c)}</span>` : '';
const LANGS = ['IT','EN-EU','EN-US','EN','DE','FR','ES','PT','JP','KR','CN'];
const LANG_LBL = {IT: 'Italiano', 'EN-EU': 'Inglese europeo', 'EN-US': 'Inglese americano', EN: 'Inglese (non specificato)', DE: 'Tedesco', FR: 'Francese', ES: 'Spagnolo', PT: 'Portoghese', JP: 'Giapponese', KR: 'Coreano', CN: 'Cinese'};
/** bandierine SVG per lingua (gli emoji bandiera non si vedono su Windows) */
const FLAG_SVG = (() => {
  const v = (a, b, c) => `<rect width="7" height="14" fill="${a}"/><rect x="7" width="6" height="14" fill="${b}"/><rect x="13" width="7" height="14" fill="${c}"/>`;
  let us = '<rect width="20" height="14" fill="#fff"/>';
  for (let i = 0; i < 7; i += 2) us += `<rect y="${i * 2}" width="20" height="2" fill="#b22234"/>`;
  us += '<rect width="9" height="8" fill="#3c3b6e"/>';
  for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) us += `<circle cx="${1.3 + c * 2.1}" cy="${1.4 + r * 2.6}" r=".55" fill="#fff"/>`;
  return {
    IT: v('#009246', '#fff', '#ce2b37'), FR: v('#0055a4', '#fff', '#ef4135'),
    DE: '<rect width="20" height="14" fill="#ffce00"/><rect width="20" height="9.33" fill="#dd0000"/><rect width="20" height="4.67" fill="#000"/>',
    ES: '<rect width="20" height="14" fill="#aa151b"/><rect y="3.5" width="20" height="7" fill="#f1bf00"/>',
    PT: '<rect width="20" height="14" fill="#da291c"/><rect width="8" height="14" fill="#046a38"/><circle cx="8" cy="7" r="2.6" fill="#ffe900"/>',
    JP: '<rect width="20" height="14" fill="#fff"/><circle cx="10" cy="7" r="4" fill="#bc002d"/>',
    KR: '<rect width="20" height="14" fill="#fff"/><path d="M6.5 7a3.5 3.5 0 0 1 7 0z" fill="#cd2e3a"/><path d="M6.5 7a3.5 3.5 0 0 0 7 0z" fill="#0047a0"/>',
    CN: '<rect width="20" height="14" fill="#de2910"/><path d="M4 2l.9 2.6H7.6L5.4 6.2l.8 2.6L4 7.2 1.8 8.8l.8-2.6L.4 4.6h2.7z" fill="#ffde00"/>',
    'EN-US': us,
    'EN-EU': '<rect width="20" height="14" fill="#012169"/><path d="M0 0L20 14M20 0L0 14" stroke="#fff" stroke-width="2.8"/><path d="M0 0L20 14M20 0L0 14" stroke="#c8102e" stroke-width="1"/><path d="M10 0v14M0 7h20" stroke="#fff" stroke-width="4.2"/><path d="M10 0v14M0 7h20" stroke="#c8102e" stroke-width="2.4"/>',
  };
})();
const LANG_SHORT = {'EN-US': 'EN', 'EN-EU': 'EN'};
/** etichetta lingua con bandierina: EN-US bandiera USA, EN-EU bandiera UK, EN senza bandiera (non specificato) */
const langB = l => { if (!l) return ''; const k = String(l).toUpperCase(), f = FLAG_SVG[k];
  return `<span class="b lang" title="${esc(LANG_LBL[k] || l)}">${f ? `<svg class="flag" viewBox="0 0 20 14" aria-hidden="true">${f}</svg>` : ''}${esc(LANG_SHORT[k] || l)}${!f && k === 'EN' ? '<span class="lq">?</span>' : ''}</span>`; };
const availLangs = id => [...new Set(copiesOf(id).filter(x => x.status !== 'venduto').map(x => x.language).filter(Boolean))];
const langOpts = sel => LANGS.map(l => opt(l, sel, `${l} – ${LANG_LBL[l]}`)).join('');
const RARITIES = {
  'Yu-Gi-Oh!': ['Common','Rare','Super Rare','Ultra Rare','Secret Rare','Ultimate Rare','Ghost Rare','Starlight Rare','Collector\'s Rare','Quarter Century Secret Rare','Prismatic Secret Rare','Platinum Secret Rare','Gold Rare','Premium Gold Rare','Short Print'],
  'Pokémon': ['Common','Uncommon','Rare','Rare Holo','Double Rare','Ultra Rare','Illustration Rare','Special Illustration Rare','Hyper Rare','ACE SPEC Rare','Shiny Rare','Promo'],
  'One Piece': ['C','UC','R','SR','SEC','L','SP','TR','P']
};
const EDITIONS = ['1st Edition','Unlimited','Limited Edition','Reprint'];
const PLATFORMS = ['Cardmarket','CardTrader','Vinted','IRL','eBay','Vetrina','Altro'];
/** menu a tendina piattaforma; un valore vecchio fuori elenco resta selezionabile */
const platSel = (val, empty = false) => `<select class="inp" name="platform">${empty ? opt('', val || '', '—') : ''}${(val && !PLATFORMS.includes(val) ? [val, ...PLATFORMS] : PLATFORMS).map(p => opt(p, val || '', p === 'IRL' ? 'IRL (di persona)' : p)).join('')}</select>`;

/* ===================== stato & backend ===================== */
const TABLES = ['cards','lots','orders','copies'];
const S = {cards:new Map(), lots:new Map(), orders:new Map(), copies:new Map(), user:null, mode:null};
let sb = null;
const CFG_KEY = 'cardarchive.cfg';
function getCfg(){
  if (SUPABASE_URL && SUPABASE_ANON_KEY) return {mode:'supabase', url:fixUrl(SUPABASE_URL), key:SUPABASE_ANON_KEY, fixed:true};
  try { const c = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); if (c && c.url) c.url = fixUrl(c.url); return c; } catch { return null; }
}
function fixUrl(u){
  u = clean(u).replace(/^["']|["']$/g, '');
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try {
    const x = new URL(u);
    const m = x.pathname.match(/\/project\/([a-z0-9]{10,})/i);
    if (/supabase\.com$/i.test(x.hostname) && m) return `https://${m[1]}.supabase.co`;
    return 'https://' + x.hostname;
  } catch { return u; }
}
const setCfg = c => c ? localStorage.setItem(CFG_KEY, JSON.stringify(c)) : localStorage.removeItem(CFG_KEY);

const LS = {
  get: t => { try { return JSON.parse(localStorage.getItem('cardarchive.local.'+t) || '[]'); } catch { return []; } },
  put: (t, rows) => localStorage.setItem('cardarchive.local.'+t, JSON.stringify(rows))
};
const chunk = (a, n) => { const r = []; for (let i = 0; i < a.length; i += n) r.push(a.slice(i, i+n)); return r; };
const strip = r => { const o = {...r}; delete o.user_id; return o; };
const dbRow = r => { const drop = [S.noOrders && 'order_id', S.noCmId && 'cm_id', S.noAsk && 'ask_price', S.noAsk && 'ask_date', S.noLoc && 'location', S.noShip && 'ship_status', S.noShip && 'tracking', S.noShip && 'shipped_date'].filter(k => k && k in r); if (!drop.length) return r; const o = {...r}; drop.forEach(k => delete o[k]); return o; };
/** se il database non ha ancora una colonna nuova, la segna come mancante e riprova senza */
const colMissing = e => { const m = /'(cm_id|order_id|ask_price|ask_date|location|ship_status|tracking|shipped_date)' column/.exec(e?.message || ''); if (!m) return false; if (m[1] === 'location') S.noLoc = true; else if (/^(ship|track)/.test(m[1])) S.noShip = true; else if (/^ask/.test(m[1])) S.noAsk = true; else if (m[1] === 'cm_id') S.noCmId = true; else S.noOrders = true; return true; };

const DB = {
  async fetchAll(t){
    if (S.mode === 'local') return LS.get(t);
    const all = [];
    for (let from = 0; ; from += 1000){
      const {data, error} = await sb.from(t).select('*').order('created_at').range(from, from + 999);
      if (error) throw error;
      all.push(...data);
      if (data.length < 1000) break;
    }
    return all;
  },
  async insert(t, rows){
    if (S.mode === 'local'){ LS.put(t, LS.get(t).concat(rows)); return; }
    for (const c of chunk(rows, 500)){ let {error} = await sb.from(t).insert(c.map(strip).map(dbRow)); if (error && colMissing(error)) ({error} = await sb.from(t).insert(c.map(strip).map(dbRow))); if (error) throw error; }
  },
  async upsert(t, rows){
    if (S.mode === 'local'){ const m = new Map(LS.get(t).map(r => [r.id, r])); rows.forEach(r => m.set(r.id, r)); LS.put(t, [...m.values()]); return; }
    for (const c of chunk(rows, 500)){ let {error} = await sb.from(t).upsert(c.map(dbRow)); if (error && colMissing(error)) ({error} = await sb.from(t).upsert(c.map(dbRow))); if (error) throw error; }
  },
  async update(t, ids, patch){
    if (S.mode === 'local'){ const set = new Set(ids); LS.put(t, LS.get(t).map(r => set.has(r.id) ? {...r, ...patch} : r)); return; }
    for (const c of chunk(ids, 200)){ if (!Object.keys(dbRow(patch)).length) return; let {error} = await sb.from(t).update(dbRow(patch)).in('id', c); if (error && colMissing(error)) ({error} = await sb.from(t).update(dbRow(patch)).in('id', c)); if (error) throw error; }
  },
  async remove(t, ids){
    if (S.mode === 'local'){ const set = new Set(ids); LS.put(t, LS.get(t).filter(r => !set.has(r.id))); return; }
    for (const c of chunk(ids, 200)){ const {error} = await sb.from(t).delete().in('id', c); if (error) throw error; }
  }
};

function normRow(t, r){
  const o = {...r};
  if (t === 'orders'){ ['shipping_charged', 'shipping_cost', 'fee'].forEach(k => o[k] = Number(o[k]) || 0); }
  if (t === 'copies'){ o.order_id = o.order_id ?? null; o.ask_price = o.ask_price == null ? null : Number(o.ask_price); o.qty = Number(o.qty) || 1; o.buy_price = o.buy_price == null ? null : Number(o.buy_price); o.sell_price = o.sell_price == null ? null : Number(o.sell_price); }
  if (t === 'lots') o.total_price = Number(o.total_price) || 0;
  return o;
}
const rows0 = m => m.values().next().value;
async function loadAll(){
  busy(true);
  try {
    S.noOrders = false;
    for (const t of TABLES){
      let rows;
      try { rows = await DB.fetchAll(t); }
      catch (e){ if (t === 'orders' && /orders|schema cache|does not exist/i.test(e.message || '')){ S.noOrders = true; rows = []; } else throw e; }
      S[t] = new Map(rows.map(r => [r.id, normRow(t, r)]));
    }
    S.noCmId = S.mode === 'supabase' && rows0(S.cards) && !('cm_id' in rows0(S.cards));
    S.noAsk = S.mode === 'supabase' && rows0(S.copies) && !('ask_price' in rows0(S.copies));
    S.noLoc = S.mode === 'supabase' && rows0(S.copies) && !('location' in rows0(S.copies));
    S.noShip = S.mode === 'supabase' && !S.noOrders && rows0(S.orders) && !('ship_status' in rows0(S.orders));
    await loadRequests();
  } finally { busy(false); }
}

/* ===== impostazioni (commissioni, spedizioni) ===== */
const PLAT_DEFAULT = {Cardmarket: {pct: 5, fixed: 0}, CardTrader: {pct: 0, fixed: 0}, eBay: {pct: 0, fixed: 0}, Vinted: {pct: 0, fixed: 0}, IRL: {pct: 0, fixed: 0}, Altro: {pct: 0, fixed: 0}};
let SET = {fees: JSON.parse(JSON.stringify(PLAT_DEFAULT)), shipCost: 0, shipCharged: 0, stale: 6, langAdj: {}, enDefault: 'EN-EU'};
function mergeSet(j){ if (!j) return; SET = {...SET, ...j, fees: {...JSON.parse(JSON.stringify(PLAT_DEFAULT)), ...(j.fees || {})}, langAdj: {...(j.langAdj || SET.langAdj || {})}}; }
async function loadSettings(){
  try { mergeSet(JSON.parse(localStorage.getItem('cardarchive.settings') || 'null')); } catch {}
  if (S.mode !== 'supabase') return;
  try { const {data, error} = await sb.from('settings').select('data').maybeSingle(); if (!error && data?.data) mergeSet(data.data); } catch {}
}
async function saveSettings(){
  localStorage.setItem('cardarchive.settings', JSON.stringify(SET));
  if (S.mode !== 'supabase') return;
  const {error} = await sb.from('settings').upsert({user_id: S.user.id, data: SET, updated_at: new Date().toISOString()});
  if (error) toast('Salvate solo su questo dispositivo: riesegui schema.sql su Supabase', 'err');
}
const feeCfg = platform => { const k = Object.keys(SET.fees).find(x => fold(x) === fold(platform)); return k ? SET.fees[k] : null; };
const feeFor = (platform, items) => { const f = feeCfg(platform); return f && items ? round2(items * (f.pct || 0) / 100 + (f.fixed || 0)) : 0; };

/* ===== transazioni con annullamento ===== */
const undoStack = [];
let txChain = Promise.resolve();          // le modifiche vengono eseguite una alla volta, in ordine
const txInflight = new Set();             // stessa modifica già in corso (doppio clic) → ignorata
function commit(label, fn){
  if (PV.on){ toast('Sei in anteprima: premi “Salva tutto” o “Esci senza salvare” prima di modificare', 'err'); return Promise.resolve(false); }
  if (txInflight.has(label)) return Promise.resolve(false);
  txInflight.add(label);
  const run = txChain.then(() => commitNow(label, fn)).finally(() => txInflight.delete(label));
  txChain = run.catch(() => {});
  return run;
}
async function commitNow(label, fn){
  const inv = [];
  const tx = {
    async insert(t, rows){
      rows = [].concat(rows); if (!rows.length) return;
      rows = rows.map(r => ({created_at: new Date().toISOString(), ...r}));
      await DB.insert(t, rows); rows.forEach(r => S[t].set(r.id, normRow(t, r)));
      inv.push({op:'remove', t, ids: rows.map(r => r.id)});
    },
    async update(t, ids, patch){
      ids = [].concat(ids).filter(id => S[t].has(id)); if (!ids.length) return;
      const olds = ids.map(id => ({...S[t].get(id)}));
      await DB.update(t, ids, patch); ids.forEach(id => S[t].set(id, normRow(t, {...S[t].get(id), ...patch})));
      inv.push({op:'upsert', t, rows: olds});
    },
    async upsertRows(t, rows){
      rows = rows.filter(r => S[t].has(r.id)); if (!rows.length) return;
      const olds = rows.map(r => ({...S[t].get(r.id)}));
      await DB.upsert(t, rows); rows.forEach(r => S[t].set(r.id, normRow(t, r)));
      inv.push({op:'upsert', t, rows: olds});
    },
    async remove(t, ids){
      ids = [].concat(ids).filter(id => S[t].has(id)); if (!ids.length) return;
      const olds = ids.map(id => ({...S[t].get(id)}));
      await DB.remove(t, ids); ids.forEach(id => S[t].delete(id));
      inv.push({op:'upsert', t, rows: olds});
    }
  };
  busy(true);
  try {
    await fn(tx);
  } catch (e){
    console.error(e);
    try { await applyInverse(inv.reverse()); } catch (e2){ console.error(e2); }
    busy(false); toast('Errore: ' + (e.message || e), 'err'); render(); return false;
  }
  busy(false);
  if (inv.length){ undoStack.push({label, inv: inv.reverse()}); if (undoStack.length > 40) undoStack.shift(); }
  render();
  toast(label, '', inv.length ? 'Annulla' : null);
  return true;
}
async function applyInverse(ops){
  for (const o of ops){
    if (o.op === 'remove'){ await DB.remove(o.t, o.ids); o.ids.forEach(id => S[o.t].delete(id)); }
    else { await DB.upsert(o.t, o.rows); o.rows.forEach(r => S[o.t].set(r.id, normRow(o.t, r))); }
  }
}
function undo(){ const run = txChain.then(undoNow); txChain = run.catch(() => {}); return run; }
async function undoNow(){
  const u = undoStack.pop(); if (!u) return;
  busy(true);
  try { await applyInverse(u.inv); toast('Annullato: ' + u.label); }
  catch (e){ toast('Impossibile annullare: ' + e.message, 'err'); }
  busy(false); render();
}

/* ===================== indici derivati ===================== */
let IX = null;
const OC = new Map(), ESTC = new Map();
function index(){
  const byCard = new Map(), byLot = new Map(), byOrder = new Map();
  OC.clear(); ESTC.clear(); CM.match.clear(); CM.expLearn.clear();

function autocomplete(input, source, onPick){
  const wrap = input.parentElement; wrap.classList.add('acw');
  const box = document.createElement('div'); box.className = 'ac'; wrap.appendChild(box);
  let items = [], sel = -1, req = 0, t;
  const show = list => {
    items = list; sel = -1;
    if (document.activeElement !== input){ box.innerHTML = ''; return; }
    let html = '', lastG = null;
    list.forEach((it, i) => {
      if (it.group && it.group !== lastG){ html += `<div class="hd">${esc(it.group)}</div>`; lastG = it.group; }
      html += `<div class="it" data-i="${i}">${esc(it.label)}${it.subHtml ? `<small>${it.subHtml}</small>` : it.sub ? `<small>${esc(it.sub)}</small>` : ''}</div>`;
    });
    box.innerHTML = html;
  };
  const run = async () => { const my = ++req; const q = input.value.trim(); await source(q, list => { if (my === req) show(list); }); };
  input.setAttribute('autocomplete', 'off');
  input.addEventListener('input', () => { clearTimeout(t); t = setTimeout(run, 220); });
  input.addEventListener('focus', run);
  input.addEventListener('blur', () => setTimeout(() => { box.innerHTML = ''; }, 180));
  input.addEventListener('keydown', e => {
    const els = $$('.it', box); if (!els.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + els.length) % els.length;
      els.forEach((el, i) => el.classList.toggle('on', i === sel)); els[sel].scrollIntoView({block: 'nearest'});
    } else if (e.key === 'Enter' && sel >= 0){ e.preventDefault(); pick(sel); }
    else if (e.key === 'Escape'){ box.innerHTML = ''; e.stopPropagation(); }
  });
  box.addEventListener('mousedown', e => { const it = e.target.closest('.it'); if (it){ e.preventDefault(); pick(+it.dataset.i); } });
  const pick = i => { const it = items[i]; box.innerHTML = ''; req++; onPick(it); };
}

const imgQ = [], imgTried = new Set(); let imgRunning = false;
/** serve un'immagine nuova? sì se manca, o se quella automatica non è della stampa esatta (le foto e le scelte a mano non si toccano) */
function needsImg(c){
  if (!c || !IMG_GAMES.includes(c.game) || noImg().has(c.id)) return false;
  const u = c.image_url, ex = exactImageUrl(c);
  if (!u) return true;
  if (imgIsManual(u)) return false;
  if (ex && !imgHasExact(u, ex)) return true;
  return S.mode === 'supabase' && /^https:\/\/images\.ygoprodeck\.com/.test(u);
}
/** ricerca automatica delle immagini: spenta finché non la accendi tu dalla pagina Dati */
const AUTOIMG_KEY = 'cardarchive.autoimg2';
function queueImages(ids, force = false){
  if (PV.on || (!force && localStorage.getItem(AUTOIMG_KEY) !== 'on')) return;
  ids.forEach(id => { const c = S.cards.get(id); const k = id + '|' + (exactImageUrl(c) || ''); if (!imgTried.has(k) && needsImg(c)){ imgTried.add(k); imgQ.push(id); } });

}
async function runImgQ(){
  if (imgRunning) return; imgRunning = true;
  while (imgQ.length && S.user){
    const id = imgQ.shift(), c = S.cards.get(id);

}

/* ===================== CARDMARKET: catalogo e prezzi di mercato ===================== */
const CM_GAMES = {'Yu-Gi-Oh!': 3, 'Pokémon': 6, 'One Piece': 18};
const CM_SLUG = {3: 'YuGiOh', 6: 'Pokemon', 18: 'OnePiece'};
const CM_REPO = (() => { const m = location.hostname.match(/^([^.]+)\.github\.io$/i), r = location.pathname.split('/').filter(Boolean)[0]; return m && r && !/\.html$/.test(r) ? `${m[1]}/${r}` : 'dsrmn/archivio-carte'; })();
const CM = {idx: {}, loading: {}, byId: new Map(), match: new Map(), expLearn: new Map(), err: {}};
const CM_COND = {1: 'MT', 2: 'NM', 3: 'EX', 4: 'GD', 5: 'LP', 6: 'PL', 7: 'PO'};
const CM_LANG = {1: 'EN', 2: 'FR', 3: 'DE', 4: 'ES', 5: 'IT', 6: 'CN', 7: 'JP', 8: 'PT', 9: 'RU', 10: 'KR', 11: 'TW'};
const cmQuotes = s => String(s ?? '').replace(/""/g, '"');
/** nome "base" per confrontare: senza attacchi [..], senza versioni (V.1 - ...), senza codici (OP01-001) */
const cmBase = s => fold(cmQuotes(s).replace(/\s*\[[^\]]*\]/g, '').replace(/\s*\(V\.\s*\d+[^)]*\)/gi, '').replace(/\s*\((?:[A-Z]{1,6}\d{0,3}[a-z]?-[A-Z]{0,3}\d{1,4}[a-z]?|\d+\/\d+)\)/gi, '').replace(/[“”]/g, '"'));
const cmRar = s => (String(s).match(/\(V\.\s*\d+\s*-\s*([^)]+)\)/i) || [])[1] || '';
const cmDisplayName = (s, gid) => clean(cmQuotes(s).replace(/\s*\[[^\]]*\]/g, '').replace(gid === 3 ? /\s*\(V\.\s*\d+[^)]*\)/gi : /$^/, ''));
const mktPrice = p => p ? (p.trend ?? p.avg30 ?? p.avg7 ?? p.low ?? null) : null;
/** prezzi di mercato Cardmarket nascosti su richiesta: metti true per rimostrarli */
const SHOW_MKT = false;

/** codice stampato sulla carta: "MP22-EN045", "MP22-IT045", "LOB-005", "EVO 12" → chiave senza lingua */
const CODE_LANG = {EN: '', E: '', IT: 'IT', I: 'IT', DE: 'DE', G: 'DE', FR: 'FR', F: 'FR', SP: 'ES', S: 'ES', ES: 'ES', PT: 'PT', P: 'PT', JP: 'JP', JA: 'JP', KR: 'KR', AE: ''};
function codeKey(s){
  const m = String(s || '').toUpperCase().trim().match(/^([A-Z0-9]{2,6})[\s-]+(EN|IT|DE|FR|SP|ES|PT|JP|JA|KR|AE|E|G|F|I|S|P)?0*([A-Z]?\d{1,4}[A-Z]?)$/);
  if (!m || !/[A-Z]/.test(m[1])) return null;
  return {key: m[1] + '-' + m[3], lang: m[2] ? CODE_LANG[m[2]] || '' : ''};
}
/** stampe del catalogo con quel codice (nel formato dei suggerimenti) */
function cmByCode(game, q){
  const gid = CM_GAMES[game], ix = CM.idx[gid], ck = codeKey(q); if (!ix || !ck) return null;
  const ps = ix.byCode.get(ck.key) || [];
  return {lang: ck.lang, list: ps.map(p => ({p, named: !!ix.exp[p.exp], expansion: ix.exp[p.exp] || `Altra espansione (n. ${p.exp})`, rarity: p.rar, rarAll: p.rarAll, code: p.code,
    variant: (cmQuotes(p.name).match(/\(([^)]*)\)\s*$/) || [])[1] || '', name: cmLabel(p, gid)}))};
}
function cmIndexGame(gid, d){
  const cols = d.cols, ix = {gid, game: d.game, createdAt: d.createdAt, exp: d.exp || {}, byName: new Map(), byCode: new Map(), expByName: new Map(), n: d.p.length};
  const at = Object.fromEntries(cols.map((c, i) => [c, i]));
  for (const r of d.p){
    const p = {id: r[at.id], name: r[at.name], exp: r[at.exp], trend: r[at.trend], avg30: r[at.avg30], low: r[at.low], avg7: r[at.avg7], trendFoil: r[at.trendFoil], gid};
    p.rarAll = (at.rar != null && r[at.rar]) || cmRar(p.name) || '';          // può essere "Rare / Starfoil Rare" se Cardmarket non distingue
    p.rar = p.rarAll.includes(' / ') ? '' : p.rarAll;
    p.code = (at.code != null && r[at.code]) || '';
    p.img = (at.img != null && r[at.img]) || '';
    CM.byId.set(p.id, p);
    const k = cmBase(p.name); (ix.byName.get(k) || ix.byName.set(k, []).get(k)).push(p);
    const ck = p.code && codeKey(p.code); if (ck) (ix.byCode.get(ck.key) || ix.byCode.set(ck.key, []).get(ck.key)).push(p);
  }
  for (const [id, n] of Object.entries(ix.exp)){ const k = fold(n); (ix.expByName.get(k) || ix.expByName.set(k, []).get(k)).push(+id); }
  CM.idx[gid] = ix;
}
async function cmLoad(gid){
  if (CM.idx[gid]) return CM.idx[gid];
  if (CM.loading[gid]) return CM.loading[gid];
  CM.loading[gid] = (async () => {
    const url = `https://raw.githubusercontent.com/${CM_REPO}/cm-data/cm_${gid}.json`, stamp = 'cardarchive.cm.' + gid;
    let cache = null, txt = null;
    try { cache = await caches.open('dsr-cm'); } catch {}
    const fresh = Date.now() - (+localStorage.getItem(stamp) || 0) < 6 * 3600e3;
    if (cache && fresh){ const r = await cache.match(url); if (r) txt = await r.text(); }
    if (!txt){
      try {
        const r = await fetch(url, {cache: 'no-cache'}); if (!r.ok) throw new Error('HTTP ' + r.status);
        if (cache) await cache.put(url, r.clone()); txt = await r.text(); localStorage.setItem(stamp, Date.now());
      } catch (e){ if (cache){ const r = await cache.match(url); if (r) txt = await r.text(); } if (!txt) throw e; }
    }
    cmIndexGame(gid, JSON.parse(txt));
    CM.match.clear(); CM.expLearn.clear(); delete CM.err[gid];
    return CM.idx[gid];
  })().catch(e => { delete CM.loading[gid]; CM.err[gid] = e.message || String(e); throw e; });
  return CM.loading[gid];
}
/** carica in sottofondo i listini dei giochi presenti in archivio, poi ridisegna */
async function cmAutoload(all = false){
  const gids = all ? Object.values(CM_GAMES) : [...new Set([...S.cards.values()].map(c => CM_GAMES[c.game]).filter(Boolean))];
  const todo = gids.filter(g => !CM.idx[g] && !CM.loading[g] && (all || !CM.err[g])); if (!todo.length) return;
  await Promise.allSettled(todo.map(cmLoad));
  const a = document.activeElement, typing = a && /INPUT|TEXTAREA/.test(a.tagName) && $('#app')?.contains(a);
  if (S.user && !typing) render();
}
/** id delle espansioni Cardmarket che corrispondono al nome di espansione usato nell'archivio */
function cmExpIds(game, expName){
  const gid = CM_GAMES[game], ix = CM.idx[gid]; const out = new Set(); if (!ix || !expName) return out;
  const f = fold(expName);
  (ix.expByName.get(f) || []).forEach(id => out.add(id));
  if (!out.size && f.length >= 5) for (const [k, ids] of ix.expByName) if (k.length >= 5 && (k.includes(f) || f.includes(k))) ids.forEach(id => out.add(id));
  const lk = game + '|' + f;
  if (!CM.expLearn.has(lk)){ // impara dalle carte dell'archivio: in quale espansione Cardmarket stanno quasi tutte?
    const cards = [...S.cards.values()].filter(c => c.game === game && fold(c.expansion) === f);
    const cnt = new Map();
    for (const c of cards){ const ids = new Set((ix.byName.get(cmBase(c.name)) || []).map(p => p.exp)); ids.forEach(id => cnt.set(id, (cnt.get(id) || 0) + 1)); }
    const best = [...cnt.entries()].sort((a, b) => b[1] - a[1]);
    CM.expLearn.set(lk, best.length && best[0][1] >= 2 && best[0][1] >= cards.length * .6 && (!best[1] || best[1][1] < best[0][1]) ? best[0][0] : null);
  }
  const learned = CM.expLearn.get(lk); if (learned) out.add(learned);
  return out;
}
function cmMatch(card){
  const gid = CM_GAMES[card.game], ix = CM.idx[gid]; if (!ix) return {status: 'loading', cands: []};
  const all = ix.byName.get(cmBase(card.name)) || [];
  if (!all.length) return {status: 'none', cands: []};
  let c = all;
  const ids = cmExpIds(card.game, card.expansion);
  if (ids.size){ const f = c.filter(p => ids.has(p.exp)); if (f.length) c = f; }
  else if (card.expansion && c.length > 1){ const f = c.filter(p => fold(ix.exp[p.exp] || '').includes(fold(card.expansion)) || fold(card.expansion).includes(fold(ix.exp[p.exp] || '~~~'))); if (f.length) c = f; }
  if (c.length > 1){ // lingua: le carte giapponesi stanno nelle espansioni (Japanese)/OCG
    const langs = new Set(copiesOf(card.id).map(x => x.language).filter(Boolean));
    const jp = p => /japanese|ocg|\(jp\)/i.test(ix.exp[p.exp] || '');
    const f = langs.size === 1 && langs.has('JP') ? c.filter(jp) : c.filter(p => !jp(p));
    if (f.length) c = f;
  }
  if (c.length > 1 && card.rarity){ const r = fold(card.rarity); const f = c.filter(p => p.rar && fold(p.rar) === r); if (f.length) c = f; else { const nf = c.filter(p => !p.rar); if (nf.length && nf.length < c.length) c = nf; } }
  if (c.length === 1) return {status: 'ok', p: c[0], cands: all};
  if (new Set(c.map(p => p.exp)).size === 1){ const s = [...c].sort((a, b) => (mktPrice(a) ?? 1e9) - (mktPrice(b) ?? 1e9)); return {status: 'ok', p: s[0], cands: all, guessed: true}; }
  return {status: 'ambiguous', cands: c};
}
/** prodotto Cardmarket della carta (scelto a mano o trovato in automatico) */
function cmFor(card){
  if (!card || !CM_GAMES[card.game]) return null;
  if (card.cm_id === -1 || card.cm_id === '-1') return null;
  if (card.cm_id) return CM.byId.get(Number(card.cm_id)) || null;
  if (!CM.match.has(card.id)){ const r = cmMatch(card); if (r.status === 'loading') return null; CM.match.set(card.id, r.status === 'ok' ? r.p : null); }
  return CM.match.get(card.id);
}
/** correzione % del prezzo di mercato per la lingua della copia (impostazioni) */
const langFactor = () => 1;
function mktUnit(card, copy){
  if (!SHOW_MKT) return null;
  const p = cmFor(card); if (!p) return null;
  const base = copy && /foil|reverse/i.test(copy.notes || '') && p.trendFoil ? p.trendFoil : mktPrice(p);
  return base == null ? null : copy ? base * langFactor(copy.language) : base;
}
/** stima di una copia: prezzo di mercato corretto per lingua, altrimenti il tuo prezzo medio di vendita */
const estCopy = (card, copy) => mktUnit(card, copy) ?? estUnit(card.id);
const mktArrow = () => '';
const mktCell = card => { const p = cmFor(card), v = mktPrice(p); return v == null ? '<span class="muted">—</span>' : `${eur(v)} ${mktArrow(p)}`; };
/** link alla carta su Cardmarket (ricerca per nome) */
const cmUrl = (card, p) => {
  const slug = CM_SLUG[CM_GAMES[card.game]] || 'YuGiOh';
  const q = encodeURIComponent(clean(cmQuotes(p ? p.name : card.name).replace(/\s*\[[^\]]*\]/g, '').replace(/\s*\(V\.\s*\d+[^)]*\)/gi, '')));
  return `https://www.cardmarket.com/it/${slug}/Products/Search?searchString=${q}`;
};
function cmPanel(card){

      <a class="btn sm" href="${cmUrl(card, p)}" target="_blank" rel="noopener">Apri su Cardmarket ↗</a><button class="btn sm" data-act="cmPick" data-id="${card.id}">Cambia</button></div>
    ${SHOW_MKT ? `<div class="cmgrid"><div><span>Trend</span><b>${eur(p.trend)}</b>${mktArrow(p)}</div><div><span>Media 30 gg</span><b>${eur(p.avg30)}</b></div><div><span>Media 7 gg</span><b>${eur(p.avg7)}</b></div><div><span>Da</span><b>${eur(p.low)}</b></div>${p.trendFoil ? `<div><span>Trend foil</span><b>${eur(p.trendFoil)}</b></div>` : ''}</div>` : ''}</div>`;
}
/** nomi di carte del catalogo Cardmarket che iniziano/contengono il testo */
function cmNameSuggest(game, q, limit = 10){
  const gid = CM_GAMES[game], ix = CM.idx[gid], f = cmBase(q); if (!ix || f.length < 2) return [];
  const starts = [], inc = [];
  for (const [k, ps] of ix.byName){
    if (k.startsWith(f)) starts.push([k, ps]); else if (inc.length < 60 && k.includes(f)) inc.push([k, ps]);
    if (starts.length >= 200) break;
  }
  return [...starts.sort((a, b) => a[0].length - b[0].length), ...inc.sort((a, b) => a[0].length - b[0].length)].slice(0, limit)
    .map(([k, ps]) => ({label: cmLabel(ps[0], gid), ps}));
}
const cmLabel = (p, gid) => clean(cmDisplayName(p.name, gid).replace(/\s*\((?:[A-Z]{1,6}\d{0,3}[a-z]?-[A-Z]{0,3}\d{1,4}[a-z]?|\d+\/\d+|V\.\s*\d+[^)]*)\)/gi, ''));
/** tutte le espansioni (stampe) Cardmarket di una carta, dal nome */
function cmPrintings(game, name){
  const gid = CM_GAMES[game], ix = CM.idx[gid]; if (!ix || !clean(name)) return [];
  const list = (ix.byName.get(cmBase(name)) || []).map(p => ({p, named: !!ix.exp[p.exp], expansion: ix.exp[p.exp] || `Altra espansione (n. ${p.exp})`, rarity: p.rar, rarAll: p.rarAll, code: p.code,
    variant: (cmQuotes(p.name).match(/\(([^)]*)\)\s*$/) || [])[1] || ''}))
    .sort((a, b) => (b.named - a.named) || a.expansion.localeCompare(b.expansion) || (mktPrice(a.p) ?? 0) - (mktPrice(b.p) ?? 0));
  const seen = {};
  list.forEach(x => { const k = x.expansion + '|' + x.variant; seen[k] = (seen[k] || 0) + 1; x.n = seen[k]; });
  list.forEach(x => { if (seen[x.expansion + '|' + x.variant] > 1) x.variant = [x.variant, 'versione ' + x.n].filter(Boolean).join(' · '); });
  return list;
}

/** stampe che corrispondono a "nome carta [parole di set, codice o rarità]" */
function cmSearchPrintings(game, q, limit = 40){
  const words = fold(cmQuotes(q)).replace(/[^a-z0-9 ]/g, ' ').split(' ').filter(Boolean);
  for (let k = words.length; k >= 1; k--){
    const rest = words.slice(k), names = cmNameSuggest(game, words.slice(0, k).join(' '), rest.length ? 8 : 4);
    if (!names.length) continue;
    const out = [];
    for (const n of names) for (const x of cmPrintings(game, n.label)){
      const t = fold(`${x.expansion} ${x.rarAll} ${x.code} ${x.variant}`).replace(/[^a-z0-9 ]/g, ' ');
      if (rest.every(w => t.includes(w))) out.push({...x, name: n.label});
    }
    if (out.length) return out.slice(0, limit);
  }
  return [];
}

function cmPickForm(cardId){
  const card = S.cards.get(cardId), gid = CM_GAMES[card.game], ix = CM.idx[gid];
  if (!ix){ toast('Listino Cardmarket non ancora caricato', 'err'); return; }
  const render2 = (list, m) => {
    $('#cml', m).innerHTML = list.length ? list.slice(0, 60).map(p => `<div class="cmi" data-id="${p.id}"><div class="grow"><b>${esc(cmQuotes(p.name))}</b><div class="small muted">${esc(ix.exp[p.exp] || 'espansione ' + p.exp)}</div></div>${SHOW_MKT ? `<div class="right"><b>${eur(mktPrice(p))}</b>${p.low != null ? `<div class="small muted">da ${eur(p.low)}</div>` : ''}</div>` : ''}</div>`).join('')
      : '<div class="empty">Nessun risultato.</div>';
    $$('.cmi', m).forEach(el => el.onclick = async () => { closeModal(); await commit(`Collegata a Cardmarket: ${card.name}`, tx => tx.update('cards', cardId, {cm_id: +el.dataset.id})); });

/* ===== import CSV di Cardmarket (idProduct, groupCount, price…) ===== */
const isCmCsv = aoa => { const h = (aoa[0] || []).map(x => String(x).trim().toLowerCase()); return h.includes('idproduct') && (h.includes('groupcount') || h.includes('amount')) && h.includes('price'); };
function cmParseRows(aoa){
  const h = aoa[0].map(x => String(x).trim().toLowerCase()), col = n => h.indexOf(n.toLowerCase());
  const flag = (r, n) => col(n) >= 0 && /^(1|true|x|y|yes)$/i.test(String(r[col(n)] ?? '').trim());
  const out = [];
  for (const r of aoa.slice(1)){
    const id = parseInt(r[col('idProduct')]); if (!id) continue;
    let qty = parseInt(r[col('groupCount') >= 0 ? col('groupCount') : col('amount')]) || 1, unit = num(r[col('price')]) || 0;
    if (flag(r, 'isPlayset')){ qty *= 4; unit /= 4; }
    const p = CM.byId.get(id), gid = p?.gid;
    const notes = [flag(r, 'isFoil') && 'Foil', flag(r, 'isReverseHolo') && 'Reverse Holo', flag(r, 'isSigned') && 'Firmata', flag(r, 'isAltered') && 'Alterata'].filter(Boolean).join(' · ') || null;
    out.push({id, p, qty, unit: round2(unit), condition: CM_COND[+r[col('condition')]] || 'NM', language: (l => l === 'EN' ? (SET.enDefault || 'EN') : l)(CM_LANG[+r[col('idLanguage')]] || null),
      edition: flag(r, 'isFirstEd') ? '1st Edition' : null, notes,
      game: p ? CM.idx[gid].game : null, name: p ? cmDisplayName(p.name, gid) : null, expansion: p ? (CM.idx[gid].exp[p.exp] || `Espansione Cardmarket ${p.exp}`) : null, rarity: p ? (p.rar || cmRar(p.name)) : ''});
  }
  // unisci righe identiche (Cardmarket a volte divide la stessa carta su più righe)
  const m = new Map();
  for (const x of out){ const k = [x.id, x.unit, x.condition, x.language, x.edition, x.notes].join('|'); const e = m.get(k); if (e) e.qty += x.qty; else m.set(k, {...x}); }
  return [...m.values()];
}
/** trova le copie disponibili da vendere per una riga del CSV */
function cmFindStock(x, taken){
  const cards = [...S.cards.values()].filter(c => (x.p && cmFor(c)?.id === x.p.id) || (x.name && keyOf(c) === keyOf({game: x.game, expansion: x.expansion, name: x.name, rarity: x.rarity})));
  const ids = new Set(cards.map(c => c.id));
  const cps = [...S.copies.values()].filter(c => ids.has(c.card_id) && c.status !== 'venduto')
    .sort((a, b) => ((b.condition === x.condition) + (b.language === x.language)) - ((a.condition === x.condition) + (a.language === x.language)) || (a.buy_date || '').localeCompare(b.buy_date || ''));
  let need = x.qty; const alloc = [];
  for (const c of cps){ const free = c.qty - (taken.get(c.id) || 0); if (free <= 0 || !need) continue; const q = Math.min(free, need); alloc.push({id: c.id, q}); taken.set(c.id, (taken.get(c.id) || 0) + q); need -= q; }
  return {alloc, missing: need};
}

async function guestLoad(){
  G.loading = true; renderGuest();

    const [st, inf] = await Promise.all([sb.rpc('guest_stock', {p_token: G.token}), sb.rpc('guest_info', {p_token: G.token}).then(r => r, () => ({data: null}))]);
    if (st.error) throw st.error;

    G.info = (!inf.error && Array.isArray(inf.data) && inf.data[0]) || null;
    if (!G.cartLoaded){ cartLoad(); G.cartLoaded = true; }
    const ids = new Map(G.rows.map(r => [r.card_id, Number(r.qty) || 1])); [...G.want.entries()].forEach(([id, q]) => { if (!ids.has(id)) G.want.delete(id); else if (q > ids.get(id)) G.want.set(id, ids.get(id)); }); cartSave();
  } catch (e){
    G.err = /guest_stock|function|schema cache/i.test(e.message || '') ? 'La vetrina non è ancora attiva su questo archivio.' : /fetch/i.test(e.message || '') ? 'Impossibile raggiungere l\'archivio: riprova tra poco.' : e.message;
  }
  G.loading = false; renderGuest();
}

function cartSave(){ try { localStorage.setItem(cartKey(), JSON.stringify([...G.want.entries()])); } catch { /* memoria piena o non disponibile */ } }

const cartItems = () => [...G.want.entries()].map(([id, q]) => ({r: (G.rows || []).find(x => x.card_id === id), q})).filter(x => x.r);
const cartQty = () => sum([...G.want.values()], v => v);
function guestMessage(name, note, contact = ''){
  const items = cartItems();
  return `Ciao! Sono ${name}${contact ? ' (' + contact + ')' : ''}. ${G.info?.title ? 'Dalla vetrina “' + G.info.title + '”' : 'Dalla tua vetrina'} vorrei:\n` +
    items.map(({r, q}) => `• ${q}× ${r.name}${r.expansion || r.rarity ? ' — ' + [r.expansion, r.rarity].filter(Boolean).join(' · ') : ''}`).join('\n') +
    `\nTotale: ${items.length} ${items.length === 1 ? 'carta' : 'carte'}, ${cartQty()} ${cartQty() === 1 ? 'copia' : 'copie'}.` +
    (note ? `\nNote: ${note}` : '') + '\nSono ancora disponibili? Grazie!';
}
async function copyText(t){ try { await navigator.clipboard.writeText(t); return true; } catch { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); const ok = document.execCommand('copy'); a.remove(); return ok; } }
function drawGuestBar(){
  let bar = $('#gbar'); const n = G.want.size;
  $('#gcartn') && ($('#gcartn').textContent = n || '');
  if (!n){ bar && bar.remove(); return; }
  if (!bar){ bar = document.createElement('div'); bar.id = 'gbar'; bar.className = 'selbar cartbar'; document.body.appendChild(bar); }
  const q = cartQty();
  bar.innerHTML = `<div class="selin"><span class="cicon">🛒</span><b>${n} ${n === 1 ? 'carta' : 'carte'} · ${q} ${q === 1 ? 'copia' : 'copie'}</b><span class="small muted hide-m">nel carrello</span><div class="grow"></div>
    <button class="btn pri" data-g="open">Vai al carrello →</button></div>`;

}
function cartChanged(){ cartSave(); G.onWant && G.onWant(); drawGuestBar(); }

        <div class="cerr small" id="cerr" hidden></div>
        <div class="mfoot"><button type="button" class="btn" data-c>Continua a guardare</button><button type="submit" class="btn pri big" data-send="api">Invia richiesta</button></div>
        <div class="cfall" id="cfall" hidden><div class="small">Se l'invio non funziona, manda la richiesta tu:</div>
          <div class="cfb">${wa ? '<button type="button" class="btn sm ok" data-send="wa">WhatsApp</button>' : ''}${tg ? '<button type="button" class="btn sm" data-send="tg">Telegram</button>' : ''}<button type="button" class="btn sm" data-send="copy">Copia il messaggio</button></div></div>
      </form>`;
  };
  openModal('🛒 Il tuo carrello', body(), {wide: true, onMount: m => {

        <div class="mfoot" style="justify-content:center"><button class="btn pri" data-c>Torna alla vetrina</button></div></div>`; };
    m.addEventListener('click', async e => {

      if (dq && id){ const r = G.rows.find(x => x.card_id === id); const v = Math.max(1, Math.min(Number(r?.qty) || 1, (G.want.get(id) || 1) + Number(dq.dataset.dq))); G.want.set(id, v); cartChanged(); redraw(); return; }
