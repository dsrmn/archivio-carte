          const {data, error} = await sb.functions.invoke('vetrina-richiesta', {body: {token: G.token, name: nm, contact: ct, note, site: location.origin + location.pathname,
            items: cartItems().map(({r, q}) => ({card_id: r.card_id, qty: q}))}});

      else if (send.dataset.send === 'tg'){ await copyText(msg); toast('Richiesta copiata: incollala nella chat che si apre'); window.open(`https://t.me/${tg}`, '_blank', 'noopener'); }

function totals(game){
  const cards = [...S.cards.values()].filter(c => !game || c.game === game);
  const ids = new Set(cards.map(c => c.id));
  const cps = [...S.copies.values()].filter(c => ids.has(c.card_id));
  const av = cps.filter(c => c.status !== 'venduto');
  const lotIds = new Set(cps.map(c => c.lot_id).filter(Boolean));
  const lots = game ? [...lotIds].map(id => S.lots.get(id)).filter(Boolean) : [...S.lots.values()];
  const spentSingles = sum(cps.filter(c => !c.lot_id), c => (c.buy_price || 0) * c.qty);
  const spentLots = sum(lots, l => l.total_price);
  const soldC = cps.filter(c => c.status === 'venduto');
  const earned = sum(soldC, c => c.sell_price), net = sum(soldC, c => netSell(c));
  let mkt = 0, noMkt = 0; av.forEach(c => { const u = mktUnit(S.cards.get(c.card_id), c); if (u != null) mkt += u * c.qty; else noMkt += c.qty; });
  return {net, costs: earned - net, mkt, noMkt, cards: cards.filter(c => copiesOf(c.id).some(x => x.status !== 'venduto')).length, avail: sum(av, c => c.qty),
    sold: sum(cps.filter(c => c.status === 'venduto'), c => c.qty), spent: spentSingles + spentLots, spentLots, earned,
    stockCost: sum(av.filter(c => !c.lot_id), c => (c.buy_price || 0) * c.qty)};
}
function statTiles(t){
  return `<div class="stats">
    <div class="stat"><div class="l">Copie disponibili</div><div class="v">${t.avail.toLocaleString('it-IT')}</div><div class="s">${t.cards.toLocaleString('it-IT')} carte diverse</div></div>
    <div class="stat"><div class="l">Speso</div><div class="v">${eur(t.spent)}</div><div class="s">di cui lotti ${eur(t.spentLots)}</div></div>
    <div class="stat"><div class="l">Incassato netto</div><div class="v">${eur(t.net)}</div><div class="s">${t.sold.toLocaleString('it-IT')} copie vendute · commissioni e spedizioni ${eur(t.costs)}</div></div>
    <div class="stat"><div class="l">Saldo</div><div class="v">${signEur(t.net - t.spent)}</div><div class="s">incassato netto − speso</div></div>

}

function recentCards(n){
  const seen = new Set(), out = [];
  const av = [...S.copies.values()].filter(x => x.status !== 'venduto').sort((a, b) => (b.created_at || b.buy_date || '').localeCompare(a.created_at || a.buy_date || ''));
  for (const x of av){ if (seen.has(x.card_id) || !S.cards.has(x.card_id)) continue; seen.add(x.card_id); out.push(S.cards.get(x.card_id)); if (out.length >= n) break; }
  return out;
}

/* ===================== PAGINA CARTA ===================== */
function lineChart(series){
  const W = 640, H = 230, P = {l: 56, r: 14, t: 14, b: 30};
  const all = series.flatMap(s => s.pts);
  if (!all.length) return `<div class="empty">Nessun prezzo registrato per questa carta.</div>`;
  let x0 = Math.min(...all.map(p => p.x)), x1 = Math.max(...all.map(p => p.x));
  if (x1 - x0 < 864e5 * 20){ x0 -= 864e5 * 15; x1 += 864e5 * 15; }
  const y1 = Math.max(...all.map(p => p.y)) * 1.15 || 1;
  const sx = x => P.l + (x - x0) / (x1 - x0) * (W - P.l - P.r), sy = y => H - P.b - y / y1 * (H - P.t - P.b);
  let g = '';
  for (let i = 0; i <= 4; i++){ const v = y1 * i / 4, y = sy(v); g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}" stroke="#243044"/><text x="${P.l - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="#8d99ad">${EUR.format(v).replace(/,00/, '')}</text>`; }
  for (let i = 0; i <= 3; i++){ const x = x0 + (x1 - x0) * i / 3; g += `<text x="${sx(x)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === 3 ? 'end' : 'middle'}" font-size="11" fill="#8d99ad">${fdate(isoLocal(new Date(x)))}</text>`; }
  for (const s of series){
    const pts = [...s.pts].sort((a, b) => a.x - b.x);
    if (pts.length > 1) g += `<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-opacity=".55" points="${pts.map(p => `${sx(p.x)},${sy(p.y)}`).join(' ')}"/>`;
    g += pts.map(p => `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="4.5" fill="${s.color}" stroke="#140f33" stroke-width="1.5"><title>${esc(s.name)} · ${fdate(isoLocal(new Date(p.x)))} · ${EUR.format(p.y)}${p.n > 1 ? ' (×' + p.n + ')' : ''}</title></circle>`).join('');
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Storico prezzi">${g}</svg>
    <div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}

        <td class="hide-m small muted">${esc(x.notes || '')}</td>
        <td class="acts"><button class="btn sm ok" data-act="sell" data-id="${x.id}">Vendi</button> <button class="btn sm" data-act="editCopy" data-id="${x.id}" title="Modifica">✎</button> <button class="btn sm dan" data-act="delCopy" data-id="${x.id}" title="Elimina">🗑</button></td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty">Nessuna copia disponibile.</div>`}

    <div class="row">
      <div class="panel flush" style="flex:1 1 420px"><div class="panel-h"><h2>Storico vendite</h2></div>
        ${so.length ? `<div class="tw"><table class="t"><thead><tr><th>Data</th><th>Q.tà</th><th></th><th class="hide-m">Piattaforma</th><th class="right">Incasso</th><th class="right">Margine netto</th><th></th></tr></thead><tbody>
        ${so.map(x => `<tr><td class="nowrap">${fdate(x.sell_date)}</td><td>${x.qty}</td><td>${condB(x.condition)}</td><td class="hide-m">${esc(x.platform || '—')}</td>
          <td class="right nowrap">${eur(x.sell_price)}${x.qty > 1 ? `<div class="small muted">${eur(unitSell(x))} cad.</div>` : ''}${x.order_id ? `<div class="small muted">netto ${eur(netSell(x))}</div>` : ''}</td>
          <td class="right">${x.lot_id ? '<span class="small muted">sul lotto</span>' : x.buy_price != null && x.sell_price != null ? signEur(netSell(x) - x.buy_price * x.qty) : '—'}</td>
          <td class="acts">${x.order_id ? `<button class="btn sm" data-act="viewOrder" data-id="${x.order_id}" title="Apri vendita">🧾</button> ` : ''}<button class="btn sm" data-act="editCopy" data-id="${x.id}">✎</button></td></tr>`).join('')}
        </tbody></table></div>` : `<div class="empty">Nessuna vendita.</div>`}
      </div>
      <div class="panel flush" style="flex:1 1 380px"><div class="panel-h"><h2>Storico acquisti</h2></div>
        ${buysAll.length ? `<div class="tw"><table class="t"><thead><tr><th>Data</th><th>Q.tà</th><th></th><th class="right">Prezzo</th><th>Stato</th></tr></thead><tbody>
        ${buysAll.map(x => `<tr><td class="nowrap">${fdate(x.buy_date)}</td><td>${x.qty}</td><td>${condB(x.condition)}</td><td class="right nowrap">${x.lot_id ? lotLink(x) : eur(x.buy_price)}</td>
          <td>${x.status === 'venduto' ? '<span class="b st-v">Venduta</span>' : '<span class="b st-d">Disponibile</span>'}</td></tr>`).join('')}
        </tbody></table></div>` : `<div class="empty">Nessun acquisto con data.</div>`}
      </div>
    </div>`;
  queueImages([id]);
}

function lotOptions(sel){
  const lots = [...S.lots.values()].sort((a, b) => (b.buy_date || '').localeCompare(a.buy_date || ''));
  return lots.map(l => opt(l.id, sel, `${fdate(l.buy_date)} · ${l.description} (${eur(l.total_price)})`)).join('');
}
function addCardForm(pre = {}){
  const base = pre.card ? S.cards.get(pre.card) : null;
  const game = base?.game || pre.game || F.game || GAMES[0];
  const st = {sets: null, image: base?.image_url || null, cm_id: base?.cm_id || null};
  const html = `<form id="acf">
    <div class="fg">
      <div><label class="f">Gioco</label><select class="inp" name="game">${IX.games.map(g => opt(g, game)).join('')}${opt('__new', '', '＋ Altro gioco…')}</select></div>
      <div class="full"><label class="f">Nome carta</label><div><input class="inp" name="name" required value="${esc(base?.name || '')}" placeholder="Scrivi il nome o il codice stampato sulla carta (es. MP22-EN045)…" ${base ? '' : 'autofocus'}></div></div>
      <div class="full"><label class="f">Espansione</label><div><input class="inp" name="expansion" value="${esc(base?.expansion ?? pre.exp ?? '')}" placeholder="Espansione / set"></div></div>
      <div><label class="f">Rarità</label><input class="inp" name="rarity" list="dl-rar" value="${esc(base?.rarity || '')}"></div>
      <div><label class="f">Quantità</label><input class="inp" name="qty" type="number" min="1" value="1" required></div>
      <div><label class="f">Condizione</label><select class="inp" name="condition">${CONDS.map(c => opt(c, 'NM', `${c} – ${COND_LBL[c]}`)).join('')}</select></div>
      <div><label class="f">Lingua</label><select class="inp" name="language">${opt('', '', '—')}${langOpts(pre.lang || '')}</select></div>
      <div><label class="f">Edizione</label><input class="inp" name="edition" list="dl-ed" placeholder="es. 1st Edition"></div>
      <div><label class="f">Data acquisto</label><input class="inp" name="buy_date" type="date" value="${today()}"></div>
      <div><label class="f">Posizione <span style="font-weight:400">(dove la tieni)</span></label><input class="inp" name="location" list="dl-loc" value="${esc(pre.loc ?? localStorage.getItem(LOC_KEY) ?? '')}" placeholder="es. Raccoglitore 1 · pag. 3"></div>
    </div>
    <fieldset style="margin-top:12px"><legend>Acquisto</legend>
      <div class="seg" id="ptype" style="margin-bottom:10px"><button type="button" data-v="single" class="${pre.lot ? '' : 'on'}">Carta singola</button><button type="button" data-v="lot" class="${pre.lot ? 'on' : ''}">Da un lotto</button></div>
      <div id="p-single" ${pre.lot ? 'hidden' : ''}><label class="f">Prezzo unitario (€)</label><input class="inp" name="buy_price" inputmode="decimal" placeholder="0,00" style="max-width:160px"></div>
      <div id="p-lot" ${pre.lot ? '' : 'hidden'}>
        <label class="f">Lotto</label><select class="inp" name="lot">${opt('__new', pre.lot, '＋ Nuovo lotto…')}${lotOptions(pre.lot || [...S.lots.values()].at(-1)?.id)}</select>
        <div id="newlot" class="fg" style="margin-top:10px">
          <div class="full"><label class="f">Descrizione lotto</label><input class="inp" name="lot_desc" placeholder="es. Lotto 20 carte da Vinted"></div>
          <div><label class="f">Data</label><input class="inp" name="lot_date" type="date" value="${today()}"></div>
          <div><label class="f">Prezzo totale (€)</label><input class="inp" name="lot_price" inputmode="decimal" placeholder="0,00"></div>
        </div>
        <div class="small muted" style="margin-top:6px">Il costo del lotto resta condiviso: il guadagno si calcola sul lotto intero.</div>
      </div>
    </fieldset>
    <div class="fg" style="margin-top:12px"><div><label class="f">In vendita a € <span style="font-weight:400">(facoltativo, per copia)</span></label><input class="inp" name="ask_price" inputmode="decimal" placeholder="0,00"></div>
      <div style="grid-column:span 2"><label class="f">Note</label><input class="inp" name="notes"></div></div>
    <div id="mergehint" class="note" style="margin-top:12px" hidden></div>
    <div class="mfoot"><button type="button" class="btn" data-close2>Annulla</button><button type="submit" class="btn" name="again" value="1">Salva e aggiungi altra</button><button type="submit" class="btn pri">Salva</button></div>
    ${dl('dl-ed', EDITIONS)}${dl('dl-loc', allLocs())}<datalist id="dl-rar"></datalist>
  </form>`;
  openModal(base ? 'Aggiungi copie' : 'Aggiungi carta', html, {wide: true, onMount: m => {
    const f = $('#acf', m), E = n => f.elements[n];
    $('[data-close2]', m).onclick = closeModal;
    const curGame = () => E('game').value;
    const fillRar = () => { $('#dl-rar', m).innerHTML = [...new Set([...(RARITIES[curGame()] || []), ...[...S.cards.values()].filter(c => c.game === curGame()).map(c => c.rarity)])].filter(Boolean).map(v => `<option value="${esc(v)}">`).join(''); };
    fillRar();
    const ensureCm = () => { const gid = CM_GAMES[curGame()]; if (gid && !CM.idx[gid]) cmLoad(gid).catch(() => {}); };
    ensureCm();
    E('game').onchange = async () => {
      if (E('game').value === '__new'){
        const n = prompt('Nome del gioco (es. Magic, Lorcana, Dragon Ball):'); const g = gameName(n);
        if (!g){ E('game').value = GAMES[0]; return; }
        if (![...E('game').options].some(o => o.value === g)) E('game').insertAdjacentHTML('afterbegin', opt(g, g));
        E('game').value = g;
      }
      st.sets = null; st.cm_id = null; fillRar(); hint(); ensureCm();
    };
    const hint = () => {
      const ex = findCard(curGame(), E('expansion').value, E('name').value, E('rarity').value);
      const h = $('#mergehint', m);
      if (ex && E('name').value.trim()){ const s = cardStats(ex.id); h.hidden = false; h.innerHTML = `Questa carta è già nel tuo archivio (${s.avail} disponibili): le nuove copie finiranno nella stessa riga.`; } else h.hidden = true;
    };
    ['name', 'expansion', 'rarity'].forEach(n => E(n).addEventListener('change', hint));
    ['name', 'expansion'].forEach(n => E(n).addEventListener('input', () => { st.cm_id = null; }));
    autocomplete(E('name'), async (q, cb) => {
      const f2 = fold(q), g = curGame(), words = f2.split(' ').filter(Boolean);
      const seen = new Set();
      // le tue carte: una riga per ogni slot (nome + espansione + rarità)
      const local = [...S.cards.values()].filter(c => c.game === g && words.length && words.every(w => fold(`${c.name} ${c.expansion} ${c.rarity}`).includes(w)))
        .sort((a, b) => a.name.localeCompare(b.name, 'it') || a.expansion.localeCompare(b.expansion, 'it')).slice(0, 8)
        .map(c => { seen.add(c.cm_id || keyOf(c)); const n = sum(copiesOf(c.id).filter(x => x.status !== 'venduto'), x => x.qty);
          return {label: c.name, subHtml: `<b class="acx">${esc(c.expansion || '—')}</b> <span class="acr">${esc(c.rarity || 'rarità non indicata')}</span> · ${n} ${n === 1 ? 'disponibile' : 'disponibili'}`, value: c.name, group: 'Già nel tuo archivio', slot: c}; });
      // codice stampato sulla carta (es. MP22-EN045)
      const byCode = cmByCode(g, q);
      if (byCode){
        const items = byCode.list.map(x => ({label: x.name, subHtml: `<b class="acx">${esc(x.expansion)}</b> <span class="acr ${x.rarity ? '' : 'q'}">${esc(x.rarity || (x.rarAll ? x.rarAll + ' ?' : 'rarità non indicata'))}</span> · ${esc(x.code)}${byCode.lang ? ' · lingua ' + byCode.lang : ''}`,
          value: x.name, print: x, lang: byCode.lang, group: `Codice ${q.toUpperCase().trim()}`}));
        if (items.length){ cb(items); return; }   // nessun risultato: forse è un nome (es. "Number 39"), continua
      }
      // catalogo Cardmarket: una riga per ogni stampa
      const prints = q.length >= 2 ? cmSearchPrintings(g, q, 40) : [];
      const cmn = prints.filter(x => !seen.has(x.p.id) && !seen.has(keyOf({game: g, expansion: x.expansion, name: x.name, rarity: x.rarity})))
        .map(x => ({label: x.name, subHtml: `<b class="acx">${esc(x.expansion)}</b> <span class="acr ${x.rarity ? '' : 'q'}" title="${esc(x.rarAll || '')}">${esc(x.rarity || (x.rarAll ? (x.rarAll.split(' / ').length > 2 ? x.rarAll.split(' / ').length + ' rarità possibili' : x.rarAll + ' ?') : 'rarità non indicata'))}</span>` + [x.code, x.variant && !x.variant.includes(x.rarity || '~') ? x.variant : '', SHOW_MKT && mktPrice(x.p) != null ? 'mercato ' + eur(mktPrice(x.p)) : ''].filter(Boolean).map(t => ' · ' + esc(t)).join(''),
          value: x.name, print: x, group: 'Catalogo Cardmarket · scrivi anche il set o il codice per restringere'}));
      cb([...local, ...cmn]);
      if (q.length >= 3 && !CM.idx[CM_GAMES[g]]){ const rem = await remoteNames(g, q); cb([...local, ...rem.slice(0, 12)]); }
    }, it => {
      st.cm_id = null;
      if (it.lang && E('language').querySelector(`option[value="${it.lang}"]`)) E('language').value = it.lang;
      if (it.slot || it.print){   // stampa precisa: compila nome, espansione e rarità
        const x = it.slot || it.print;
        E('name').value = it.slot ? x.name : x.name; E('expansion').value = x.expansion || ''; E('rarity').value = (it.slot ? x.rarity : x.rarity) || '';
        st.cm_id = it.slot ? (x.cm_id || null) : x.p.id; st.sets = null;
        if (it.slot && x.image_url) st.image = x.image_url;
        if (it.print && curGame() === 'Yu-Gi-Oh!') remoteNames('Yu-Gi-Oh!', x.name).then(r => { const y = r.find(z => fold(z.value) === fold(x.name)); if (y){ st.sets = y.sets; if (!st.image) st.image = y.image || null;
          if (!E('rarity').value){ const s1 = (y.sets || []).filter(s => fold(s.expansion) === fold(x.expansion)); if (s1.length && new Set(s1.map(s => s.rarity)).size === 1) E('rarity').value = s1[0].rarity; } } }).catch(() => {});
        hint();
        setTimeout(() => (E('rarity').value ? E('qty') : E('rarity')).focus(), 50);
        return;
      }
      E('name').value = it.value;
      st.sets = it.sets || null;
      if (!it.sets && !it.localName && curGame() === 'Yu-Gi-Oh!') remoteNames('Yu-Gi-Oh!', it.value).then(r => { const x = r.find(y => fold(y.value) === fold(it.value)); if (x && fold(E('name').value) === fold(it.value)){ st.sets = x.sets; if (!st.image) st.image = x.image || null; } }).catch(() => {});
      if (it.localName){
        const vars = [...S.cards.values()].filter(c => c.game === curGame() && norm(c.name) === norm(it.value));
        st.sets = vars.map(c => ({expansion: c.expansion, rarity: c.rarity, code: 'nel tuo archivio', image: c.image_url}));
        if (vars.length === 1){ E('expansion').value = vars[0].expansion; E('rarity').value = vars[0].rarity; }
      }
      if (it.pick){ E('expansion').value = it.pick.expansion || ''; E('rarity').value = it.pick.rarity || ''; st.image = it.pick.image || null; }
      else if (st.sets && st.sets.length === 1){ E('expansion').value = st.sets[0].expansion; E('rarity').value = st.sets[0].rarity; st.image = st.sets[0].image || null; }
      hint();
      if (!E('expansion').value) setTimeout(() => E('expansion').focus(), 50); else E('qty').focus();
    });
    autocomplete(E('expansion'), async (q, cb) => {
      const f2 = fold(q), g = curGame(), out = [];
      const prints = cmPrintings(g, E('name').value);
      if (prints.length){
        const ygo = new Map(((st.sets && st.sets[0] && st.sets[0].code !== 'nel tuo archivio') ? st.sets : []).map(s => [fold(s.expansion), s.rarity]));
        prints.filter(x => !f2 || fold(`${x.expansion} ${x.rarAll} ${x.code} ${x.variant}`).includes(f2)).slice(0, 120).forEach(x => {
          const rar = x.rarity || (ygo.get(fold(x.expansion)) && !String(ygo.get(fold(x.expansion))).includes(' / ') ? ygo.get(fold(x.expansion)) : '') || '';
          const rarTxt = rar ? `◆ ${rar}` : x.rarAll ? `◆ ${x.rarAll} (controlla su Cardmarket)` : 'rarità non indicata';
          out.push({label: x.expansion, sub: [rarTxt, x.code, x.variant && !x.variant.includes(rar || '~') ? x.variant : '', SHOW_MKT && mktPrice(x.p) != null ? 'mercato ' + eur(mktPrice(x.p)) : ''].filter(Boolean).join(' · '),
            set: {expansion: x.expansion, rarity: rar, cm_id: x.p.id}, group: `Espansioni di questa carta su Cardmarket (${prints.length})`});
        });
      }
      if (st.sets && (!prints.length || st.sets[0]?.code === 'nel tuo archivio')) st.sets.filter(s => !f2 || fold(`${s.expansion} ${s.rarity} ${s.code}`).includes(f2)).slice(0, 40)
        .forEach(s => out.push({label: s.expansion, sub: `${s.rarity || '—'}${s.code ? ' · ' + s.code : ''}`, set: s, group: 'Stampe di questa carta'}));
      const exps = [...new Set([...S.cards.values()].filter(c => c.game === g).map(c => c.expansion))].filter(e => e && (!f2 || fold(e).includes(f2))).sort().slice(0, 10);
      exps.forEach(e => out.push({label: e, value: e, group: 'Espansioni del tuo archivio'}));
      cb(out);
    }, it => {
      if (it.set){ E('expansion').value = it.set.expansion; E('rarity').value = it.set.rarity || E('rarity').value; if (it.set.image) st.image = it.set.image; st.cm_id = it.set.cm_id || null; }
      else { E('expansion').value = it.value; st.cm_id = null; }
      hint(); E('rarity').focus();
    });
    const setType = v => { $$('#ptype button', m).forEach(b => b.classList.toggle('on', b.dataset.v === v)); $('#p-single', m).hidden = v !== 'single'; $('#p-lot', m).hidden = v !== 'lot'; };
    $$('#ptype button', m).forEach(b => b.onclick = () => setType(b.dataset.v));
    const lotSel = () => { $('#newlot', m).hidden = E('lot').value !== '__new'; };
    E('lot').onchange = lotSel; lotSel();
    let againFlag = false;
    $$('button[type=submit]', m).forEach(b => b.addEventListener('click', () => { againFlag = b.name === 'again'; }));
    f.onsubmit = async e => {
      e.preventDefault();
      const name = clean(E('name').value); if (!name) return;
      const isLot = $('#ptype button.on', m).dataset.v === 'lot';
      const d = {game: curGame(), name, expansion: clean(E('expansion').value), rarity: clean(E('rarity').value), image_url: st.image, cm_id: st.cm_id || undefined};
      const qty = Math.max(1, parseInt(E('qty').value) || 1);
      let lotId = isLot ? E('lot').value : null;
      if (isLot && lotId === '__new' && !clean(E('lot_desc').value)){ toast('Scrivi una descrizione per il nuovo lotto', 'err'); E('lot_desc').focus(); return; }
      const price = num(E('buy_price').value);
      const ok = await commit(`Aggiunta ${qty}× ${name}`, async tx => {
        const cid = await ensureCard(tx, d);
        if (lotId === '__new'){ lotId = uid(); await tx.insert('lots', {id: lotId, description: clean(E('lot_desc').value), buy_date: E('lot_date').value || null, total_price: num(E('lot_price').value) || 0}); }
        await addCopy(tx, {card_id: cid, lot_id: lotId || null, qty, condition: E('condition').value, edition: clean(E('edition').value) || null, language: E('language').value || null,
          buy_date: E('buy_date').value || null, buy_price: isLot ? null : price, notes: clean(E('notes').value) || null, location: clean(E('location').value) || null,
          ...(num(E('ask_price').value) != null ? {ask_price: round2(num(E('ask_price').value)), ask_date: today()} : {})});
        d.id = cid;
      });
      if (!ok) return;
      localStorage.setItem(LOC_KEY, clean(E('location').value));
      queueImages([d.id]);
      if (againFlag){ addCardForm({game: d.game, exp: d.expansion, lot: lotId || undefined, lang: E('language').value, loc: clean(E('location').value)}); }
      else { closeModal(); if (!base) location.hash = '#/c/' + d.id; }
    };
  }});
}

/* ===== modifica carta (con unione automatica) ===== */
function editCardForm(id){
  const c = S.cards.get(id);
  openModal('Modifica carta', `<form id="ecf"><div class="fg">
    <div><label class="f">Gioco</label><input class="inp" name="game" list="dl-games" value="${esc(c.game)}" required></div>
    <div class="full"><label class="f">Nome carta</label><input class="inp" name="name" value="${esc(c.name)}" required></div>
    <div class="full"><label class="f">Espansione</label><input class="inp" name="expansion" list="dl-exp" value="${esc(c.expansion)}"></div>
    <div><label class="f">Rarità</label><input class="inp" name="rarity" list="dl-rar2" value="${esc(c.rarity)}"></div>
    <div class="full"><label class="f">URL immagine (facoltativo)</label><input class="inp" name="image_url" value="${esc(c.image_url || '')}" placeholder="https://…"></div>
  </div><div class="note" style="margin-top:12px">Se nome, espansione e rarità coincidono con un'altra carta del tuo archivio, le copie verranno unite in quella riga.</div>
  <div class="mfoot"><button type="button" class="btn" data-c>Annulla</button><button class="btn pri">Salva</button></div>
  ${dl('dl-games', IX.games)}${dl('dl-exp', [...S.cards.values()].filter(x => x.game === c.game).map(x => x.expansion))}${dl('dl-rar2', [...(RARITIES[c.game] || []), ...[...S.cards.values()].map(x => x.rarity)])}</form>`,
  {onMount: m => {
    $('[data-c]', m).onclick = closeModal;
    $('#ecf', m).onsubmit = async e => {
      e.preventDefault(); const E = n => e.target.elements[n];
      const d = {game: gameName(E('game').value), name: clean(E('name').value), expansion: clean(E('expansion').value), rarity: clean(E('rarity').value), image_url: clean(E('image_url').value) || null};
      if (keyOf(d) !== keyOf(c) && c.cm_id && c.cm_id != -1 && !S.noCmId) d.cm_id = null;   // stampa cambiata: si riabbina da solo
      const target = [...S.cards.values()].find(x => x.id !== id && keyOf(x) === keyOf(d));
      let dest = id;
      const ok = await commit(target ? `Unita a ${target.name}` : `Modificata ${d.name}`, async tx => {
        if (target){
          await tx.update('copies', copiesOf(id).map(x => x.id), {card_id: target.id});
          if (d.image_url && !target.image_url) await tx.update('cards', target.id, {image_url: d.image_url});
          await tx.remove('cards', id); dest = target.id;
          // unisci copie disponibili identiche
          const cps = [...S.copies.values()].filter(x => x.card_id === target.id && x.status !== 'venduto');
          const done = new Set();
          for (const a of cps){ if (done.has(a.id)) continue; const twins = cps.filter(b => b.id !== a.id && !done.has(b.id) && sameAvail(a, b));
            if (twins.length){ await tx.update('copies', a.id, {qty: a.qty + sum(twins, t => t.qty)}); await tx.remove('copies', twins.map(t => t.id)); twins.forEach(t => done.add(t.id)); } done.add(a.id); }
        } else await tx.update('cards', id, d);
      });
      if (ok){ closeModal(); location.hash = '#/c/' + dest; }
    };
  }});
}

function editCopyForm(id){
  const x = S.copies.get(id), c = S.cards.get(x.card_id);
  openModal(`Modifica copia · ${c.name}`, `<form id="ecp"><div class="fg">
    <div><label class="f">Quantità</label><input class="inp" name="qty" type="number" min="1" value="${x.qty}"></div>
    <div><label class="f">Condizione</label><select class="inp" name="condition">${CONDS.map(k => opt(k, x.condition, `${k} – ${COND_LBL[k]}`)).join('')}${x.condition && !CONDS.includes(x.condition) ? opt(x.condition, x.condition) : ''}</select></div>
    <div><label class="f">Lingua</label><select class="inp" name="language">${opt('', x.language, '—')}${langOpts(x.language)}${x.language && !LANGS.includes(x.language) ? opt(x.language, x.language) : ''}</select></div>
    <div><label class="f">Edizione</label><input class="inp" name="edition" list="dl-ed" value="${esc(x.edition || '')}"></div>
    <div><label class="f">Data acquisto</label><input class="inp" name="buy_date" type="date" value="${x.buy_date || ''}"></div>
    <div><label class="f">Lotto</label><select class="inp" name="lot">${opt('', x.lot_id, '— nessuno (singola)')}${lotOptions(x.lot_id)}</select></div>
    <div><label class="f">Posizione</label><input class="inp" name="location" list="dl-loc" value="${esc(x.location || '')}" placeholder="es. Raccoglitore 1 · pag. 3"></div>
    <div><label class="f">Prezzo unitario (€)</label><input class="inp" name="buy_price" inputmode="decimal" value="${x.buy_price ?? ''}"></div>
    <div><label class="f">Stato</label><select class="inp" name="status">${opt('disponibile', x.status, 'Disponibile')}${opt('venduto', x.status, 'Venduta')}</select></div>
    <div class="askf"><label class="f">In vendita a € (per copia)</label><input class="inp" name="ask_price" inputmode="decimal" value="${x.ask_price != null ? fmtIn(x.ask_price) : ''}" placeholder="non in vendita"></div>
    <div class="sellf"><label class="f">Data vendita</label><input class="inp" name="sell_date" type="date" value="${x.sell_date || ''}"></div>
    <div class="sellf"><label class="f">Incasso totale (€)</label><input class="inp" name="sell_price" inputmode="decimal" value="${x.sell_price ?? ''}"></div>
    <div class="sellf"><label class="f">Piattaforma</label>${platSel(x.platform || '', true)}</div>
    <div class="full"><label class="f">Note</label><input class="inp" name="notes" value="${esc(x.notes || '')}"></div>
  </div><div class="mfoot"><button type="button" class="btn" data-c>Annulla</button><button class="btn pri">Salva</button></div>${dl('dl-ed', EDITIONS)}${dl('dl-loc', allLocs())}</form>`,
  {wide: true, onMount: m => {
    const f = $('#ecp', m), E = n => f.elements[n];
    $('[data-c]', m).onclick = closeModal;
    const tog = () => { $$('.sellf', m).forEach(el => el.style.display = E('status').value === 'venduto' ? '' : 'none'); $$('.askf', m).forEach(el => el.style.display = E('status').value === 'venduto' ? 'none' : ''); };
    E('status').onchange = tog; tog();
    f.onsubmit = async e => {
      e.preventDefault();
      const sold = E('status').value === 'venduto';
      const patch = {qty: Math.max(1, parseInt(E('qty').value) || 1), condition: E('condition').value, language: E('language').value || null, edition: clean(E('edition').value) || null,
        buy_date: E('buy_date').value || null, lot_id: E('lot').value || null, buy_price: E('lot').value ? null : num(E('buy_price').value), status: sold ? 'venduto' : 'disponibile',
        sell_date: sold ? (E('sell_date').value || today()) : null, sell_price: sold ? num(E('sell_price').value) : null, platform: sold ? (clean(E('platform').value) || null) : null, order_id: sold ? (x.order_id || null) : null, notes: clean(E('notes').value) || null, location: clean(E('location').value) || null};
      { const ap = num(E('ask_price').value); if (!sold && ap !== x.ask_price && !S.noAsk){ patch.ask_price = ap == null ? null : round2(ap); patch.ask_date = ap == null ? null : (x.ask_date && x.ask_price != null ? x.ask_date : today()); } }
      const ok = await commit(`Modificata copia di ${c.name}`, async tx => {
        await tx.update('copies', id, patch);
        const me = S.copies.get(id);
        const twin = [...S.copies.values()].find(o => o.id !== id && sameAvail(o, me) && (o.notes || '') === (me.notes || ''));
        if (twin && me.status !== 'venduto'){ await tx.update('copies', twin.id, {qty: twin.qty + me.qty}); await tx.remove('copies', id); }
      });
      if (ok) closeModal();
    };
  }});
}

/* ===================== VENDITE (ordini) ===================== */
const fmtIn = n => n ? round2(n).toFixed(2).replace('.', ',') : '';
function lotSnapshot(lotIds){ index(); const m = new Map(); lotIds.forEach(id => { const l = S.lots.get(id); if (l) m.set(id, lotStats(l).profit); }); return m; }
function celebrateLots(before){
  index();
  for (const [id, p0] of before){ const l = S.lots.get(id); if (!l) continue; if (p0 < 0 && lotStats(l).profit >= 0) toast(`🎉 Lotto “${l.description}” ripagato! Da qui in poi è tutto guadagno.`, 'ok'); }
}
async function mergeTwin(tx, id){
  const me = S.copies.get(id); if (!me || me.status === 'venduto') return;
  const twin = [...S.copies.values()].find(o => o.id !== id && sameAvail(o, me) && (o.notes || '') === (me.notes || ''));
  if (twin){ await tx.update('copies', twin.id, {qty: twin.qty + me.qty}); await tx.remove('copies', id); }
}
function orderMargin(k){
  const singles = k.items.filter(c => !c.lot_id && c.buy_price != null);
  return singles.length ? sum(singles, c => netSell(c) - c.buy_price * c.qty) : null;
}
function orderForm(pre = {}){
  if (S.noOrders){ upgradeModal(); return; }
  const rows = [];
  const addRow = id => { const x = S.copies.get(id); if (!x || x.status === 'venduto') return; const r = rows.find(r => r.id === id); if (r){ r.qty = Math.min(x.qty, r.qty + 1); return; } rows.push({id, qty: 1, price: ''}); };
  (pre.items || []).forEach(addRow);
  const plat0 = localStorage.getItem('cardarchive.lastPlatform') || 'Cardmarket';
  openModal('Nuova vendita', `<form id="of" autocomplete="off">
    <div class="fg">
      <div><label class="f">Data</label><input class="inp" type="date" name="date" value="${today()}"></div>
      <div><label class="f">Piattaforma</label>${platSel(pre.platform || plat0)}</div>
      <div><label class="f">Acquirente <span style="font-weight:400">(facoltativo)</span></label><input class="inp" name="buyer" placeholder="nome utente" value="${esc(pre.buyer || '')}"></div>
      ${S.noShip ? '' : `<div><label class="f">Spedizione</label><select class="inp" name="ship">${shipOpts('da_spedire')}</select></div>`}
    </div>
    <h3 style="margin:16px 0 4px">Carte vendute</h3>
    <div id="orows"></div>
    <div style="margin-top:10px"><div><input class="inp" id="oadd" placeholder="＋ Aggiungi una carta a questo ordine: scrivi il nome…"></div></div>
    <div class="odisc"><div class="row" style="gap:8px;flex-wrap:wrap;align-items:flex-end">
        <div><label class="f" for="odmode">Prezzo di gruppo</label><select class="inp" id="odmode"><option value="tot">Prezzo totale €</option><option value="disc">Sconto sul totale €</option></select></div>
        <div><label class="f" for="odisc">&nbsp;</label><input class="inp" id="odisc" inputmode="decimal" placeholder="0,00" style="max-width:120px"></div>
        <button type="button" class="btn" id="odiscgo">Dividi tra le carte</button><button type="button" class="btn" id="odiscundo" hidden>Ripristina prezzi</button></div>
      <div class="small muted" id="odischint" style="margin-top:6px"></div></div>
    <div class="fg" style="margin-top:14px">
      <div><label class="f">Spedizione pagata dall'acquirente €</label><input class="inp" name="sc" inputmode="decimal" value="${fmtIn(SET.shipCharged)}" placeholder="0,00"></div>
      <div><label class="f">Tuo costo spedizione + imballaggio €</label><input class="inp" name="sk" inputmode="decimal" value="${fmtIn(SET.shipCost)}" placeholder="0,00"></div>
      <div><label class="f">Commissione piattaforma €</label><input class="inp" name="fee" inputmode="decimal" placeholder="0,00"><div class="small muted" id="feehint" style="margin-top:3px"></div></div>
    </div>
    <div style="margin-top:12px"><label class="f">Note</label><input class="inp" name="notes"></div>
    <div id="osum" class="osum"></div>
    <div class="mfoot"><button type="button" class="btn" data-c>Annulla</button><button class="btn ok">Registra vendita</button></div></form>`,
  {wide: true, onMount: m => {
    const f = $('#of', m), E = n => f.elements[n];
    let feeTouched = false;
    $('[data-c]', m).onclick = closeModal;
    const itemsTotal = () => sum(rows, r => num(r.price) || 0);
    let disc = null;   // {amount, before: [prezzi scritti prima dello sconto]}
    /** prezzo della riga, o la stima mostrata come suggerimento se è vuoto */
    const basePrice = (r, price = r.price) => { const v = num(price); if (v != null) return v; const x = S.copies.get(r.id), est = x.ask_price ?? estCopy(S.cards.get(x.card_id), x); return est != null ? round2(est * r.qty) : null; };
    const DMODE_HINT = {tot: 'Copre prima quanto hai pagato ogni carta, poi divide il resto in parti uguali: stesso margine per ogni copia.', disc: 'Toglie lo sconto in parti uguali da ogni carta (per copia).'};
    /** porta la somma delle righe a `target` spostando ogni copia della stessa cifra, senza mai scendere sotto zero */
    const spread = (base, target) => {
      const out = base.slice(); let left = round2(target - sum(base, v => v));
      let open = rows.map((_, i) => i).filter(i => left > 0 || out[i] > 0);
      while (Math.abs(left) > 0.0001 && open.length){
        const per = left / sum(open, i => rows[i].qty);
        let used = 0; const next = [];
        for (const i of open){ const d = Math.max(-out[i], per * rows[i].qty); out[i] += d; used += d; if (left > 0 || out[i] > 0.0001) next.push(i); }
        left -= used; open = left > 0 ? [] : next;
      }
      const r = out.map(round2), diff = round2(target - sum(r, v => v));
      if (diff){ const j = r.indexOf(Math.max(...r)); r[j] = round2(r[j] + diff); }
      return r;
    };
    const costOf = r => { const x = S.copies.get(r.id); return x.lot_id || x.buy_price == null ? 0 : round2(x.buy_price * r.qty); };
    const applyDiscount = () => {
      const mode = $('#odmode', m).value, V = round2(num($('#odisc', m).value) || 0);
      if (!rows.length){ toast('Aggiungi prima le carte', 'err'); return; }
      if (V <= 0){ toast(mode === 'tot' ? 'Scrivi il prezzo totale' : 'Scrivi l\'importo dello sconto', 'err'); $('#odisc', m).focus(); return; }
      const before = disc ? disc.before : rows.map(r => r.price);
      let out;
      if (mode === 'tot') out = spread(rows.map(costOf), V);
      else {
        const base = rows.map((r, i) => basePrice(r, before[i])), miss = base.findIndex(v => v == null);
        if (miss >= 0){ toast('Prima scrivi il prezzo di ogni carta', 'err'); $$('[data-p]', m)[miss]?.focus(); return; }
        const tot = round2(sum(base, v => v));
        if (V >= tot){ toast(`Lo sconto deve essere minore del totale (${eur(tot)})`, 'err'); return; }
        out = spread(base, tot - V);
      }
      const units = sum(rows, r => r.qty), cost = sum(rows, costOf), free = sum(rows.filter(r => !costOf(r)), r => r.qty);
      disc = {mode, amount: V, before, margin: mode === 'tot' ? round2((V - cost) / units) : null, free};
      rows.forEach((r, i) => { r.price = out[i].toFixed(2).replace('.', ','); });
      drawRows(); upd();
    };
    const undoDiscount = () => { if (!disc) return; rows.forEach((r, i) => { r.price = disc.before[i] ?? ''; }); disc = null; $('#odisc', m).value = ''; drawRows(); upd(); };
    const drawRows = () => {
      $('#orows', m).innerHTML = rows.length ? rows.map((r, i) => {
        const x = S.copies.get(r.id), c = S.cards.get(x.card_id), est = x.ask_price ?? estCopy(c, x);
        return `<div class="orow" data-i="${i}">${thumbHtml(c)}<div class="grow" style="min-width:0"><b>${nameHtml(c.name)}</b>
          <div class="small muted">${esc(c.expansion || '—')}${c.rarity ? ' · ' + esc(c.rarity) : ''} ${condB(x.condition)} ${x.language ? `${langB(x.language)}` : ''} ${locB(x.location)} · ${x.lot_id ? 'da lotto' : 'pagata ' + eur(x.buy_price) + ' cad.'}${est != null ? ` · ${x.ask_price != null ? 'in vendita a' : mktUnit(c, x) != null ? 'mercato' : 'di solito la vendi a'} ${eur(est)}` : ''}</div></div>
          <div class="oq"><label class="f">Q.tà <span style="font-weight:400">/ ${x.qty}</span></label><input class="inp" type="number" min="1" max="${x.qty}" value="${r.qty}" data-q></div>
          <div class="op"><label class="f">Prezzo €</label><input class="inp" inputmode="decimal" value="${esc(r.price)}" data-p placeholder="${est != null ? fmtIn(est * r.qty) : '0,00'}"></div>
          <button type="button" class="x" data-rm title="Togli dall'ordine">×</button></div>`;
      }).join('') : '<div class="empty" style="padding:14px">Nessuna carta: aggiungile con la casella qui sotto.</div>';
      $$('.orow', m).forEach(el => {
        const r = rows[+el.dataset.i];
        $('[data-q]', el).oninput = e => { r.qty = Math.max(1, Math.min(S.copies.get(r.id).qty, parseInt(e.target.value) || 1)); upd(); };
        $('[data-p]', el).oninput = e => { r.price = e.target.value; upd(); };
        $('[data-rm]', el).onclick = () => { rows.splice(+el.dataset.i, 1); drawRows(); upd(); };
      });
    };
    const upd = () => {
      const items = itemsTotal(), pl = clean(E('platform').value), fs = feeCfg(pl);
      if (!feeTouched) E('fee').value = fmtIn(feeFor(pl, items));
      $('#feehint', m).innerHTML = fs && (fs.pct || fs.fixed)
        ? `${String(fs.pct || 0).replace('.', ',')}% degli articoli${fs.fixed ? ' + ' + eur(fs.fixed) : ''} (${esc(pl)})${feeTouched ? ' · <a href="#" id="feere">ricalcola</a>' : ''}`
        : `nessuna commissione impostata per ${esc(pl || 'questa piattaforma')} · <a href="#" id="feeset">imposta</a>`;
      $('#feere', m) && ($('#feere', m).onclick = e => { e.preventDefault(); feeTouched = false; upd(); });
      $('#feeset', m) && ($('#feeset', m).onclick = e => { e.preventDefault(); e.stopPropagation(); feesModal(() => orderForm({items: rows.map(r => r.id)})); });
      const sc = num(E('sc').value) || 0, sk = num(E('sk').value) || 0, fee = num(E('fee').value) || 0;
      const net = items + sc - fee - sk;
      let cost = 0, sGross = 0, lotQ = 0, unk = 0;
      rows.forEach(r => { const x = S.copies.get(r.id), p = num(r.price) || 0; if (x.lot_id) lotQ += r.qty; else if (x.buy_price == null) unk += r.qty; else { cost += x.buy_price * r.qty; sGross += p; } });
      const sNet = items ? sGross * net / items : 0;
      $('#odiscundo', m).hidden = !disc;
      $('#odischint', m).innerHTML = !disc ? DMODE_HINT[$('#odmode', m).value]
        : disc.mode === 'disc' ? `Sconto di <b>${eur(disc.amount)}</b> tolto in parti uguali da ogni carta.`
        : `Totale <b>${eur(disc.amount)}</b> diviso tra le carte: ${disc.margin >= 0 ? `margine di <b>${signEur(disc.margin)}</b> per ogni copia` : `<span style="color:var(--red)">sotto il prezzo pagato: ${signEur(disc.margin)} per copia</span>`}.${disc.free ? ` ${disc.free} ${disc.free === 1 ? 'copia' : 'copie'} da lotto o senza prezzo d'acquisto ${disc.free === 1 ? 'conta' : 'contano'} come costo zero.` : ''}`;
      $('#osum', m).innerHTML = `<div class="osum-g">
          ${disc?.mode === 'disc' ? `<span>Articoli prima dello sconto</span><b>${eur(items + disc.amount)}</b><span>− sconto</span><b>${eur(disc.amount)}</b>` : ''}<span>Articoli${disc?.mode === 'disc' ? ' scontati' : ''}</span><b>${eur(items)}</b>
          <span>+ spedizione pagata dall'acquirente</span><b>${eur(sc)}</b>
          <span>− commissione</span><b>${eur(fee)}</b>
          <span>− spedizione e imballaggio</span><b>${eur(sk)}</b>
          <span class="tot">Ti resta</span><b class="tot">${eur(net)}</b>
        </div>
        <div class="small muted" style="margin-top:8px">${cost ? `Margine netto sulle carte singole: ${signEur(sNet - cost)}` : ''}${lotQ ? `${cost ? ' · ' : ''}${lotQ} ${lotQ === 1 ? 'carta' : 'carte'} da lotto: il ricavo va a ripagare il lotto` : ''}${unk ? ` · ${unk} senza prezzo d'acquisto` : ''}</div>`;
    };
    $('#odiscgo', m).onclick = applyDiscount;
    $('#odmode', m).onchange = () => { $('#odisc', m).focus(); upd(); };
    $('#odiscundo', m).onclick = undoDiscount;
    $('#odisc', m).addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); applyDiscount(); } });
    f.addEventListener('input', e => { if (e.target.closest('.orow') || e.target.id === 'oadd' || e.target.id === 'odisc') return; if (e.target === E('fee')) feeTouched = true; upd(); });
    autocomplete($('#oadd', m), async (q, cb) => {
      const fq = fold(q); if (!fq){ cb([]); return; }
      cb([...S.copies.values()].filter(x => x.status !== 'venduto').map(x => ({x, c: S.cards.get(x.card_id)}))
        .filter(o => o.c && fold(`${o.c.name} ${o.c.expansion}`).includes(fq)).slice(0, 15)
        .map(({x, c}) => ({label: c.name, sub: `${c.expansion || '—'} · ${c.rarity || '—'} · ${x.condition || ''}${x.language ? ' ' + x.language : ''} · disponibili ${x.qty}${x.lot_id ? ' · da lotto' : ''}${x.location ? ' · 📍 ' + x.location : ''}`, id: x.id})));
    }, it => { addRow(it.id); $('#oadd', m).value = ''; drawRows(); upd(); });
    f.onsubmit = async e => {
      e.preventDefault();
      if (!rows.length){ toast('Aggiungi almeno una carta', 'err'); $('#oadd', m).focus(); return; }
      const miss = rows.findIndex(r => num(r.price) == null);
      if (miss >= 0){ toast('Manca il prezzo di una carta', 'err'); $$('[data-p]', m)[miss]?.focus(); return; }
      const date = E('date').value || today(), pl = clean(E('platform').value) || null;
      localStorage.setItem('cardarchive.lastPlatform', pl || '');
      const order = {id: uid(), sell_date: date, platform: pl, buyer: clean(E('buyer').value) || null, shipping_charged: round2(num(E('sc').value) || 0),
        shipping_cost: round2(num(E('sk').value) || 0), fee: round2(num(E('fee').value) || 0), notes: [clean(E('notes').value), disc?.mode === 'disc' ? `Sconto ${eur(disc.amount)} sul totale` : disc?.mode === 'tot' ? `Prezzo di gruppo ${eur(disc.amount)}` : ''].filter(Boolean).join(' · ') || null};
      if (!S.noShip){ order.ship_status = E('ship')?.value || 'da_spedire'; if (order.ship_status !== 'da_spedire') order.shipped_date = date; }
      const before = lotSnapshot([...new Set(rows.map(r => S.copies.get(r.id).lot_id).filter(Boolean))]);

const PV = {on: false, orig: new Map(), changes: new Map(), stats: null, onlyChanged: false};
/** immagini e rarità proposte per le carte che non le hanno, dalla stampa esatta del listino */
function computeProposals(){
  const out = new Map(), taken = new Set([...S.cards.values()].map(keyOf)), skip = noImg();
  const st = {img: 0, rar: 0, conflict: 0, byGame: {}};
  for (const c of S.cards.values()){
    const ch = {}, g = st.byGame[c.game] || (st.byGame[c.game] = {img: 0, rar: 0, missImg: 0, missRar: 0});
    if (!c.image_url){ g.missImg++; if (!skip.has(c.id)){ const u = exactImageUrl(c); if (u){ ch.image_url = u; g.img++; st.img++; } } }
    if (!c.rarity && CM_GAMES[c.game]){
      g.missRar++;
      const m = cmMatch(c), p = m.status === 'ok' && !m.guessed ? m.p : null, r = clean(p?.rar || '');
      if (r && !p.rarAll && !/[/|?]/.test(r)){
        const nk = keyOf({...c, rarity: r});
        if (taken.has(nk)) st.conflict++; else { ch.rarity = r; taken.add(nk); g.rar++; st.rar++; }
      }
    }
    if (ch.image_url || ch.rarity) out.set(c.id, ch);
  }
  return {changes: out, stats: st};
}

const CTA = {rows: null, loading: false, running: false, prog: null, err: null, opt: {img: true, rar: true, rarFix: false, imgAll: false}, show: 'diff'};
async function ctLoad(){
  if (S.mode !== 'supabase'){ CTA.rows = new Map(); return; }
  CTA.loading = true;
  try {
    const all = [];
    for (let from = 0; ; from += 1000){ const {data, error} = await sb.from('card_proposals').select('*').range(from, from + 999); if (error) throw error; all.push(...(data || [])); if (!data || data.length < 1000) break; }
    CTA.rows = new Map(all.map(r => [r.card_id, r])); CTA.err = null;
  } catch (e){ CTA.rows = new Map(); CTA.err = /card_proposals|schema cache/i.test(e.message || '') ? 'L\'analisi CardTrader non è ancora attiva su questo archivio.' : e.message; }
  CTA.loading = false;
}
async function ctRun(){
  if (CTA.running) return;
  CTA.running = true; CTA.err = null; CTA.prog = {done: 0, total: 0}; render();
  try {
    let offset = 0;
    for (let guard = 0; guard < 200; guard++){
      const {data, error} = await sb.functions.invoke('ct-analisi', {body: {offset, limit: 12}});
      if (error || !data?.ok){ let t = ''; try { t = (await error?.context?.json?.())?.error || ''; } catch { /* risposta non JSON */ } throw new Error(t || data?.error || 'analisi non riuscita'); }
      CTA.prog = {done: data.next, total: data.total}; if (location.hash.startsWith('#/analisi')) render();
      if (data.done) break; offset = data.next;
    }
    await ctLoad(); toast('Analisi CardTrader completata');
  } catch (e){ CTA.err = 'Analisi interrotta: ' + (e.message || e); }
  CTA.running = false; render();
}

  const out = {miss_img: [], miss_rar: [], diff_rar: [], has_img: [], same: [], amb: [], none: [], noexp: []};
  for (const c of S.cards.values()){

function lotStats(l){
  const cs = lotCopies(l.id), so = cs.filter(c => c.status === 'venduto'), av = cs.filter(c => c.status !== 'venduto');
  const gross = sum(so, c => c.sell_price), earned = sum(so, c => netSell(c));
  let est = 0, unknown = 0;
  av.forEach(c => { const u = estCopy(S.cards.get(c.card_id), c); if (u != null) est += u * c.qty; else unknown += c.qty; });
  return {copies: sum(cs, c => c.qty), sold: sum(so, c => c.qty), left: sum(av, c => c.qty), gross, earned, profit: earned - l.total_price,
    est, unknown, pct: l.total_price > 0 ? earned / l.total_price * 100 : 100};
}

/* ===================== GUADAGNI MENSILI ===================== */
let EG = '';
function monthly(game){
  const M = new Map(); const get = m => M.get(m) || M.set(m, {m, spent: 0, bought: 0, gross: 0, net: 0, fee: 0, ship: 0, sold: 0, margin: 0}).get(m);
  const okCard = id => !game || S.cards.get(id)?.game === game;
  for (const c of S.copies.values()){
    if (!okCard(c.card_id)) continue;
    if (c.buy_date && !c.lot_id){ const r = get(c.buy_date.slice(0, 7)); r.spent += (c.buy_price || 0) * c.qty; r.bought += c.qty; }
    if (c.status === 'venduto' && c.sell_date){
      const r = get(c.sell_date.slice(0, 7)), n = netSell(c);
      r.gross += c.sell_price || 0; r.net += n; r.sold += c.qty;
      if (!c.lot_id && c.buy_price != null) r.margin += n - c.buy_price * c.qty;
    }
  }
  for (const o of S.orders.values()){
    const items = orderItems(o.id).filter(c => okCard(c.card_id)); if (!items.length || !o.sell_date) continue;
    const k = oc(o), part = k.gross ? sum(items, c => c.sell_price) / k.gross : items.length / k.items.length;
    const r = get(o.sell_date.slice(0, 7)); r.fee += (o.fee || 0) * part; r.ship += ((o.shipping_cost || 0) - (o.shipping_charged || 0)) * part;
  }
  for (const l of S.lots.values()){
    if (game && !lotCopies(l.id).some(c => okCard(c.card_id))) continue;
    if (l.buy_date){ const r = get(l.buy_date.slice(0, 7)); r.spent += l.total_price; r.bought += sum(lotCopies(l.id), c => c.qty); }
  }
  return [...M.values()].sort((a, b) => b.m.localeCompare(a.m));
}
function barChart(rows){
  rows = [...rows].reverse().slice(-12);
  if (!rows.length) return '';
  const W = 760, H = 230, P = {l: 56, r: 10, t: 12, b: 34};
  const mx = Math.max(...rows.flatMap(r => [r.spent, r.net])) * 1.1 || 1;
  const bw = (W - P.l - P.r) / rows.length, sy = v => H - P.b - Math.max(0, v) / mx * (H - P.t - P.b);
  let g = '';
  for (let i = 0; i <= 4; i++){ const v = mx * i / 4, y = sy(v); g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}" stroke="#243044"/><text x="${P.l - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="#8d99ad">${EUR.format(v).replace(/,\d\d/, '')}</text>`; }
  rows.forEach((r, i) => {
    const x = P.l + i * bw, w = Math.min(22, bw * .34);
    g += `<rect x="${x + bw / 2 - w - 1}" y="${sy(r.spent)}" width="${w}" height="${H - P.b - sy(r.spent)}" rx="3" fill="#ff3dcb"><title>${fmonth(r.m)} · speso ${EUR.format(r.spent)}</title></rect>`;
    g += `<rect x="${x + bw / 2 + 1}" y="${sy(r.net)}" width="${w}" height="${H - P.b - sy(r.net)}" rx="3" fill="#3dff9a"><title>${fmonth(r.m)} · incassato netto ${EUR.format(r.net)}</title></rect>`;
    const [y, mm] = r.m.split('-');
    g += `<text x="${x + bw / 2}" y="${H - 18}" text-anchor="middle" font-size="11" fill="#8d99ad">${MESI[+mm - 1].slice(0, 3)}</text><text x="${x + bw / 2}" y="${H - 5}" text-anchor="middle" font-size="10" fill="#6f7b8f">${y}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="legend"><span><i style="background:#ff3dcb"></i>Speso</span><span><i style="background:#34c27b"></i>Incassato netto</span></div></div>`;
}

const ALIASES = {
  name: ['nome carta', 'nome', 'carta', 'item name', 'card name', 'name', 'product name', 'prodotto', 'product'],
  game: ['gioco', 'game'],
  expansion: ['set/espansione', 'set / espansione', 'espansione', 'set name', 'expansion', 'set', 'espansione/set'],
  edition: ['edizione', 'edition', 'printing'],
  rarity: ['rarita', 'rarity'],
  condition: ['condizione', 'condition', 'stato carta'],
  language: ['lingua', 'language'],
  qty: ['quantita', 'qty', 'quantity', 'q.ta', 'copie', 'amount'],
  lotId: ['id lotto', 'lotto', 'lot id', 'lot'],
  buyDate: ['data acquisto', 'purchase date', 'order date', 'data ordine', 'paid at', 'created at', 'data', 'date'],
  buyUnit: ['prezzo acquisto unitario', 'prezzo unitario', 'unit price', 'prezzo acquisto', 'price'],
  buyTotal: ['prezzo acquisto totale', 'totale acquisto', 'costo totale acquisto'],
  cents: ['price in eur cents', 'price cents'],
  status: ['stato', 'status'],
  sellDate: ['data vendita', 'sale date', 'sold date'],
  sellTotal: ['prezzo vendita totale', 'prezzo vendita', 'incasso', 'sale price', 'sold price'],
  platform: ['piattaforma', 'platform'],
  notes: ['note', 'notes'],

  askPrice: ['in vendita a', 'prezzo richiesto', 'prezzo di vendita richiesto', 'asking price', 'listing price'],
  desc: ['descrizione', 'description', 'descrizione lotto'],

  foil: ['foil'], fname: ['first edition', '1st edition']
};
const hnorm = h => fold(h).replace(/\(.*?\)|€/g, '').replace(/[^a-z0-9/. ]/g, ' ').replace(/\s+/g, ' ').trim();
function mapHeaders(headers, fields){
  const H = headers.map(hnorm), map = {}, used = new Set();
  for (const pass of [0, 1]) for (const f of fields){
    if (map[f] != null) continue;
    for (const a of ALIASES[f]){
      const i = H.findIndex((h, j) => !used.has(j) && h && (pass === 0 ? h === a : (a.length > 4 && h.startsWith(a + ' '))));
      if (i >= 0){ map[f] = i; used.add(i); break; }
    }
  }
  return map;
}
function parseDate(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number' && window.XLSX){ const d = XLSX.SSF.parse_date_code(v); return d ? `${d.y}-${pad(d.m)}-${pad(d.d)}` : null; }
  if (v instanceof Date) return isoLocal(v);
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/); if (m){ const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${pad(m[2])}-${pad(m[1])}`; }
  const t = Date.parse(s); return isNaN(t) ? null : isoLocal(new Date(t));
}
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = [';', ',', '\t'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim){ row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
function findHeaderRow(aoa){
  for (let i = 0; i < Math.min(aoa.length, 15); i++){ const H = (aoa[i] || []).map(hnorm); if (H.some(h => ALIASES.name.includes(h) || ALIASES.desc.includes(h))) return i; }
  return -1;
}
/** Converte un file in una "proposta d'import": {cards, lots, copies, info} */
function buildImport(sheets, defaults){
  // sheets: [{name, aoa}]
  const lotsById = new Map(), rowsOut = [], info = {format: 'Generico', skipped: [], sheets: []};
  const lotSheets = [], cardSheets = [];
  for (const sh of sheets){
    if (/riepilog|summary|dashboard|statistic|grafic/i.test(sh.name)){ info.skipped.push(sh.name); continue; }
    const hr = findHeaderRow(sh.aoa); if (hr < 0){ info.skipped.push(sh.name); continue; }
    const headers = sh.aoa[hr].map(x => String(x ?? ''));
    const map = mapHeaders(headers, Object.keys(ALIASES));
    const body = sh.aoa.slice(hr + 1);
    if ((map.name == null || /lott/i.test(sh.name)) && (map.desc != null || map.name != null) && (map.name == null || /lott/i.test(sh.name))){ if (map.desc == null){ map.desc = map.name; delete map.name; } lotSheets.push({sh, map, body}); } else if (map.name != null) cardSheets.push({sh, map, body});
    if (map.cents != null) info.format = 'Ordine CardTrader';
  }
  for (const {map, body} of lotSheets){
    for (const r of body){
      const g = k => map[k] != null ? r[map[k]] : null;
      const lid = clean(g('lotId') ?? ''); const d = clean(g('desc') ?? '');
      if (!lid && !d) continue;
      const tot = num(g('lotTotal')) ?? num(g('buyTotal')) ?? num(g('buyUnit')) ?? 0;
      lotsById.set(norm(lid || d), {id: uid(), description: d || ('Lotto ' + lid), buy_date: parseDate(g('buyDate')), total_price: round2(tot), _ref: lid});
    }
  }
  const lotAgg = new Map();
  for (const {sh, map, body} of cardSheets){
    info.sheets.push(sh.name);
    const sheetGame = gameName(sh.name);
    const sheetGameOk = /yu.?gi|pok|one.?piece|magic|lorcana/i.test(fold(sh.name));
    for (const r of body){
      const g = k => map[k] != null ? r[map[k]] : null;
      const name = clean(g('name') ?? ''); if (!name) continue;
      const game = gameName(g('game')) || (sheetGameOk ? sheetGame : '') || defaults.game;
      const qty = Math.max(1, parseInt(num(g('qty'))) || 1);
      const lotRef = clean(g('lotId') ?? '');
      let unit = num(g('buyUnit'));
      if (unit == null && num(g('buyTotal')) != null) unit = num(g('buyTotal')) / qty;
      if (unit == null && num(g('cents')) != null) unit = num(g('cents')) / 100;
      const sold = /vend|sold|venduto/i.test(String(g('status') ?? '')) || (num(g('sellTotal')) != null && map.status == null);
      let edition = clean(g('edition') ?? '') || null;
      if (map.fname != null && /^(true|1|yes|si|sì|x)$/i.test(String(g('fname')))) edition = edition || '1st Edition';
      let notes = clean(g('notes') ?? '') || null;
      if (map.foil != null && /^(true|1|yes|si|sì|x)$/i.test(String(g('foil')))) notes = notes ? notes + ' · Foil' : 'Foil';
      const row = {game, name, expansion: clean(g('expansion') ?? ''), rarity: clean(g('rarity') ?? ''),
        qty, condition: normCond(g('condition')), edition, language: clean(g('language') ?? '').toUpperCase().slice(0, 12) || null,
        buy_date: parseDate(g('buyDate')) || defaults.date || null, buy_price: lotRef ? null : (unit == null ? null : round2(unit)),
        status: sold ? 'venduto' : 'disponibile', sell_date: sold ? (parseDate(g('sellDate')) || null) : null, sell_price: sold ? num(g('sellTotal')) : null,
        platform: clean(g('platform') ?? '') || null, notes, location: clean(g('location') ?? '') || null, lotRef: lotRef || null, ask_price: sold ? null : (num(g('askPrice')) == null ? null : round2(num(g('askPrice'))))};
      if (lotRef){
        const k = norm(lotRef); const a = lotAgg.get(k) || {sum: 0, date: null}; a.sum += num(g('buyTotal')) || 0; a.date = a.date || row.buy_date; lotAgg.set(k, a);
      }
      rowsOut.push(row);
    }
  }
  if (info.format === 'Generico' && lotSheets.length + cardSheets.length && cardSheets.some(c => c.map.lotId != null)) info.format = 'Tracker Excel (con lotti)';
  for (const [k, a] of lotAgg) if (!lotsById.has(k)) lotsById.set(k, {id: uid(), description: 'Lotto ' + k.toUpperCase(), buy_date: a.date, total_price: round2(a.sum), _ref: k, _guessed: true});
  // unisci copie identiche disponibili
  const merged = [];
  const mk = r => [r.game, r.expansion, r.name, r.rarity].map(norm).join('|') + '#' + [r.lotRef, r.condition, r.edition, r.language, r.buy_price, r.buy_date, r.notes, r.location].join('|');
  const mm = new Map();
  for (const r of rowsOut){
    if (r.status === 'disponibile'){ const k = mk(r); const ex = mm.get(k); if (ex){ ex.qty += r.qty; continue; } mm.set(k, r); }
    merged.push(r);
  }
  info.rawRows = rowsOut.length;
  return {rows: merged, lots: [...lotsById.values()], info};
}
async function readFileToSheets(file){
  const nm = file.name.toLowerCase();
  if (nm.endsWith('.csv') || nm.endsWith('.txt')) return [{name: file.name.replace(/\.\w+$/, ''), aoa: parseCSV(await file.text())}];
  if (!window.XLSX) throw new Error('Libreria Excel non caricata (controlla la connessione)');
  const wb = XLSX.read(await file.arrayBuffer(), {type: 'array'});
  return wb.SheetNames.map(n => ({name: n, aoa: XLSX.utils.sheet_to_json(wb.Sheets[n], {header: 1, raw: true, defval: ''})}));
}
async function runImport(plan){
  const {rows, lots} = plan;
  return commit(`Importate ${sum(rows, r => r.qty)} copie`, async tx => {
    const lotMap = new Map();
    const newLots = [];
    for (const l of lots){
      const exist = [...S.lots.values()].find(x => norm(x.description) === norm(l.description) && (x.buy_date || '') === (l.buy_date || ''));
      if (exist) lotMap.set(norm(l._ref || l.description), exist.id);
      else { lotMap.set(norm(l._ref || l.description), l.id); newLots.push({id: l.id, description: l.description, buy_date: l.buy_date, total_price: l.total_price}); }
    }
    await tx.insert('lots', newLots);
    const byKey = new Map([...S.cards.values()].map(c => [keyOf(c), c.id]));
    // senza rarità (es. export CardTrader): se esiste una sola versione della carta in quell'espansione, usa quella
    const pool = [...S.cards.values()].map(c => ({game: c.game, expansion: c.expansion, name: c.name, rarity: c.rarity})).concat(rows.filter(r => r.rarity));
    for (const r of rows) if (!r.rarity){
      const vars = [...new Set(pool.filter(c => norm(c.game) === norm(r.game) && norm(c.expansion) === norm(r.expansion) && norm(c.name) === norm(r.name) && c.rarity).map(c => c.rarity))];
      if (vars.length === 1) r.rarity = vars[0];
    }
    const newCards = [];
    for (const r of rows){ const k = keyOf(r); if (!byKey.has(k)){ const id = uid(); byKey.set(k, id); newCards.push({id, game: r.game, expansion: r.expansion, name: r.name, rarity: r.rarity, image_url: null}); } }
    await tx.insert('cards', newCards);
    const newCopies = [], bumps = new Map();
    const avail = [...S.copies.values()].filter(c => c.status !== 'venduto');
    for (const r of rows){
      const cp = {card_id: byKey.get(keyOf(r)), lot_id: r.lotRef ? (lotMap.get(norm(r.lotRef)) || null) : null, qty: r.qty, condition: r.condition, edition: r.edition, language: r.language,
        buy_date: r.buy_date, buy_price: r.buy_price, status: r.status, sell_date: r.sell_date, sell_price: r.sell_price, platform: r.platform, notes: r.notes, ...(r.location ? {location: r.location} : {}),
        ...(r.ask_price != null && r.status !== 'venduto' ? {ask_price: r.ask_price, ask_date: today()} : {})};
      if (cp.status === 'disponibile'){
        const twin = avail.find(a => sameAvail(a, cp) && (a.notes || '') === (cp.notes || ''));
        if (twin){ bumps.set(twin.id, (bumps.get(twin.id) || twin.qty) + cp.qty); continue; }
      }
      newCopies.push({id: uid(), ...cp});
    }
    await tx.insert('copies', newCopies);
    for (const [id, q] of bumps) await tx.update('copies', id, {qty: q});
  });
}

/* ===== backup: lettura dei file JSON e dei backup cifrati del workflow GitHub ===== */
const gunzipText = async u8 => {
  if (u8[0] !== 0x1f || u8[1] !== 0x8b) return new TextDecoder().decode(u8);
  return new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
};
function askPassword(){
  return new Promise(res => openModal('Backup cifrato', `<form id="pwf"><label class="f">Password del backup (il secret BACKUP_PASSWORD su GitHub)</label><input class="inp" type="password" name="pw" autofocus autocomplete="off">
    <div class="mfoot"><button type="button" class="btn" data-c>Annulla</button><button class="btn pri">Apri</button></div></form>`, {onMount: m => {
    $('[data-c]', m).onclick = () => { closeModal(); res(null); };
    $('#pwf', m).onsubmit = e => { e.preventDefault(); const v = e.target.elements.pw.value; closeModal(); res(v); };
  }}));
}
/** apre un file di backup: JSON semplice, JSON compresso o cifrato (openssl aes-256-cbc, pbkdf2 sha256 200000) */
async function readBackupFile(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  if (buf.length > 16 && new TextDecoder().decode(buf.slice(0, 8)) === 'Salted__'){
    const pw = await askPassword(); if (!pw) throw new Error('Ripristino annullato');
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', salt: buf.slice(8, 16), iterations: 200000, hash: 'SHA-256'}, base, 384));
    const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
    let plain;
    try { plain = new Uint8Array(await crypto.subtle.decrypt({name: 'AES-CBC', iv: bits.slice(32, 48)}, key, buf.slice(16))); }
    catch { throw new Error('Password sbagliata'); }
    return JSON.parse(await gunzipText(plain));
  }
  return JSON.parse(await gunzipText(buf));
}
async function importJSON(file){
  const j = await readBackupFile(file);
  if (!j.cards || !j.copies) throw new Error('File JSON non riconosciuto');
  index();
  return commit(`Ripristinate ${j.copies.length} righe da backup`, async tx => {
    const remap = new Map(), newCards = [];
    for (const c of j.cards){ const ex = IX.byKey.get(keyOf(c)); if (ex) remap.set(c.id, ex.id); else if (!S.cards.has(c.id)){ newCards.push(strip(c)); remap.set(c.id, c.id); } else remap.set(c.id, c.id); }
    await tx.insert('cards', newCards);
    await tx.insert('lots', (j.lots || []).filter(l => !S.lots.has(l.id)).map(strip));
    await tx.insert('orders', (j.orders || []).filter(o => !S.orders.has(o.id)).map(strip));
    const okOrder = id => id && (S.orders.has(id));
    await tx.insert('copies', j.copies.filter(c => !S.copies.has(c.id)).map(c => ({...strip(c), card_id: remap.get(c.card_id) || c.card_id, order_id: okOrder(c.order_id) ? c.order_id : null})));
  });
}

    const {error} = await sb.from('vetrina_requests').delete().eq('id', d.id); if (error){ toast(error.message, 'err'); return; } S.requests.delete(d.id); toast('Richiesta eliminata'); render(); },
  reqSell: d => { const r = S.requests.get(d.id); if (!r) return; const ids = requestCopies(r);
    if (!ids.length){ toast('Nessuna delle carte richieste è ancora disponibile', 'err'); return; }
    orderForm({items: ids, buyer: r.name, platform: 'Vetrina', requestId: r.id}); },
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || !S.user) return;
  e.preventDefault(); ACT[b.dataset.act]?.(b.dataset, b, e);
});

function feesModal(after){
  openModal('Commissioni e spedizioni', `<form id="fsf">
    <p class="muted small" style="margin-top:0">Servono a calcolare quanto ti resta davvero da ogni vendita. La commissione viene proposta in automatico nel modulo di vendita e puoi sempre correggerla a mano.</p>
    <div class="tw"><table class="t"><thead><tr><th>Piattaforma</th><th>% sugli articoli</th><th>Fisso per ordine €</th></tr></thead><tbody>
      ${Object.entries(SET.fees).map(([p, v]) => `<tr><td><b>${esc(p)}</b></td><td><input class="inp" style="max-width:110px" data-pct="${esc(p)}" inputmode="decimal" value="${fmtIn(v.pct)}" placeholder="0"></td><td><input class="inp" style="max-width:110px" data-fix="${esc(p)}" inputmode="decimal" value="${fmtIn(v.fixed)}" placeholder="0,00"></td></tr>`).join('')}
    </tbody></table></div>
    <div class="small muted" style="margin:6px 0 14px">Cardmarket parte dal 5% (venditore privato). Controlla le tariffe del tuo account CardTrader e delle altre piattaforme.</div>
    <div class="fg">
      <div><label class="f">Tuo costo medio spedizione + imballaggio €</label><input class="inp" name="sk" inputmode="decimal" value="${fmtIn(SET.shipCost)}" placeholder="es. 1,50"></div>
      <div><label class="f">Spedizione che fai pagare di solito €</label><input class="inp" name="sc" inputmode="decimal" value="${fmtIn(SET.shipCharged)}" placeholder="es. 1,30"></div>
      <div><label class="f">Carte “ferme” dopo (mesi)</label><input class="inp" name="st" type="number" min="1" value="${SET.stale || 6}"></div>
    </div>
    <div class="mfoot"><button type="button" class="btn" data-c>Annulla</button><button class="btn pri">Salva</button></div></form>`, {wide: true, onMount: m => {
    $('[data-c]', m).onclick = () => { closeModal(); after && after(); };
    $('#fsf', m).onsubmit = async e => {
      e.preventDefault(); const E = n => e.target.elements[n];
      $$('[data-pct]', m).forEach(i => { SET.fees[i.dataset.pct].pct = num(i.value) || 0; });
      $$('[data-fix]', m).forEach(i => { SET.fees[i.dataset.fix].fixed = num(i.value) || 0; });
      SET.shipCost = num(E('sk').value) || 0; SET.shipCharged = num(E('sc').value) || 0; SET.stale = Math.max(1, parseInt(E('st').value) || 6);
      await saveSettings(); closeModal(); toast('Impostazioni salvate'); render(); after && after();
    };
  }});
}
function langModal(){
  const nEN = sum([...S.copies.values()].filter(c => c.language === 'EN' && c.status !== 'venduto'), c => c.qty);
  openModal('Lingue', `<form id="lgf">
    <p class="muted small" style="margin-top:0">Per l'inglese puoi distinguere la stampa europea (EN-EU) da quella americana (EN-US).</p>
    <div class="fg"><div class="full"><label class="f">Le carte in inglese dei CSV di Cardmarket sono…</label>
      <select class="inp" name="en">${['EN-EU', 'EN-US', 'EN'].map(l => opt(l, SET.enDefault || 'EN-EU', `${l} – ${LANG_LBL[l]}`)).join('')}</select>
      <div class="small muted" style="margin-top:3px">Cardmarket non distingue europeo e americano: questa è la scelta predefinita all'import, poi puoi cambiare la singola copia.</div></div></div>
    ${nEN ? `<div class="note" style="margin-top:12px">${nEN} ${nEN === 1 ? 'copia disponibile ha' : 'copie disponibili hanno'} ancora la lingua “EN” generica. <label><input type="checkbox" name="conv"> Convertile in</label> <select class="inp" name="convto" style="width:auto;display:inline-block">${['EN-EU', 'EN-US'].map(l => opt(l, 'EN-EU')).join('')}</select></div>` : ''}
    <div class="mfoot"><button type="button" class="btn" data-c>Annulla</button><button class="btn pri">Salva</button></div></form>`, {wide: true, onMount: m => {
    $('[data-c]', m).onclick = closeModal;
    $('#lgf', m).onsubmit = async e => {
      e.preventDefault(); const E = n => e.target.elements[n];
      SET.langAdj = {}; SET.enDefault = E('en').value;
      const conv = E('conv')?.checked ? E('convto').value : null;
      await saveSettings(); closeModal(); index();
      if (conv) await commit(`Lingua EN convertita in ${conv}`, async tx => {
        const ids = [...S.copies.values()].filter(c => c.language === 'EN' && c.status !== 'venduto').map(c => c.id);
        await tx.update('copies', ids, {language: conv});
        for (const id of ids) await mergeTwin(tx, id);
      });
      else { toast('Impostazioni salvate'); render(); }
    };
  }});
}
function settingsModal(){
  const cfg = getCfg();
  openModal('Impostazioni', `
    <dl class="info"><dt>Account</dt><dd>${esc(S.user.email || '—')}</dd><dt>Archiviazione</dt><dd>${S.mode === 'local' ? 'Solo questo browser' : 'Supabase'}</dd>
    ${S.mode === 'supabase' ? `<dt>Progetto</dt><dd class="small">${esc(cfg?.url || '')}</dd>` : ''}
    <dt>Contenuto</dt><dd>${S.cards.size} carte · ${S.copies.size} righe · ${S.lots.size} lotti · ${S.orders.size} vendite</dd>
    <dt>Commissioni</dt><dd>${Object.entries(SET.fees).filter(([, v]) => v.pct || v.fixed).map(([p, v]) => `${esc(p)} ${String(v.pct).replace('.', ',')}%`).join(' · ') || 'nessuna'} · spedizione ${eur(SET.shipCost)}</dd></dl>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="fees">💶 Commissioni e spedizioni…</button><button class="btn" id="langs">🌐 Lingue…</button><button class="btn" id="share">🔗 Link vetrina…</button></div>
    <div class="mfoot">${cfg?.fixed ? '' : '<button class="btn dan" id="chg">Cambia collegamento</button>'}<button class="btn" id="rel">Ricarica dati</button><button class="btn pri" id="out">${S.mode === 'local' ? 'Esci' : 'Esci dall\'account'}</button></div>`,
  {onMount: m => {
    $('#fees', m).onclick = () => feesModal();
    $('#langs', m).onclick = () => langModal();
    $('#share', m).onclick = () => shareModal();
    $('#rel', m).onclick = async () => { closeModal(); await loadAll(); await loadSettings(); render(); toast('Dati ricaricati'); };
    $('#out', m).onclick = async () => { closeModal(); if (S.mode === 'supabase') await sb.auth.signOut(); S.user = null; undoStack.length = 0; SEL.clear(); if (S.mode === 'local') setCfg(null); render(); };
    $('#chg', m) && ($('#chg', m).onclick = async () => { closeModal(); if (S.mode === 'supabase') await sb.auth.signOut(); setCfg(null); S.user = null; sb = null; undoStack.length = 0; render(); });
  }});
}

/* ===================== AUTENTICAZIONE ===================== */
function renderAuth(){
  const cfg = getCfg();
  const root = $('#root');
  if (!cfg){
    root.innerHTML = `<div class="auth"><div class="logo"><i>D</i>DSR&nbsp;<span>Archive</span></div><div class="panel">
      <h2>Collega il tuo database Supabase</h2>
      <p class="muted small" style="margin-top:-4px">Su supabase.com → il tuo progetto → <b>Project Settings → API</b>: copia “Project URL” e la chiave <b>anon public</b>.</p>
      <form id="cfgf"><label class="f">Project URL</label><input class="inp" name="url" placeholder="https://xxxx.supabase.co" required>
      <label class="f" style="margin-top:10px">Chiave anon public</label><input class="inp" name="key" required placeholder="eyJhbGciOi…">
      <div class="mfoot"><button class="btn pri" style="width:100%;justify-content:center">Collega</button></div></form>
      <div class="note">Ricorda di eseguire una volta lo script <b>schema.sql</b> nel SQL Editor di Supabase.</div>
      <p class="small muted" style="text-align:center;margin:14px 0 0">Vuoi solo provarla? <a href="#" id="loc">Usa senza account (dati solo in questo browser)</a></p>
    </div></div>`;
    $('#cfgf').onsubmit = e => { e.preventDefault(); const url = fixUrl(e.target.url.value), key = clean(e.target.key.value).replace(/^["']|["']$/g, '');
      if (!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(url) && !confirm('L\'URL ' + url + ' non sembra un indirizzo Supabase (https://xxxx.supabase.co). Usarlo comunque?')) return; setCfg({mode: 'supabase', url, key}); boot(); };
    $('#loc').onclick = e => { e.preventDefault(); setCfg({mode: 'local'}); boot(); };
    return;
  }
  if (cfg.mode === 'local'){ boot(); return; }
  root.innerHTML = `<div class="auth"><div class="logo"><i>D</i>DSR&nbsp;<span>Archive</span></div><div class="panel">
    <div class="seg" id="am" style="width:100%;margin-bottom:14px"><button class="on" data-v="in" style="flex:1">Accedi</button><button data-v="up" style="flex:1">Registrati</button></div>
    <form id="lf2"><label class="f">Email</label><input class="inp" name="email" type="email" autocomplete="email" required>
    <label class="f" style="margin-top:10px">Password</label><input class="inp" name="pw" type="password" autocomplete="current-password" minlength="6" required>
    <div class="mfoot"><button class="btn pri" id="lbtn" style="width:100%;justify-content:center">Accedi</button></div></form>
    <div id="amsg"></div>
    ${cfg.fixed ? '' : `<p class="small muted" style="text-align:center;margin:12px 0 0"><a href="#" id="reset">Cambia progetto Supabase</a></p>`}
  </div></div>`;
  let mode = 'in';
  $$('#am button').forEach(b => b.onclick = () => { mode = b.dataset.v; $$('#am button').forEach(x => x.classList.toggle('on', x === b)); $('#lbtn').textContent = mode === 'in' ? 'Accedi' : 'Crea account'; });
  $('#reset') && ($('#reset').onclick = e => { e.preventDefault(); setCfg(null); sb = null; renderAuth(); });
  $('#lf2').onsubmit = async e => {
    e.preventDefault(); const email = e.target.email.value.trim(), password = e.target.pw.value;
    $('#lbtn').disabled = true; busy(true);
    try {
      const r = mode === 'in' ? await sb.auth.signInWithPassword({email, password}) : await sb.auth.signUp({email, password, options: {emailRedirectTo: location.origin + location.pathname}});
      if (r.error) throw r.error;
      if (mode === 'up' && !r.data.session){ $('#amsg').innerHTML = `<div class="note" style="margin-top:12px">Account creato: apri l'email di conferma che ti ha mandato Supabase, poi torna qui e accedi.</div>`; }
      else await afterLogin(r.data.session.user);
    } catch (er){
      const msg = /invalid login/i.test(er.message) ? 'Email o password errate' : /not confirmed/i.test(er.message) ? 'Devi prima confermare l\'email (controlla la posta)' : /fetch/i.test(er.message) ? 'Impossibile raggiungere Supabase: il progetto potrebbe essere in pausa' : /invalid path|invalid api key|no api key/i.test(er.message) ? 'URL o chiave di Supabase non corretti. Usa "Cambia progetto Supabase" qui sotto e incolla Project URL (https://xxxx.supabase.co) e la chiave anon public.' : er.message;
      $('#amsg').innerHTML = `<div class="note" style="margin-top:12px;border-color:#5a2a30;background:#2a1a1f;color:#ffb3b0">${esc(msg)}</div>`;
    } finally { $('#lbtn') && ($('#lbtn').disabled = false); busy(false); }
  };
}
async function afterLogin(user){
  S.user = user;
  $('#root').innerHTML = `<div class="auth"><div class="panel empty">Caricamento archivio…</div></div>`;
  try { await loadAll(); await loadSettings(); setTimeout(() => cmAutoload(), 50); }
  catch (e){
    console.error(e);
    const hint = /relation|does not exist|schema cache/i.test(e.message) ? 'Le tabelle non esistono ancora: esegui lo script schema.sql nel SQL Editor di Supabase.' : e.message;
    $('#root').innerHTML = `<div class="auth"><div class="panel"><h2>Impossibile caricare i dati</h2><p>${esc(hint)}</p><button class="btn pri" onclick="location.reload()">Riprova</button> <button class="btn" id="lo">Esci</button></div></div>`;
    $('#lo').onclick = async () => { if (sb) await sb.auth.signOut(); S.user = null; render(); };
    return;
  }
  render();
}
async function boot(){
  if (isGuestLink()){ await guestBoot(); return; }
  const cfg = getCfg();
  if (!cfg){ renderAuth(); return; }
  S.mode = cfg.mode;
  if (cfg.mode === 'local'){ await afterLogin({email: 'Archivio locale'}); return; }
  if (!window.supabase){ $('#root').innerHTML = `<div class="auth"><div class="panel">Impossibile caricare la libreria Supabase. Controlla la connessione e ricarica la pagina.</div></div>`; return; }
  sb = window.supabase.createClient(cfg.url, cfg.key, {auth: {persistSession: true, autoRefreshToken: true, storageKey: 'cardarchive.auth'}});
  const {data} = await sb.auth.getSession();
  if (data.session) await afterLogin(data.session.user); else renderAuth();
  sb.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_OUT'){ S.user = null; render(); } });
}
boot();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
