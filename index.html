<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13294b">
<title>CardArchive</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#13294b;--navy2:#1c3a66;--navy3:#26497d;--blue:#1e6fd9;--blue-d:#1559b3;
  --bg:#eef1f5;--card:#fff;--line:#dde2ea;--line2:#eef1f6;--text:#1f2733;--muted:#6b7686;
  --green:#23905a;--red:#cf3e3e;--orange:#f39200;--yellow:#f6c343;
  --r:8px;--sh:0 1px 2px rgba(16,30,54,.06),0 2px 8px rgba(16,30,54,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.right{text-align:right}
.nowrap{white-space:nowrap}
.pos{color:var(--green);font-weight:600}
.neg{color:var(--red);font-weight:600}

/* top bar */
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:9px;color:#fff;font-weight:800;font-size:19px;letter-spacing:-.3px;white-space:nowrap}
.logo:hover{text-decoration:none}
.logo i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--orange),#ffb84d);font-style:normal;color:var(--navy);font-size:15px}
.logo span{color:#9fc1ff}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;border:0;border-radius:6px;padding:9px 12px 9px 34px;background:#fff;color:var(--text);outline:none}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5}
.top-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.tbtn{background:var(--navy2);border:1px solid var(--navy3);color:#fff;border-radius:6px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:var(--navy3)}
.tbtn:disabled{opacity:.4;cursor:default}
.subnav{background:var(--navy2)}
.subnav-in{max-width:1240px;margin:0 auto;display:flex;gap:2px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.subnav a{color:#d6e2f5;padding:10px 12px;white-space:nowrap;border-bottom:3px solid transparent;font-weight:500}
.subnav a:hover{color:#fff;text-decoration:none;background:rgba(255,255,255,.05)}
.subnav a.on{color:#fff;border-bottom-color:var(--orange)}
.subnav .sep{width:1px;background:rgba(255,255,255,.15);margin:8px 6px}
#busy{position:fixed;top:0;left:0;height:3px;width:0;background:var(--orange);z-index:99;transition:width .3s}
#busy.on{width:80%;transition:width 4s cubic-bezier(.1,.6,.2,1)}

/* layout */
main{max-width:1240px;margin:0 auto;padding:16px}
.crumbs{font-size:13px;color:var(--muted);margin:2px 0 12px}
.crumbs a{color:var(--muted)}
.crumbs b{color:var(--text);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:16px}
.panel.flush{padding:0;overflow:hidden}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:#f8f9fb}
.panel-h h2{margin:0}
.grow{flex:1}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row>*{min-width:0}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}

/* games tiles */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.game{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);color:var(--text)}
.game:hover{border-color:var(--blue);text-decoration:none}
.gicon{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:15px}
.g-ygo{background:linear-gradient(135deg,#7a3cc2,#c0392b)}
.g-pkm{background:linear-gradient(135deg,#f0b90b,#e5532d)}
.g-op{background:linear-gradient(135deg,#d62828,#264aa8)}
.g-x{background:linear-gradient(135deg,#4b6584,#2d3e50)}

/* buttons/forms */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#b9c3d3;background:#f8fafc;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-d)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.dan{color:var(--red);border-color:#f0c9c9}
.btn.dan:hover{background:#fdf2f2}
.btn.dan.fill{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 8px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.inp,select.inp,textarea.inp{width:100%;border:1px solid #cdd5e1;border-radius:6px;padding:7px 9px;background:#fff;outline:none}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,111,217,.15)}
label.f{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fg .full{grid-column:1/-1}
.seg{display:inline-flex;border:1px solid #cdd5e1;border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--navy2);color:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .inp{width:auto}
fieldset{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0}
legend{font-size:12.5px;color:var(--muted);font-weight:600;padding:0 4px}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);background:#f8f9fb;white-space:nowrap}
.t td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t tbody tr:nth-child(even){background:#fbfcfd}
.t tbody tr:hover{background:#f1f6fe}
.t th.sortable{cursor:pointer}
.t th.sortable:hover{color:var(--text)}
.t tfoot td{font-weight:700;background:#f8f9fb;border-top:1px solid var(--line)}
.t .acts{white-space:nowrap;text-align:right}
.t a.cname{font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}
.pager{display:flex;gap:6px;justify-content:flex-end;align-items:center;padding:10px 16px}

/* badges */
.b{display:inline-block;border-radius:4px;padding:1px 6px;font-size:11.5px;font-weight:700;line-height:18px;white-space:nowrap}
.c-MT{background:#17a2b8;color:#fff}.c-NM{background:#2e9b57;color:#fff}.c-EX{background:#8dbb3c;color:#fff}
.c-GD{background:#d6c22b;color:#2b2b00}.c-LP{background:#f29a2e;color:#fff}.c-PL{background:#e8664a;color:#fff}.c-PO{background:#c0392b;color:#fff}
.c-x{background:#e5e9f0;color:#3c4656}
.rar{background:#eef2fb;color:#2c4a86;font-weight:600}
.st-d{background:#e3f4ea;color:#1d7a4a}.st-v{background:#eceff4;color:#5b6474}
.lotb{background:#fff3df;color:#9a5b00}
.lang{background:#f1f3f7;color:#3c4656;font-weight:600}

/* card page */
.cardtop{display:grid;grid-template-columns:220px 1fr;gap:16px}
.cimg{width:220px;aspect-ratio:63/88;border-radius:10px;background:linear-gradient(160deg,#2a4777,#13294b);display:grid;place-items:center;color:#fff;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.2);position:relative}
.cimg img{width:100%;height:100%;object-fit:cover}
.cimg .ph{text-align:center;padding:16px}
.cimg .ph b{display:block;font-size:17px;margin-top:10px}
.cimg .ph small{opacity:.7}
.info{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13.5px}
.info dt{color:var(--muted)}
.info dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* modal */
.mback{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow-y:auto}
.mbox{background:#fff;border-radius:10px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox.wide{max-width:780px}
.mhead{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.mhead h3{flex:1;font-size:16px}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.mbody{padding:16px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:14px;margin-top:14px;border-top:1px solid var(--line)}

/* autocomplete */
.acw{position:relative}
.ac{position:absolute;left:0;right:0;top:100%;margin-top:3px;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:60;max-height:300px;overflow-y:auto;color:var(--text)}
.ac:empty{display:none}
.ac div.it{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line2)}
.ac div.it:last-child{border-bottom:0}
.ac div.it.on,.ac div.it:hover{background:#eef4ff}
.ac div.it small{display:block;color:var(--muted);font-size:11.5px}
.ac .hd{padding:5px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:#f8f9fb}

/* toast */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.tst{background:#1f2733;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;max-width:92vw}
.tst.err{background:var(--red)}
.tst button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:5px;padding:3px 8px;cursor:pointer}

/* auth */
.auth{max-width:440px;margin:7vh auto;padding:0 16px}
.auth .panel{padding:24px}
.auth .logo{color:var(--navy);justify-content:center;font-size:24px;margin-bottom:18px}
.auth .logo span{color:var(--blue)}
.note{background:#f4f7fc;border:1px solid #dde6f4;border-radius:6px;padding:10px 12px;font-size:13px;color:#3b4b63}
.dz{border:2px dashed #c4cfdf;border-radius:8px;padding:22px;text-align:center;background:#fafbfd;cursor:pointer}
.dz:hover,.dz.on{border-color:var(--blue);background:#f1f6fe}

@media (max-width:760px){
  .top-in{flex-wrap:wrap;gap:10px}
  .search{order:3;max-width:none;flex-basis:100%}
  .tbtn .lbl{display:none}
  main{padding:12px}
  .cardtop{grid-template-columns:1fr}
  .cimg{width:160px;margin:0 auto}
  .hide-m{display:none}
  .t td,.t th{padding:7px 8px}
}
</style>
</head>
<body>
<div id="busy"></div>
<div id="root"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* =====================================================================
   CONFIGURAZIONE OPZIONALE
   Se incolli qui URL e chiave "anon public" del tuo progetto Supabase,
   l'app non te li chiederà su nessun dispositivo (PC e telefono).
   ===================================================================== */
const SUPABASE_URL = '';
const SUPABASE_ANON_KEY = '';

/* ===================== utilità ===================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EUR = new Intl.NumberFormat('it-IT', {style:'currency', currency:'EUR'});
const eur = n => (n == null || isNaN(n)) ? '—' : EUR.format(n);
const signEur = n => (n == null || isNaN(n)) ? '—' : `<span class="${n >= 0 ? 'pos' : 'neg'}">${n > 0 ? '+' : ''}${EUR.format(n)}</span>`;
const pad = n => String(n).padStart(2, '0');
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoLocal(new Date());
const fdate = d => d ? d.slice(0,10).split('-').reverse().join('/') : '—';
const MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const fmonth = m => { const [y, mm] = m.split('-'); return `${MESI[+mm-1]} ${y}`; };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c === 'x' ? r : (r&3|8)).toString(16); }));
const clean = s => String(s ?? '').replace(/\s+/g, ' ').trim();
const norm = s => clean(s).toLowerCase();
const fold = s => norm(s).normalize('NFD').replace(/[̀-ͯ]/g, '');
const keyOf = c => [c.game, c.expansion, c.name, c.rarity].map(norm).join('|');
const sum = (a, f) => a.reduce((t, x) => t + (f(x) || 0), 0);
const round2 = n => Math.round(n * 100) / 100;
const enc = s => encodeURIComponent(s === '' ? '~' : s);
const dec = s => { const v = decodeURIComponent(s); return v === '~' ? '' : v; };
function num(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).replace(/[€\s]/g, '').replace(/eur/i, '');
  if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, '');
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

const GAMES = ['Yu-Gi-Oh!', 'Pokémon', 'One Piece'];
function gameName(v){
  const s = fold(v);
  if (!s) return '';
  if (/yu.?gi/.test(s)) return 'Yu-Gi-Oh!';
  if (/pok/.test(s)) return 'Pokémon';
  if (/one.?piece/.test(s)) return 'One Piece';
  if (/magic|mtg/.test(s)) return 'Magic';
  if (/lorcana/.test(s)) return 'Lorcana';
  return clean(v);
}
const gameCls = g => g === 'Yu-Gi-Oh!' ? 'g-ygo' : g === 'Pokémon' ? 'g-pkm' : g === 'One Piece' ? 'g-op' : 'g-x';
const gameAbbr = g => g === 'Yu-Gi-Oh!' ? 'YGO' : g === 'Pokémon' ? 'PKM' : g === 'One Piece' ? 'OP' : (g || '?').slice(0,3).toUpperCase();

const CONDS = ['MT','NM','EX','GD','LP','PL','PO'];
const COND_LBL = {MT:'Mint', NM:'Near Mint', EX:'Excellent', GD:'Good', LP:'Light Played', PL:'Played', PO:'Poor'};
function normCond(v){
  const s = fold(v); if (!s) return 'NM';
  const u = s.toUpperCase(); if (CONDS.includes(u)) return u;
  const map = [[/^near ?mint|^nm/, 'NM'], [/^mint|^perfett/, 'MT'], [/excellent|slightly|ottim/, 'EX'], [/^good|moderately|buon/, 'GD'],
               [/light|^played|^lp/, 'LP'], [/heavily|^pl/, 'PL'], [/poor|damag|rovinat/, 'PO']];
  for (const [re, c] of map) if (re.test(s)) return c;
  return clean(v).toUpperCase().slice(0, 12);
}
const condB = c => c ? `<span class="b ${CONDS.includes(c) ? 'c-'+c : 'c-x'}" title="${esc(COND_LBL[c] || c)}">${esc(c)}</span>` : '';
const LANGS = ['IT','EN','DE','FR','ES','PT','JP','KR','CN'];
const RARITIES = {
  'Yu-Gi-Oh!': ['Common','Rare','Super Rare','Ultra Rare','Secret Rare','Ultimate Rare','Ghost Rare','Starlight Rare','Collector\'s Rare','Quarter Century Secret Rare','Prismatic Secret Rare','Platinum Secret Rare','Gold Rare','Premium Gold Rare','Short Print'],
  'Pokémon': ['Common','Uncommon','Rare','Rare Holo','Double Rare','Ultra Rare','Illustration Rare','Special Illustration Rare','Hyper Rare','ACE SPEC Rare','Shiny Rare','Promo'],
  'One Piece': ['C','UC','R','SR','SEC','L','SP','TR','P']
};
const EDITIONS = ['1st Edition','Unlimited','Limited Edition','Reprint'];
const PLATFORMS = ['Cardmarket','CardTrader','eBay','Vinted','Di persona','Altro'];

/* ===================== stato & backend ===================== */
const TABLES = ['cards','lots','copies'];
const S = {cards:new Map(), lots:new Map(), copies:new Map(), user:null, mode:null};
let sb = null;
const CFG_KEY = 'cardarchive.cfg';
function getCfg(){
  if (SUPABASE_URL && SUPABASE_ANON_KEY) return {mode:'supabase', url:SUPABASE_URL, key:SUPABASE_ANON_KEY, fixed:true};
  try { return JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch { return null; }
}
const setCfg = c => c ? localStorage.setItem(CFG_KEY, JSON.stringify(c)) : localStorage.removeItem(CFG_KEY);

const LS = {
  get: t => { try { return JSON.parse(localStorage.getItem('cardarchive.local.'+t) || '[]'); } catch { return []; } },
  put: (t, rows) => localStorage.setItem('cardarchive.local.'+t, JSON.stringify(rows))
};
const chunk = (a, n) => { const r = []; for (let i = 0; i < a.length; i += n) r.push(a.slice(i, i+n)); return r; };
const strip = r => { const o = {...r}; delete o.user_id; return o; };

const DB = {
  async fetchAll(t){
    if (S.mode === 'local') return LS.get(t);
    const all = [];
    for (let from = 0; ; from += 1000){
      const {data, error} = await sb.from(t).select('*').order('created_at').range(from, from + 999);
      if (error) throw error;
      all.push(...data);
      if (data.length < 1000) break;
    }
    return all;
  },
  async insert(t, rows){
    if (S.mode === 'local'){ LS.put(t, LS.get(t).concat(rows)); return; }
    for (const c of chunk(rows, 500)){ const {error} = await sb.from(t).insert(c.map(strip)); if (error) throw error; }
  },
  async upsert(t, rows){
    if (S.mode === 'local'){ const m = new Map(LS.get(t).map(r => [r.id, r])); rows.forEach(r => m.set(r.id, r)); LS.put(t, [...m.values()]); return; }
    for (const c of chunk(rows, 500)){ const {error} = await sb.from(t).upsert(c); if (error) throw error; }
  },
  async update(t, ids, patch){
    if (S.mode === 'local'){ const set = new Set(ids); LS.put(t, LS.get(t).map(r => set.has(r.id) ? {...r, ...patch} : r)); return; }
    for (const c of chunk(ids, 200)){ const {error} = await sb.from(t).update(patch).in('id', c); if (error) throw error; }
  },
  async remove(t, ids){
    if (S.mode === 'local'){ const set = new Set(ids); LS.put(t, LS.get(t).filter(r => !set.has(r.id))); return; }
    for (const c of chunk(ids, 200)){ const {error} = await sb.from(t).delete().in('id', c); if (error) throw error; }
  }
};

function normRow(t, r){
  const o = {...r};
  if (t === 'copies'){ o.qty = Number(o.qty) || 1; o.buy_price = o.buy_price == null ? null : Number(o.buy_price); o.sell_price = o.sell_price == null ? null : Number(o.sell_price); }
  if (t === 'lots') o.total_price = Number(o.total_price) || 0;
  return o;
}
async function loadAll(){
  busy(true);
  try {
    for (const t of TABLES){ const rows = await DB.fetchAll(t); S[t] = new Map(rows.map(r => [r.id, normRow(t, r)])); }
  } finally { busy(false); }
}

/* ===== transazioni con annullamento ===== */
const undoStack = [];
async function commit(label, fn){
  const inv = [];
  const tx = {
    async insert(t, rows){
      rows = [].concat(rows); if (!rows.length) return;
      rows = rows.map(r => ({created_at: new Date().toISOString(), ...r}));
      await DB.insert(t, rows); rows.forEach(r => S[t].set(r.id, normRow(t, r)));
      inv.push({op:'remove', t, ids: rows.map(r => r.id)});
    },
    async update(t, ids, patch){
      ids = [].concat(ids).filter(id => S[t].has(id)); if (!ids.length) return;
      const olds = ids.map(id => ({...S[t].get(id)}));
      await DB.update(t, ids, patch); ids.forEach(id => S[t].set(id, normRow(t, {...S[t].get(id), ...patch})));
      inv.push({op:'upsert', t, rows: olds});
    },
    async remove(t, ids){
      ids = [].concat(ids).filter(id => S[t].has(id)); if (!ids.length) return;
      const olds = ids.map(id => ({...S[t].get(id)}));
      await DB.remove(t, ids); ids.forEach(id => S[t].delete(id));
      inv.push({op:'upsert', t, rows: olds});
    }
  };
  busy(true);
  try {
    await fn(tx);
  } catch (e){
    console.error(e);
    try { await applyInverse(inv.reverse()); } catch (e2){ console.error(e2); }
    busy(false); toast('Errore: ' + (e.message || e), 'err'); render(); return false;
  }
  busy(false);
  if (inv.length){ undoStack.push({label, inv: inv.reverse()}); if (undoStack.length > 40) undoStack.shift(); }
  render();
  toast(label, '', inv.length ? 'Annulla' : null);
  return true;
}
async function applyInverse(ops){
  for (const o of ops){
    if (o.op === 'remove'){ await DB.remove(o.t, o.ids); o.ids.forEach(id => S[o.t].delete(id)); }
    else { await DB.upsert(o.t, o.rows); o.rows.forEach(r => S[o.t].set(r.id, normRow(o.t, r))); }
  }
}
async function undo(){
  const u = undoStack.pop(); if (!u) return;
  busy(true);
  try { await applyInverse(u.inv); toast('Annullato: ' + u.label); }
  catch (e){ toast('Impossibile annullare: ' + e.message, 'err'); }
  busy(false); render();
}

  for (const c of S.copies.values()){
    (byCard.get(c.card_id) || byCard.set(c.card_id, []).get(c.card_id)).push(c);
    if (c.lot_id) (byLot.get(c.lot_id) || byLot.set(c.lot_id, []).get(c.lot_id)).push(c);
  }
  const byKey = new Map(); for (const c of S.cards.values()) byKey.set(keyOf(c), c);
  const games = [...new Set([...GAMES, ...[...S.cards.values()].map(c => c.game)])];
  IX = {byCard, byLot, byKey, games};

}
const copiesOf = id => IX.byCard.get(id) || [];
const lotCopies = id => IX.byLot.get(id) || [];
function cardStats(id){
  const cs = copiesOf(id);
  const av = cs.filter(c => c.status !== 'venduto'), so = cs.filter(c => c.status === 'venduto');
  const buys = cs.filter(c => c.buy_price != null && !c.lot_id);
  const buyQty = sum(buys, c => c.qty);
  const soldQty = sum(so, c => c.qty);
  const singlesSold = so.filter(c => !c.lot_id && c.buy_price != null && c.sell_price != null);
  const lastSale = so.filter(c => c.sell_date).sort((a, b) => b.sell_date.localeCompare(a.sell_date))[0];
  return {
    avail: sum(av, c => c.qty), sold: soldQty,
    avgBuy: buyQty ? sum(buys, c => c.buy_price * c.qty) / buyQty : null,
    avgSell: soldQty ? sum(so, c => c.sell_price) / soldQty : null,
    earned: sum(so, c => c.sell_price),
    margin: singlesSold.length ? sum(singlesSold, c => c.sell_price - c.buy_price * c.qty) : null,
    lastSale, conds: [...new Set(av.map(c => c.condition).filter(Boolean))]
  };
}
const unitSell = c => c.sell_price != null ? c.sell_price / c.qty : null;
function findCard(game, expansion, name, rarity){ return IX.byKey.get(keyOf({game, expansion, name, rarity})); }
async function ensureCard(tx, d){
  const ex = S.cards.size && [...S.cards.values()].find(c => keyOf(c) === keyOf(d));
  if (ex){ if (d.image_url && !ex.image_url) await tx.update('cards', ex.id, {image_url: d.image_url}); return ex.id; }
  const id = uid();
  await tx.insert('cards', {id, game: clean(d.game), expansion: clean(d.expansion), name: clean(d.name), rarity: clean(d.rarity), image_url: d.image_url || null});
  return id;
}
const sameAvail = (a, b) => a.card_id === b.card_id && a.status !== 'venduto' && (a.lot_id || null) === (b.lot_id || null) &&
  (a.condition || '') === (b.condition || '') && (a.edition || '') === (b.edition || '') && (a.language || '') === (b.language || '') &&
  (a.buy_price ?? null) === (b.buy_price ?? null) && (a.buy_date || null) === (b.buy_date || null);
async function addCopy(tx, cp){
  const twin = [...S.copies.values()].find(c => c.id !== cp.id && sameAvail(c, cp) && (c.notes || '') === (cp.notes || ''));
  if (twin) await tx.update('copies', twin.id, {qty: twin.qty + cp.qty});
  else await tx.insert('copies', {id: uid(), status: 'disponibile', ...cp});
}

/* ===== autocomplete ===== */
function autocomplete(input, source, onPick){
  const wrap = input.parentElement; wrap.classList.add('acw');
  const box = document.createElement('div'); box.className = 'ac'; wrap.appendChild(box);
  let items = [], sel = -1, req = 0, t;
  const show = list => {
    items = list; sel = -1;
    if (document.activeElement !== input){ box.innerHTML = ''; return; }
    let html = '', lastG = null;
    list.forEach((it, i) => {
      if (it.group && it.group !== lastG){ html += `<div class="hd">${esc(it.group)}</div>`; lastG = it.group; }
      html += `<div class="it" data-i="${i}">${esc(it.label)}${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</div>`;
    });
    box.innerHTML = html;
  };
  const run = async () => { const my = ++req; const q = input.value.trim(); await source(q, list => { if (my === req) show(list); }); };
  input.setAttribute('autocomplete', 'off');
  input.addEventListener('input', () => { clearTimeout(t); t = setTimeout(run, 220); });
  input.addEventListener('focus', run);
  input.addEventListener('blur', () => setTimeout(() => { box.innerHTML = ''; }, 180));
  input.addEventListener('keydown', e => {
    const els = $$('.it', box); if (!els.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + els.length) % els.length;
      els.forEach((el, i) => el.classList.toggle('on', i === sel)); els[sel].scrollIntoView({block: 'nearest'});
    } else if (e.key === 'Enter' && sel >= 0){ e.preventDefault(); pick(sel); }
    else if (e.key === 'Escape'){ box.innerHTML = ''; e.stopPropagation(); }
  });
  box.addEventListener('mousedown', e => { const it = e.target.closest('.it'); if (it){ e.preventDefault(); pick(+it.dataset.i); } });
  const pick = i => { const it = items[i]; box.innerHTML = ''; req++; onPick(it); };
}

const apiCache = new Map();
async function cachedJson(url){
  if (apiCache.has(url)) return apiCache.get(url);
  const p = fetch(url).then(r => r.ok ? r.json() : null).catch(() => null);
  apiCache.set(url, p); return p;
}
async function remoteNames(game, q){
  if (game === 'Yu-Gi-Oh!' && q.length >= 3){
    const j = await cachedJson(`https://db.ygoprodeck.com/api/v7/cardinfo.php?fname=${encodeURIComponent(q)}&num=12&offset=0`);
    return (j?.data || []).map(c => ({label: c.name, sub: `${c.type || ''}${c.card_sets ? ' · ' + c.card_sets.length + ' stampe' : ''}`, value: c.name, group: 'Database Yu-Gi-Oh!',
      sets: (c.card_sets || []).map(s => ({expansion: s.set_name, rarity: s.set_rarity, code: s.set_code}))}));
  }
  if (game === 'Pokémon' && q.length >= 2){
    const j = await cachedJson(`https://api.pokemontcg.io/v2/cards?q=${encodeURIComponent(`name:"${q.replace(/"/g, '')}*"`)}&pageSize=20&orderBy=-set.releaseDate&select=id,name,rarity,set,number,images`);
    const data = j?.data || [];
    const setsByName = {};
    data.forEach(c => (setsByName[c.name] ||= []).push({expansion: c.set?.name, rarity: c.rarity || '', code: `${c.set?.id || ''} ${c.number || ''}`.trim(), image: c.images?.small}));
    return data.map(c => ({label: c.name, sub: `${c.set?.name || ''} · ${c.rarity || '—'} · #${c.number || ''}`, value: c.name, group: 'Database Pokémon',
      pick: {expansion: c.set?.name, rarity: c.rarity || '', image: c.images?.small}, sets: setsByName[c.name]}));
  }
  return [];
}

function totals(game){
  const cards = [...S.cards.values()].filter(c => !game || c.game === game);
  const ids = new Set(cards.map(c => c.id));
  const cps = [...S.copies.values()].filter(c => ids.has(c.card_id));
  const av = cps.filter(c => c.status !== 'venduto');
  const lotIds = new Set(cps.map(c => c.lot_id).filter(Boolean));
  const lots = game ? [...lotIds].map(id => S.lots.get(id)).filter(Boolean) : [...S.lots.values()];
  const spentSingles = sum(cps.filter(c => !c.lot_id), c => (c.buy_price || 0) * c.qty);
  const spentLots = sum(lots, l => l.total_price);
  const earned = sum(cps.filter(c => c.status === 'venduto'), c => c.sell_price);
  return {cards: cards.filter(c => copiesOf(c.id).some(x => x.status !== 'venduto')).length, avail: sum(av, c => c.qty),
    sold: sum(cps.filter(c => c.status === 'venduto'), c => c.qty), spent: spentSingles + spentLots, spentLots, earned,
    stockCost: sum(av.filter(c => !c.lot_id), c => (c.buy_price || 0) * c.qty)};
}

function drawColl(){
  const q = fold(F.q);
  let rows = [...S.cards.values()].filter(c => (!F.game || c.game === F.game) && (!q || fold(`${c.name} ${c.expansion} ${c.rarity}`).includes(q)))

  const val = {name: x => x.c.name.toLowerCase(), exp: x => x.c.expansion.toLowerCase(), rar: x => x.c.rarity.toLowerCase(), game: x => x.c.game,
    avail: x => x.st.avail, sold: x => x.st.sold, buy: x => x.st.avgBuy ?? -1, sell: x => x.st.avgSell ?? -1}[F.sort];
  rows.sort((a, b) => { const A = val(a), B = val(b); return (A < B ? -1 : A > B ? 1 : a.c.name.localeCompare(b.c.name)) * F.dir; });
  const pages = Math.max(1, Math.ceil(rows.length / PAGE)); F.p = Math.min(F.p, pages - 1);
  const slice = rows.slice(F.p * PAGE, F.p * PAGE + PAGE);
  $('#fcount').textContent = `${rows.length} carte · ${sum(rows, x => F.st === 'vend' ? x.st.sold : x.st.avail)} copie`;
  const th = (k, l, cls = '') => `<th class="sortable ${cls}" data-sort="${k}">${l}${F.sort === k ? (F.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  $('#ctab').innerHTML = !slice.length ? `<div class="empty">Nessuna carta trovata.</div>` : `<div class="tw"><table class="t"><thead><tr>

    ${th('avail', 'Disp.', 'right')}${th('sold', 'Vend.', 'right')}${th('buy', 'Acq. medio', 'right hide-m')}${th('sell', 'Vend. medio', 'right')}</tr></thead><tbody>
    ${slice.map(({c, st}) => `<tr><td><a class="cname" href="#/c/${c.id}">${esc(c.name)}</a></td><td class="hide-m muted">${esc(c.expansion || '—')}</td><td>${c.rarity ? `<span class="b rar">${esc(c.rarity)}</span>` : ''}</td>

      <td class="right hide-m">${eur(st.avgBuy)}</td><td class="right">${eur(st.avgSell)}</td></tr>`).join('')}

    ${pages > 1 ? `<div class="pager"><button class="btn sm" data-pg="${F.p - 1}" ${F.p ? '' : 'disabled'}>‹</button><span class="small muted">Pagina ${F.p + 1} di ${pages}</span><button class="btn sm" data-pg="${F.p + 1}" ${F.p < pages - 1 ? '' : 'disabled'}>›</button></div>` : ''}`;
  $$('#ctab th[data-sort]').forEach(h => h.onclick = () => { const k = h.dataset.sort; F.dir = F.sort === k ? -F.dir : (['avail', 'sold', 'buy', 'sell'].includes(k) ? -1 : 1); F.sort = k; drawColl(); });

}

function lineChart(series){
  const W = 640, H = 230, P = {l: 56, r: 14, t: 14, b: 30};
  const all = series.flatMap(s => s.pts);
  if (!all.length) return `<div class="empty">Nessun prezzo registrato per questa carta.</div>`;
  let x0 = Math.min(...all.map(p => p.x)), x1 = Math.max(...all.map(p => p.x));
  if (x1 - x0 < 864e5 * 20){ x0 -= 864e5 * 15; x1 += 864e5 * 15; }
  const y1 = Math.max(...all.map(p => p.y)) * 1.15 || 1;
  const sx = x => P.l + (x - x0) / (x1 - x0) * (W - P.l - P.r), sy = y => H - P.b - y / y1 * (H - P.t - P.b);
  let g = '';
  for (let i = 0; i <= 4; i++){ const v = y1 * i / 4, y = sy(v); g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}" stroke="#e8ecf2"/><text x="${P.l - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="#6b7686">${EUR.format(v).replace(/,00/, '')}</text>`; }
  for (let i = 0; i <= 3; i++){ const x = x0 + (x1 - x0) * i / 3; g += `<text x="${sx(x)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === 3 ? 'end' : 'middle'}" font-size="11" fill="#6b7686">${fdate(isoLocal(new Date(x)))}</text>`; }
  for (const s of series){
    const pts = [...s.pts].sort((a, b) => a.x - b.x);
    if (pts.length > 1) g += `<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-opacity=".55" points="${pts.map(p => `${sx(p.x)},${sy(p.y)}`).join(' ')}"/>`;
    g += pts.map(p => `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="4.5" fill="${s.color}" stroke="#fff" stroke-width="1.5"><title>${esc(s.name)} · ${fdate(isoLocal(new Date(p.x)))} · ${EUR.format(p.y)}${p.n > 1 ? ' (×' + p.n + ')' : ''}</title></circle>`).join('');
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Storico prezzi">${g}</svg>
    <div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}

      if (it.localName){
        const vars = [...S.cards.values()].filter(c => c.game === curGame() && norm(c.name) === norm(it.value));
        st.sets = vars.map(c => ({expansion: c.expansion, rarity: c.rarity, code: 'nel tuo archivio', image: c.image_url}));
        if (vars.length === 1){ E('expansion').value = vars[0].expansion; E('rarity').value = vars[0].rarity; }
      }
      if (it.pick){ E('expansion').value = it.pick.expansion || ''; E('rarity').value = it.pick.rarity || ''; st.image = it.pick.image || null; }
      else if (st.sets && st.sets.length === 1){ E('expansion').value = st.sets[0].expansion; E('rarity').value = st.sets[0].rarity; st.image = st.sets[0].image || null; }
      hint();
      if (!E('expansion').value) setTimeout(() => E('expansion').focus(), 50); else E('qty').focus();
    });
    autocomplete(E('expansion'), async (q, cb) => {
      const f2 = fold(q), g = curGame(), out = [];
      if (st.sets) st.sets.filter(s => !f2 || fold(`${s.expansion} ${s.rarity} ${s.code}`).includes(f2)).slice(0, 40)
        .forEach(s => out.push({label: s.expansion, sub: `${s.rarity || '—'}${s.code ? ' · ' + s.code : ''}`, set: s, group: 'Stampe di questa carta'}));
      const exps = [...new Set([...S.cards.values()].filter(c => c.game === g).map(c => c.expansion))].filter(e => e && (!f2 || fold(e).includes(f2))).sort().slice(0, 10);
      exps.forEach(e => out.push({label: e, value: e, group: 'Espansioni del tuo archivio'}));
      cb(out);
    }, it => {
      if (it.set){ E('expansion').value = it.set.expansion; E('rarity').value = it.set.rarity || E('rarity').value; if (it.set.image) st.image = it.set.image; }
      else E('expansion').value = it.value;
      hint(); E('rarity').focus();
    });
    const setType = v => { $$('#ptype button', m).forEach(b => b.classList.toggle('on', b.dataset.v === v)); $('#p-single', m).hidden = v !== 'single'; $('#p-lot', m).hidden = v !== 'lot'; };
    $$('#ptype button', m).forEach(b => b.onclick = () => setType(b.dataset.v));
    const lotSel = () => { $('#newlot', m).hidden = E('lot').value !== '__new'; };
    E('lot').onchange = lotSel; lotSel();
    let againFlag = false;
    $$('button[type=submit]', m).forEach(b => b.addEventListener('click', () => { againFlag = b.name === 'again'; }));
    f.onsubmit = async e => {
      e.preventDefault();
      const name = clean(E('name').value); if (!name) return;
      const isLot = $('#ptype button.on', m).dataset.v === 'lot';
      const d = {game: curGame(), name, expansion: clean(E('expansion').value), rarity: clean(E('rarity').value), image_url: st.image};
      const qty = Math.max(1, parseInt(E('qty').value) || 1);
      let lotId = isLot ? E('lot').value : null;
      if (isLot && lotId === '__new' && !clean(E('lot_desc').value)){ toast('Scrivi una descrizione per il nuovo lotto', 'err'); E('lot_desc').focus(); return; }
      const price = num(E('buy_price').value);
      const ok = await commit(`Aggiunta ${qty}× ${name}`, async tx => {
        const cid = await ensureCard(tx, d);
        if (lotId === '__new'){ lotId = uid(); await tx.insert('lots', {id: lotId, description: clean(E('lot_desc').value), buy_date: E('lot_date').value || null, total_price: num(E('lot_price').value) || 0}); }
        await addCopy(tx, {card_id: cid, lot_id: lotId || null, qty, condition: E('condition').value, edition: clean(E('edition').value) || null, language: E('language').value || null,
          buy_date: E('buy_date').value || null, buy_price: isLot ? null : price, notes: clean(E('notes').value) || null});
        d.id = cid;
      });
      if (!ok) return;
      if (againFlag){ addCardForm({game: d.game, exp: d.expansion, lot: lotId || undefined, lang: E('language').value}); }
      else { closeModal(); if (!base) location.hash = '#/c/' + d.id; }
    };
  }});
}

/* ===================== GUADAGNI MENSILI ===================== */
let EG = '';
function monthly(game){
  const M = new Map(); const get = m => M.get(m) || M.set(m, {m, spent: 0, bought: 0, earned: 0, sold: 0, margin: 0}).get(m);
  const okCard = id => !game || S.cards.get(id)?.game === game;
  for (const c of S.copies.values()){
    if (!okCard(c.card_id)) continue;
    if (c.buy_date && !c.lot_id){ const r = get(c.buy_date.slice(0, 7)); r.spent += (c.buy_price || 0) * c.qty; r.bought += c.qty; }
    if (c.status === 'venduto' && c.sell_date){ const r = get(c.sell_date.slice(0, 7)); r.earned += c.sell_price || 0; r.sold += c.qty; if (!c.lot_id && c.buy_price != null) r.margin += (c.sell_price || 0) - c.buy_price * c.qty; }
  }
  for (const l of S.lots.values()){
    if (game && !lotCopies(l.id).some(c => okCard(c.card_id))) continue;
    if (l.buy_date){ const r = get(l.buy_date.slice(0, 7)); r.spent += l.total_price; r.bought += sum(lotCopies(l.id), c => c.qty); }
  }
  return [...M.values()].sort((a, b) => b.m.localeCompare(a.m));
}
function barChart(rows){
  rows = [...rows].reverse().slice(-12);
  if (!rows.length) return '';
  const W = 760, H = 230, P = {l: 56, r: 10, t: 12, b: 34};
  const mx = Math.max(...rows.flatMap(r => [r.spent, r.earned])) * 1.1 || 1;
  const bw = (W - P.l - P.r) / rows.length, sy = v => H - P.b - v / mx * (H - P.t - P.b);
  let g = '';
  for (let i = 0; i <= 4; i++){ const v = mx * i / 4, y = sy(v); g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}" stroke="#e8ecf2"/><text x="${P.l - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="#6b7686">${EUR.format(v).replace(/,\d\d/, '')}</text>`; }
  rows.forEach((r, i) => {

const ALIASES = {
  name: ['nome carta', 'nome', 'carta', 'item name', 'card name', 'name', 'product name', 'prodotto', 'product'],
  game: ['gioco', 'game'],
  expansion: ['set/espansione', 'set / espansione', 'espansione', 'set name', 'expansion', 'set', 'espansione/set'],
  edition: ['edizione', 'edition', 'printing'],
  rarity: ['rarita', 'rarity'],
  condition: ['condizione', 'condition', 'stato carta'],
  language: ['lingua', 'language'],
  qty: ['quantita', 'qty', 'quantity', 'q.ta', 'copie', 'amount'],
  lotId: ['id lotto', 'lotto', 'lot id', 'lot'],
  buyDate: ['data acquisto', 'purchase date', 'order date', 'data ordine', 'paid at', 'created at', 'data', 'date'],
  buyUnit: ['prezzo acquisto unitario', 'prezzo unitario', 'unit price', 'prezzo acquisto', 'price'],
  buyTotal: ['prezzo acquisto totale', 'totale acquisto', 'costo totale acquisto'],
  cents: ['price in eur cents', 'price cents'],
  status: ['stato', 'status'],
  sellDate: ['data vendita', 'sale date', 'sold date'],
  sellTotal: ['prezzo vendita totale', 'prezzo vendita', 'incasso', 'sale price', 'sold price'],
  platform: ['piattaforma', 'platform'],
  notes: ['note', 'notes'],
  desc: ['descrizione', 'description', 'descrizione lotto'],
  lotTotal: ['prezzo totale', 'costo totale', 'prezzo lotto', 'costo lotto', 'totale', 'costo', 'prezzo'],
  foil: ['foil'], fname: ['first edition', '1st edition']
};
const hnorm = h => fold(h).replace(/\(.*?\)|€/g, '').replace(/[^a-z0-9/. ]/g, ' ').replace(/\s+/g, ' ').trim();
function mapHeaders(headers, fields){
  const H = headers.map(hnorm), map = {}, used = new Set();
  for (const pass of [0, 1]) for (const f of fields){
    if (map[f] != null) continue;
    for (const a of ALIASES[f]){
      const i = H.findIndex((h, j) => !used.has(j) && h && (pass === 0 ? h === a : (a.length > 4 && h.startsWith(a + ' '))));
      if (i >= 0){ map[f] = i; used.add(i); break; }
    }
  }
  return map;
}
function parseDate(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number' && window.XLSX){ const d = XLSX.SSF.parse_date_code(v); return d ? `${d.y}-${pad(d.m)}-${pad(d.d)}` : null; }
  if (v instanceof Date) return isoLocal(v);
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/); if (m){ const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${pad(m[2])}-${pad(m[1])}`; }
  const t = Date.parse(s); return isNaN(t) ? null : isoLocal(new Date(t));
}
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = [';', ',', '\t'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim){ row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
function findHeaderRow(aoa){
  for (let i = 0; i < Math.min(aoa.length, 15); i++){ const H = (aoa[i] || []).map(hnorm); if (H.some(h => ALIASES.name.includes(h) || ALIASES.desc.includes(h))) return i; }
  return -1;
}
/** Converte un file in una "proposta d'import": {cards, lots, copies, info} */
function buildImport(sheets, defaults){
  // sheets: [{name, aoa}]
  const lotsById = new Map(), rowsOut = [], info = {format: 'Generico', skipped: [], sheets: []};
  const lotSheets = [], cardSheets = [];
  for (const sh of sheets){
    if (/riepilog|summary|dashboard|statistic|grafic/i.test(sh.name)){ info.skipped.push(sh.name); continue; }
    const hr = findHeaderRow(sh.aoa); if (hr < 0){ info.skipped.push(sh.name); continue; }
    const headers = sh.aoa[hr].map(x => String(x ?? ''));
    const map = mapHeaders(headers, Object.keys(ALIASES));
    const body = sh.aoa.slice(hr + 1);
    if ((map.name == null || /lott/i.test(sh.name)) && (map.desc != null || map.name != null) && (map.name == null || /lott/i.test(sh.name))){ if (map.desc == null){ map.desc = map.name; delete map.name; } lotSheets.push({sh, map, body}); } else if (false) lotSheets.push({sh, map, body}); else if (map.name != null) cardSheets.push({sh, map, body});
    if (map.cents != null) info.format = 'Ordine CardTrader';
  }
  for (const {map, body} of lotSheets){
    for (const r of body){
      const g = k => map[k] != null ? r[map[k]] : null;
      const lid = clean(g('lotId') ?? ''); const d = clean(g('desc') ?? '');
      if (!lid && !d) continue;
      const tot = num(g('lotTotal')) ?? num(g('buyTotal')) ?? num(g('buyUnit')) ?? 0;
      lotsById.set(norm(lid || d), {id: uid(), description: d || ('Lotto ' + lid), buy_date: parseDate(g('buyDate')), total_price: round2(tot), _ref: lid});
    }
  }
  const lotAgg = new Map();
  for (const {sh, map, body} of cardSheets){
    info.sheets.push(sh.name);
    const sheetGame = gameName(sh.name);
    const sheetGameOk = /yu.?gi|pok|one.?piece|magic|lorcana/i.test(fold(sh.name));
    for (const r of body){
      const g = k => map[k] != null ? r[map[k]] : null;
      const name = clean(g('name') ?? ''); if (!name) continue;
      const game = gameName(g('game')) || (sheetGameOk ? sheetGame : '') || defaults.game;
      const qty = Math.max(1, parseInt(num(g('qty'))) || 1);
      const lotRef = clean(g('lotId') ?? '');
      let unit = num(g('buyUnit'));
      if (unit == null && num(g('buyTotal')) != null) unit = num(g('buyTotal')) / qty;
      if (unit == null && num(g('cents')) != null) unit = num(g('cents')) / 100;
      const sold = /vend|sold|venduto/i.test(String(g('status') ?? '')) || (num(g('sellTotal')) != null && map.status == null);
      let edition = clean(g('edition') ?? '') || null;
      if (map.fname != null && /^(true|1|yes|si|sì|x)$/i.test(String(g('fname')))) edition = edition || '1st Edition';
      let notes = clean(g('notes') ?? '') || null;
      if (map.foil != null && /^(true|1|yes|si|sì|x)$/i.test(String(g('foil')))) notes = notes ? notes + ' · Foil' : 'Foil';
      const row = {game, name, expansion: clean(g('expansion') ?? ''), rarity: clean(g('rarity') ?? ''),
        qty, condition: normCond(g('condition')), edition, language: clean(g('language') ?? '').toUpperCase().slice(0, 12) || null,
        buy_date: parseDate(g('buyDate')) || defaults.date || null, buy_price: lotRef ? null : (unit == null ? null : round2(unit)),
        status: sold ? 'venduto' : 'disponibile', sell_date: sold ? (parseDate(g('sellDate')) || null) : null, sell_price: sold ? num(g('sellTotal')) : null,
        platform: clean(g('platform') ?? '') || (sold ? null : null), notes, lotRef: lotRef || null};
      if (lotRef){
        const k = norm(lotRef); const a = lotAgg.get(k) || {sum: 0, date: null}; a.sum += num(g('buyTotal')) || 0; a.date = a.date || row.buy_date; lotAgg.set(k, a);
      }
      rowsOut.push(row);
    }
  }
  if (info.format === 'Generico' && lotSheets.length + cardSheets.length && cardSheets.some(c => c.map.lotId != null)) info.format = 'Tracker Excel (con lotti)';
  for (const [k, a] of lotAgg) if (!lotsById.has(k)) lotsById.set(k, {id: uid(), description: 'Lotto ' + k.toUpperCase(), buy_date: a.date, total_price: round2(a.sum), _ref: k, _guessed: true});
  // unisci copie identiche disponibili
  const merged = [];
  const mk = r => [r.game, r.expansion, r.name, r.rarity].map(norm).join('|') + '#' + [r.lotRef, r.condition, r.edition, r.language, r.buy_price, r.buy_date, r.notes].join('|');
  const mm = new Map();
  for (const r of rowsOut){
    if (r.status === 'disponibile'){ const k = mk(r); const ex = mm.get(k); if (ex){ ex.qty += r.qty; continue; } mm.set(k, r); }
    merged.push(r);
  }
  info.rawRows = rowsOut.length;
  return {rows: merged, lots: [...lotsById.values()], info};
}
async function readFileToSheets(file){
  const nm = file.name.toLowerCase();
  if (nm.endsWith('.csv') || nm.endsWith('.txt')) return [{name: file.name.replace(/\.\w+$/, ''), aoa: parseCSV(await file.text())}];
  if (!window.XLSX) throw new Error('Libreria Excel non caricata (controlla la connessione)');
  const wb = XLSX.read(await file.arrayBuffer(), {type: 'array'});
  return wb.SheetNames.map(n => ({name: n, aoa: XLSX.utils.sheet_to_json(wb.Sheets[n], {header: 1, raw: true, defval: ''})}));
}
async function runImport(plan){
  const {rows, lots} = plan;
  return commit(`Importate ${sum(rows, r => r.qty)} copie`, async tx => {
    const lotMap = new Map();
    const newLots = [];
    for (const l of lots){
      const exist = [...S.lots.values()].find(x => norm(x.description) === norm(l.description) && (x.buy_date || '') === (l.buy_date || ''));
      if (exist) lotMap.set(norm(l._ref || l.description), exist.id);
      else { lotMap.set(norm(l._ref || l.description), l.id); newLots.push({id: l.id, description: l.description, buy_date: l.buy_date, total_price: l.total_price}); }
    }
    await tx.insert('lots', newLots);
    const byKey = new Map([...S.cards.values()].map(c => [keyOf(c), c.id]));
    // senza rarità (es. export CardTrader): se esiste una sola versione della carta in quell'espansione, usa quella
    const pool = [...S.cards.values()].map(c => ({game: c.game, expansion: c.expansion, name: c.name, rarity: c.rarity})).concat(rows.filter(r => r.rarity));
    for (const r of rows) if (!r.rarity){
      const vars = [...new Set(pool.filter(c => norm(c.game) === norm(r.game) && norm(c.expansion) === norm(r.expansion) && norm(c.name) === norm(r.name) && c.rarity).map(c => c.rarity))];
      if (vars.length === 1) r.rarity = vars[0];
    }
    const newCards = [];
    for (const r of rows){ const k = keyOf(r); if (!byKey.has(k)){ const id = uid(); byKey.set(k, id); newCards.push({id, game: r.game, expansion: r.expansion, name: r.name, rarity: r.rarity, image_url: null}); } }
    await tx.insert('cards', newCards);
    const newCopies = [], bumps = new Map();
    const avail = [...S.copies.values()].filter(c => c.status !== 'venduto');
    for (const r of rows){
      const cp = {card_id: byKey.get(keyOf(r)), lot_id: r.lotRef ? (lotMap.get(norm(r.lotRef)) || null) : null, qty: r.qty, condition: r.condition, edition: r.edition, language: r.language,
        buy_date: r.buy_date, buy_price: r.buy_price, status: r.status, sell_date: r.sell_date, sell_price: r.sell_price, platform: r.platform, notes: r.notes};
      if (cp.status === 'disponibile'){
        const twin = avail.find(a => sameAvail(a, cp) && (a.notes || '') === (cp.notes || ''));
        if (twin){ bumps.set(twin.id, (bumps.get(twin.id) || twin.qty) + cp.qty); continue; }
      }
      newCopies.push({id: uid(), ...cp});
    }
    await tx.insert('copies', newCopies);
    for (const [id, q] of bumps) await tx.update('copies', id, {qty: q});
  });
}

async function importJSON(file){
  const j = JSON.parse(await file.text());

    const remap = new Map(), newCards = [];

  });
}

function showPlan(plan, fname){
  const {rows, lots, info} = plan;
  const byGame = {}; rows.forEach(r => { byGame[r.game] = (byGame[r.game] || 0) + r.qty; });
  const newCards = new Set(rows.map(keyOf).filter(k => !IX.byKey.has(k))).size;
  const sold = rows.filter(r => r.status === 'venduto');
  $('#impv').innerHTML = !rows.length ? `<div class="note" style="margin-top:12px">Nessuna carta trovata in <b>${esc(fname)}</b>. Serve almeno una colonna “Nome carta” (o “Item Name”).</div>` : `
    <div class="note" style="margin-top:12px">
      <b>${esc(fname)}</b> · formato: <b>${esc(info.format)}</b>${info.sheets.length ? ' · fogli: ' + info.sheets.map(esc).join(', ') : ''}${info.skipped.length ? ` <span class="muted">(ignorati: ${info.skipped.map(esc).join(', ')})</span>` : ''}<br>
      ${info.rawRows} righe lette → <b>${rows.length}</b> righe dopo l'unione delle copie identiche · <b>${newCards}</b> carte nuove · ${sum(rows, r => r.qty)} copie
      (${Object.entries(byGame).map(([g, n]) => `${esc(g)}: ${n}`).join(', ')})<br>
      ${sold.length} righe vendute (incasso ${eur(sum(sold, r => r.sell_price))}) · spesa singole ${eur(sum(rows.filter(r => r.buy_price != null), r => r.buy_price * r.qty))}
      ${lots.length ? ` · ${lots.length} lotti (${eur(sum(lots, l => l.total_price))})${lots.some(l => l._guessed) ? ' <span class="neg">— alcuni lotti non erano nel foglio “Lotti”: controlla il prezzo dopo l\'import</span>' : ''}` : ''}
    </div>
    <div class="tw" style="margin-top:10px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px"><table class="t"><thead><tr><th>Gioco</th><th>Carta</th><th>Espansione</th><th>Rarità</th><th>Q.tà</th><th></th><th class="right">Acquisto</th><th>Stato</th></tr></thead><tbody>
      ${rows.slice(0, 40).map(r => `<tr><td class="small">${esc(r.game)}</td><td>${esc(r.name)}</td><td class="small muted">${esc(r.expansion)}</td><td class="small">${esc(r.rarity)}</td><td>${r.qty}</td><td>${condB(r.condition)}</td>
        <td class="right">${r.lotRef ? '<span class="b lotb">lotto</span>' : eur(r.buy_price)}</td><td>${r.status === 'venduto' ? '<span class="b st-v">Venduta</span>' : '<span class="b st-d">Disp.</span>'}</td></tr>`).join('')}
    </tbody></table></div>${rows.length > 40 ? `<div class="small muted" style="margin-top:4px">…e altre ${rows.length - 40} righe</div>` : ''}
    <div class="mfoot" style="border:0"><button class="btn" id="impx">Annulla</button><button class="btn pri" id="impgo">Importa ${rows.length} righe</button></div>`;
  if (!rows.length) return;
  $('#impx').onclick = () => { $('#impv').innerHTML = ''; $('#imf').value = ''; };
  $('#impgo').onclick = async () => { $('#impgo').disabled = true; $('#impgo').textContent = 'Importazione…'; const ok = await runImport(plan); if (ok) location.hash = '#/collezione'; };
}
async function deleteAll(){
  openModal('Elimina tutto', `<p style="margin-top:0">Verranno cancellate <b>${S.cards.size}</b> carte, <b>${S.copies.size}</b> righe di copie e <b>${S.lots.size}</b> lotti. Scarico prima un backup JSON e potrai comunque annullare con ↶.</p>
    <label class="f">Scrivi <b>ELIMINA</b> per confermare</label><input class="inp" id="delc"><div class="mfoot"><button class="btn" data-c>Annulla</button><button class="btn dan fill" id="delgo" disabled>Elimina tutto</button></div>`, {onMount: m => {
    $('[data-c]', m).onclick = closeModal;
    $('#delc', m).oninput = e => { $('#delgo', m).disabled = e.target.value.trim().toUpperCase() !== 'ELIMINA'; };
    $('#delgo', m).onclick = async () => {
      exportJSON(); closeModal();
      await commit('Archivio svuotato', async tx => { await tx.remove('copies', [...S.copies.keys()]); await tx.remove('lots', [...S.lots.keys()]); await tx.remove('cards', [...S.cards.keys()]); });
    };
  }});
}

/* ===================== azioni globali ===================== */
const ACT = {
  undo: () => undo(),
  addCard: d => addCardForm({game: d.game, exp: d.exp, card: d.card, lot: d.lot}),
  editCard: d => editCardForm(d.id),
  delCard: async d => {
    const c = S.cards.get(d.id), n = sum(copiesOf(d.id), x => x.qty);
    if (!await confirmBox('Elimina carta', `Eliminare <b>${esc(c.name)}</b> e tutte le sue ${n} copie (vendute comprese)?`, 'Elimina')) return;
    const g = c.game, e = c.expansion;
    if (await commit(`Eliminata ${c.name}`, async tx => { await tx.remove('copies', copiesOf(d.id).map(x => x.id)); await tx.remove('cards', d.id); })) location.hash = `#/g/${enc(g)}/${enc(e)}`;
  },
  editCopy: d => editCopyForm(d.id),
  delCopy: async d => {
    const x = S.copies.get(d.id), c = S.cards.get(x.card_id);
    if (!await confirmBox('Elimina copia', `Eliminare ${x.qty}× <b>${esc(c.name)}</b> (${esc(x.condition || '')})?`, 'Elimina')) return;
    await commit(`Eliminata copia di ${c.name}`, async tx => {
      await tx.remove('copies', d.id);
      if (!copiesOf(c.id).filter(y => S.copies.has(y.id)).length) await tx.remove('cards', c.id);
    });
    if (!S.cards.has(c.id)) location.hash = '#/collezione';
  },
  sell: d => sellForm(d.id),
  addLot: () => lotForm(),
  editLot: d => lotForm(d.id),
  delLot: async d => {
    const l = S.lots.get(d.id), cs = lotCopies(d.id);
    openModal('Elimina lotto', `<p style="margin-top:0">Eliminare il lotto <b>${esc(l.description)}</b>?</p>${cs.length ? `<label><input type="checkbox" id="dlc"> Elimina anche le ${sum(cs, x => x.qty)} carte del lotto</label><div class="small muted" style="margin-top:4px">Se non le elimini restano in collezione come carte senza prezzo d'acquisto.</div>` : ''}
      <div class="mfoot"><button class="btn" data-c>Annulla</button><button class="btn dan fill" id="dlgo">Elimina</button></div>`, {onMount: m => {
      $('[data-c]', m).onclick = closeModal;
      $('#dlgo', m).onclick = async () => {
        const alsoCards = $('#dlc', m)?.checked; closeModal();
        const ok = await commit('Lotto eliminato', async tx => {
          const ids = cs.map(x => x.id);
          if (alsoCards){ const cardIds = new Set(cs.map(x => x.card_id)); await tx.remove('copies', ids);
            const empty = [...cardIds].filter(cid => ![...S.copies.values()].some(x => x.card_id === cid)); await tx.remove('cards', empty); }
          else await tx.update('copies', ids, {lot_id: null});
          await tx.remove('lots', d.id);
        });
        if (ok) location.hash = '#/lotti';
      };
    }});
  },
  exportJson: () => exportJSON(),
  exportXlsx: () => exportXLSX(),
  deleteAll: () => deleteAll(),
  settings: () => settingsModal(),
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || !S.user) return;
  e.preventDefault(); ACT[b.dataset.act]?.(b.dataset, b, e);
});

function settingsModal(){
  const cfg = getCfg();
  openModal('Impostazioni', `
    <dl class="info"><dt>Account</dt><dd>${esc(S.user.email || '—')}</dd><dt>Archiviazione</dt><dd>${S.mode === 'local' ? 'Solo questo browser' : 'Supabase'}</dd>
    ${S.mode === 'supabase' ? `<dt>Progetto</dt><dd class="small">${esc(cfg?.url || '')}</dd>` : ''}
    <dt>Contenuto</dt><dd>${S.cards.size} carte · ${S.copies.size} righe · ${S.lots.size} lotti</dd></dl>
    <div class="mfoot">${cfg?.fixed ? '' : '<button class="btn dan" id="chg">Cambia collegamento</button>'}<button class="btn" id="rel">Ricarica dati</button><button class="btn pri" id="out">${S.mode === 'local' ? 'Esci' : 'Esci dall\'account'}</button></div>`,
  {onMount: m => {
    $('#rel', m).onclick = async () => { closeModal(); await loadAll(); render(); toast('Dati ricaricati'); };
    $('#out', m).onclick = async () => { closeModal(); if (S.mode === 'supabase') await sb.auth.signOut(); S.user = null; undoStack.length = 0; if (S.mode === 'local') setCfg(null); render(); };
    $('#chg', m) && ($('#chg', m).onclick = async () => { closeModal(); if (S.mode === 'supabase') await sb.auth.signOut(); setCfg(null); S.user = null; sb = null; undoStack.length = 0; render(); });
  }});
}

/* ===================== AUTENTICAZIONE ===================== */
function renderAuth(){
  const cfg = getCfg();
  const root = $('#root');
  if (!cfg){
    root.innerHTML = `<div class="auth"><div class="logo"><i>CA</i>Card<span>Archive</span></div><div class="panel">
      <h2>Collega il tuo database Supabase</h2>
      <p class="muted small" style="margin-top:-4px">Su supabase.com → il tuo progetto → <b>Project Settings → API</b>: copia “Project URL” e la chiave <b>anon public</b>.</p>
      <form id="cfgf"><label class="f">Project URL</label><input class="inp" name="url" placeholder="https://xxxx.supabase.co" required>
      <label class="f" style="margin-top:10px">Chiave anon public</label><input class="inp" name="key" required placeholder="eyJhbGciOi…">
      <div class="mfoot"><button class="btn pri" style="width:100%;justify-content:center">Collega</button></div></form>
      <div class="note">Ricorda di eseguire una volta lo script <b>schema.sql</b> nel SQL Editor di Supabase.</div>
      <p class="small muted" style="text-align:center;margin:14px 0 0">Vuoi solo provarla? <a href="#" id="loc">Usa senza account (dati solo in questo browser)</a></p>
    </div></div>`;
    $('#cfgf').onsubmit = e => { e.preventDefault(); const url = clean(e.target.url.value).replace(/\/+$/, ''), key = clean(e.target.key.value);
      if (!/^https:\/\/.+/.test(url)){ toast('URL non valido', 'err'); return; } setCfg({mode: 'supabase', url, key}); boot(); };
    $('#loc').onclick = e => { e.preventDefault(); setCfg({mode: 'local'}); boot(); };
    return;
  }
  if (cfg.mode === 'local'){ boot(); return; }
  root.innerHTML = `<div class="auth"><div class="logo"><i>CA</i>Card<span>Archive</span></div><div class="panel">
    <div class="seg" id="am" style="width:100%;margin-bottom:14px"><button class="on" data-v="in" style="flex:1">Accedi</button><button data-v="up" style="flex:1">Registrati</button></div>
    <form id="lf2"><label class="f">Email</label><input class="inp" name="email" type="email" autocomplete="email" required>
    <label class="f" style="margin-top:10px">Password</label><input class="inp" name="pw" type="password" autocomplete="current-password" minlength="6" required>
    <div class="mfoot"><button class="btn pri" id="lbtn" style="width:100%;justify-content:center">Accedi</button></div></form>
    <div id="amsg"></div>
    ${cfg.fixed ? '' : `<p class="small muted" style="text-align:center;margin:12px 0 0"><a href="#" id="reset">Cambia progetto Supabase</a></p>`}
  </div></div>`;
  let mode = 'in';
  $$('#am button').forEach(b => b.onclick = () => { mode = b.dataset.v; $$('#am button').forEach(x => x.classList.toggle('on', x === b)); $('#lbtn').textContent = mode === 'in' ? 'Accedi' : 'Crea account'; });
  $('#reset') && ($('#reset').onclick = e => { e.preventDefault(); setCfg(null); sb = null; renderAuth(); });
  $('#lf2').onsubmit = async e => {
    e.preventDefault(); const email = e.target.email.value.trim(), password = e.target.pw.value;
    $('#lbtn').disabled = true; busy(true);
    try {
      const r = mode === 'in' ? await sb.auth.signInWithPassword({email, password}) : await sb.auth.signUp({email, password, options: {emailRedirectTo: location.origin + location.pathname}});
      if (r.error) throw r.error;
      if (mode === 'up' && !r.data.session){ $('#amsg').innerHTML = `<div class="note" style="margin-top:12px">Account creato: apri l'email di conferma che ti ha mandato Supabase, poi torna qui e accedi.</div>`; }
      else await afterLogin(r.data.session.user);
    } catch (er){
      const msg = /invalid login/i.test(er.message) ? 'Email o password errate' : /not confirmed/i.test(er.message) ? 'Devi prima confermare l\'email (controlla la posta)' : /fetch/i.test(er.message) ? 'Impossibile raggiungere Supabase: il progetto potrebbe essere in pausa' : er.message;
      $('#amsg').innerHTML = `<div class="note" style="margin-top:12px;border-color:#f0c9c9;background:#fdf2f2;color:#8a2a2a">${esc(msg)}</div>`;
    } finally { $('#lbtn') && ($('#lbtn').disabled = false); busy(false); }
  };
}
async function afterLogin(user){
  S.user = user;
  $('#root').innerHTML = `<div class="auth"><div class="panel empty">Caricamento archivio…</div></div>`;
  try { await loadAll(); }
  catch (e){
    console.error(e);
    const hint = /relation|does not exist|schema cache/i.test(e.message) ? 'Le tabelle non esistono ancora: esegui lo script schema.sql nel SQL Editor di Supabase.' : e.message;
    $('#root').innerHTML = `<div class="auth"><div class="panel"><h2>Impossibile caricare i dati</h2><p>${esc(hint)}</p><button class="btn pri" onclick="location.reload()">Riprova</button> <button class="btn" id="lo">Esci</button></div></div>`;
    $('#lo').onclick = async () => { if (sb) await sb.auth.signOut(); S.user = null; render(); };
    return;
  }
  render();
}
async function boot(){
  const cfg = getCfg();
  if (!cfg){ renderAuth(); return; }
  S.mode = cfg.mode;
  if (cfg.mode === 'local'){ await afterLogin({email: 'Archivio locale'}); return; }
  if (!window.supabase){ $('#root').innerHTML = `<div class="auth"><div class="panel">Impossibile caricare la libreria Supabase. Controlla la connessione e ricarica la pagina.</div></div>`; return; }
  sb = window.supabase.createClient(cfg.url, cfg.key, {auth: {persistSession: true, autoRefreshToken: true, storageKey: 'cardarchive.auth'}});
  const {data} = await sb.auth.getSession();
  if (data.session) await afterLogin(data.session.user); else renderAuth();
  sb.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_OUT'){ S.user = null; render(); } });
}
boot();
</script>
