<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a111d">
<title>DSR Archive</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --navy:#0a111d;--navy2:#111b2b;--navy3:#1d2b42;--blue:#4b8dff;--blue-d:#3a78e6;
  --bg:#0d131d;--card:#151d2a;--card2:#1a2333;--hover:#1f2a3c;--inp:#0f1622;--line:#273246;--line2:#1f2838;--text:#e3e8f0;--muted:#8d99ad;
  --green:#34c27b;--red:#f0605d;--orange:#f39200;--yellow:#f6c343;
  --r:8px;--sh:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.right{text-align:right}
.nowrap{white-space:nowrap}
.pos{color:var(--green);font-weight:600}
.neg{color:var(--red);font-weight:600}

::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2c374b;border-radius:6px}::-webkit-scrollbar-track{background:transparent}
option{background:var(--card2);color:var(--text)}
/* top bar */
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.45);border-bottom:1px solid var(--line2)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:9px;color:#fff;font-weight:800;font-size:19px;letter-spacing:-.3px;white-space:nowrap}
.logo:hover{text-decoration:none}
.logo i{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 5px;border-radius:7px;background:linear-gradient(135deg,var(--orange),#ffb84d);font-style:normal;color:#0a111d;font-size:12.5px;letter-spacing:.3px}
.logo span{color:#8fb4ff;font-weight:600}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;border:0;border-radius:6px;padding:9px 12px 9px 34px;background:var(--inp);border:1px solid var(--line);color:var(--text);outline:none}
.search input:focus{border-color:var(--blue)}
.search svg{stroke:#8d99ad;position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5}
.top-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.tbtn{background:var(--navy2);border:1px solid var(--navy3);color:#fff;border-radius:6px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:var(--navy3)}
.tbtn:disabled{opacity:.4;cursor:default}
.subnav{background:var(--navy2)}
.subnav-in{max-width:1240px;margin:0 auto;display:flex;gap:2px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.subnav a{color:#aebbd0;padding:10px 12px;white-space:nowrap;border-bottom:3px solid transparent;font-weight:500}
.subnav a:hover{color:#fff;text-decoration:none;background:rgba(255,255,255,.05)}
.subnav a.on{color:#fff;border-bottom-color:var(--orange)}
.subnav .sep{width:1px;background:rgba(255,255,255,.15);margin:8px 6px}
#busy{position:fixed;top:0;left:0;height:3px;width:0;background:var(--orange);z-index:99;transition:width .3s}
#busy.on{width:80%;transition:width 4s cubic-bezier(.1,.6,.2,1)}

/* layout */
main{max-width:1240px;margin:0 auto;padding:16px}
.crumbs{font-size:13px;color:var(--muted);margin:2px 0 12px}
.crumbs a{color:var(--muted)}
.crumbs b{color:var(--text);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:16px}
.panel.flush{padding:0;overflow:hidden}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card2)}
.panel-h h2{margin:0}
.grow{flex:1}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row>*{min-width:0}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}

/* games tiles */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.game{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);color:var(--text)}
.game:hover{border-color:var(--blue);text-decoration:none}
.gicon{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:15px}
.g-ygo{background:linear-gradient(135deg,#7a3cc2,#c0392b)}
.g-pkm{background:linear-gradient(135deg,#f0b90b,#e5532d)}
.g-op{background:linear-gradient(135deg,#d62828,#264aa8)}
.g-x{background:linear-gradient(135deg,#4b6584,#2d3e50)}

/* buttons/forms */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#3a4760;background:var(--hover);text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-d)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.dan{color:var(--red);border-color:#5a2a30}
.btn.dan:hover{background:#2a1a1f}
.btn.dan.fill{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 8px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--inp);color:var(--text);outline:none}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(75,141,255,.2)}
label.f{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fg .full{grid-column:1/-1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--inp);color:var(--muted);padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .inp{width:auto}
fieldset{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0}
legend{font-size:12.5px;color:var(--muted);font-weight:600;padding:0 4px}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--card2);white-space:nowrap}
.t td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t tbody tr:nth-child(even){background:rgba(255,255,255,.018)}
.t tbody tr:hover{background:var(--hover)}
.t th.sortable{cursor:pointer}
.t th.sortable:hover{color:var(--text)}
.t tfoot td{font-weight:700;background:var(--card2);border-top:1px solid var(--line)}
.t .acts{white-space:nowrap;text-align:right}
.t a.cname{font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}
.pager{display:flex;gap:6px;justify-content:flex-end;align-items:center;padding:10px 16px}

/* badges */
.b{display:inline-block;border-radius:4px;padding:1px 6px;font-size:11.5px;font-weight:700;line-height:18px;white-space:nowrap}
.c-MT{background:#17a2b8;color:#fff}.c-NM{background:#2e9b57;color:#fff}.c-EX{background:#8dbb3c;color:#fff}
.c-GD{background:#d6c22b;color:#2b2b00}.c-LP{background:#f29a2e;color:#fff}.c-PL{background:#e8664a;color:#fff}.c-PO{background:#c0392b;color:#fff}
.c-x{background:#2a3446;color:#c9d2e0}
.rar{background:#1d2c4a;color:#a9c4ff;font-weight:600}
.st-d{background:#143326;color:#5fd69a}.st-v{background:#262f3e;color:#9aa6b8}
.lotb{background:#3a2a12;color:#ffbf5e}
.lang{background:#262f3e;color:#c9d2e0;font-weight:600}

/* card page */
.cardtop{display:grid;grid-template-columns:220px 1fr;gap:16px}
.cimg{width:220px;aspect-ratio:63/88;border-radius:10px;background:linear-gradient(160deg,#22385e,#0e1a2e);display:grid;place-items:center;color:#fff;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.2);position:relative}
.cimg img{width:100%;height:100%;object-fit:cover}
.cimg .ph{text-align:center;padding:16px}
.cimg .ph b{display:block;font-size:17px;margin-top:10px}
.cimg .ph small{opacity:.7}
.info{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13.5px}
.info dt{color:var(--muted)}
.info dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* immagini */
.thumb{position:relative;display:inline-block;width:30px;height:42px;border-radius:3px;overflow:visible;vertical-align:middle;flex:none}
.thumb>img:first-child{width:30px;height:42px;object-fit:cover;border-radius:3px;display:block;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.thumb>i{display:grid;place-items:center;width:30px;height:42px;border-radius:3px;color:#fff;font-style:normal;font-size:8.5px;font-weight:800;opacity:.55}
.thumb .big{display:none;position:absolute;left:38px;top:50%;transform:translateY(-50%);width:190px;height:auto;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:30;pointer-events:none}
@media (hover:hover){.thumb:hover .big{display:block}}
td.tc{width:44px;padding-right:0}
.cimg{cursor:pointer}
.cimg .imgbtn{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(10,20,40,.75);color:#fff;border:0;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;white-space:nowrap;opacity:0;transition:opacity .15s}
.cimg:hover .imgbtn,.cimg:focus-within .imgbtn{opacity:1}
@media (hover:none){.cimg .imgbtn{opacity:1}}
.imgprev{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.imgprev img{width:110px;border-radius:6px;cursor:pointer;border:3px solid transparent;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.imgprev img:hover{border-color:var(--blue)}

/* vendite, lotti */
.orow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.orow .oq{width:84px;flex:none}.orow .op{width:120px;flex:none}.orow .x{align-self:flex-end;padding-bottom:6px}
.osum{margin-top:14px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.osum-g{display:grid;grid-template-columns:1fr auto;gap:4px 18px;max-width:380px;margin-left:auto;font-variant-numeric:tabular-nums}
.osum-g span{color:var(--muted)}.osum-g .tot{border-top:1px solid var(--line);padding-top:6px;margin-top:4px;font-size:16px;color:var(--text)}
.prog{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin:2px 0 3px}.prog.big{height:12px;border-radius:6px}
.prog i{display:block;height:100%;border-radius:inherit;transition:width .4s}
a.panel.banner{display:flex;gap:12px;align-items:center;color:var(--text);border-color:#4a3a1c;background:linear-gradient(90deg,#2a2213,var(--card))}
a.panel.banner:hover{text-decoration:none;border-color:var(--orange)}
.tst.ok{background:#1d5c3d;border-color:#2c7a52}
@media (max-width:760px){.orow{flex-wrap:wrap}.orow .grow{flex-basis:calc(100% - 50px)}.orow .oq,.orow .op{flex:1}}

/* Cardmarket */
a.btn.cmlink{border-color:#1f4f8f;color:#8fb4ff}a.btn.cmlink:hover{background:#14233d}
.cmp h3{font-size:15px}.cmgrid{display:flex;gap:10px 28px;flex-wrap:wrap;margin-top:12px}.cmgrid div{display:flex;flex-direction:column}.cmgrid span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}.cmgrid b{font-size:20px;font-variant-numeric:tabular-nums}
.cml{max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:6px}.cmi{display:flex;gap:12px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}.cmi:hover{background:var(--hover)}.cmi:last-child{border-bottom:0}
.mv{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line2)}.mv:last-child{border-bottom:0}.mv a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* modal */
.upg{background:#2a2213;border-bottom:1px solid #4a3a1c;color:#f3d9a6;font-size:13px}.upg>div{max-width:1240px;margin:0 auto;padding:8px 16px}.upg a{color:#ffbf5e;font-weight:600}

.mback{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow-y:auto}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:10px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mbox.wide{max-width:780px}
.mhead{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.mhead h3{flex:1;font-size:16px}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.mbody{padding:16px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:14px;margin-top:14px;border-top:1px solid var(--line)}

/* autocomplete */
.acw{position:relative}
.ac{position:absolute;left:0;right:0;top:100%;margin-top:3px;background:var(--card2);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:60;max-height:300px;overflow-y:auto;color:var(--text)}
.ac:empty{display:none}
.ac div.it{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.ac div.it:last-child{border-bottom:0}
.ac div.it.on,.ac div.it:hover{background:var(--hover)}
.ac div.it small{display:block;color:var(--muted);font-size:11.5px}
.ac .hd{padding:5px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:var(--card)}

/* toast */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.tst{background:#263248;border:1px solid #34425c;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;max-width:92vw}
.tst.err{background:var(--red)}
.tst button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:5px;padding:3px 8px;cursor:pointer}

/* auth */
.auth{max-width:440px;margin:7vh auto;padding:0 16px}
.auth .panel{padding:24px}
.auth .logo{color:var(--text);justify-content:center;font-size:24px;margin-bottom:18px}
.auth .logo span{color:#8fb4ff}
.note{background:#17233a;border:1px solid #27385a;border-radius:6px;padding:10px 12px;font-size:13px;color:#c3d0e6}
.dz{display:block;border:2px dashed #34425c;border-radius:8px;padding:22px;margin-top:10px;text-align:center;background:var(--inp);cursor:pointer}
.dz:hover,.dz.on{border-color:var(--blue);background:#14203a}

@media (max-width:760px){
  .top-in{flex-wrap:wrap;gap:10px}
  .search{order:3;max-width:none;flex-basis:100%}
  .tbtn .lbl{display:none}
  main{padding:12px}
  .cardtop{grid-template-columns:1fr}
  .cimg{width:160px;margin:0 auto}
  .hide-m{display:none}
  .t td,.t th{padding:7px 8px}
}
</style>
</head>
<body>
<div id="busy"></div>
<div id="root"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* =====================================================================
   CONFIGURAZIONE OPZIONALE
   Se incolli qui URL e chiave "anon public" del tuo progetto Supabase,
   l'app non te li chiederà su nessun dispositivo (PC e telefono).
   ===================================================================== */
const SUPABASE_URL = '';
const SUPABASE_ANON_KEY = '';

/* ===================== utilità ===================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EUR = new Intl.NumberFormat('it-IT', {style:'currency', currency:'EUR'});
const eur = n => (n == null || isNaN(n)) ? '—' : EUR.format(n);
const signEur = n => (n == null || isNaN(n)) ? '—' : `<span class="${n >= 0 ? 'pos' : 'neg'}">${n > 0 ? '+' : ''}${EUR.format(n)}</span>`;
const pad = n => String(n).padStart(2, '0');
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoLocal(new Date());
const fdate = d => d ? d.slice(0,10).split('-').reverse().join('/') : '—';
const MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const fmonth = m => { const [y, mm] = m.split('-'); return `${MESI[+mm-1]} ${y}`; };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c === 'x' ? r : (r&3|8)).toString(16); }));
const clean = s => String(s ?? '').replace(/\s+/g, ' ').trim();
const norm = s => clean(s).toLowerCase();
const fold = s => norm(s).normalize('NFD').replace(/[̀-ͯ]/g, '');
const keyOf = c => [c.game, c.expansion, c.name, c.rarity].map(norm).join('|');
const sum = (a, f) => a.reduce((t, x) => t + (f(x) || 0), 0);
const round2 = n => Math.round(n * 100) / 100;
const enc = s => encodeURIComponent(s === '' ? '~' : s);
const dec = s => { const v = decodeURIComponent(s); return v === '~' ? '' : v; };
function num(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).replace(/[€\s]/g, '').replace(/eur/i, '');
  if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, '');
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

const GAMES = ['Yu-Gi-Oh!', 'Pokémon', 'One Piece'];
function gameName(v){
  const s = fold(v);
  if (!s) return '';
  if (/yu.?gi/.test(s)) return 'Yu-Gi-Oh!';
  if (/pok/.test(s)) return 'Pokémon';
  if (/one.?piece/.test(s)) return 'One Piece';
  if (/magic|mtg/.test(s)) return 'Magic';
  if (/lorcana/.test(s)) return 'Lorcana';
  return clean(v);
}
const gameCls = g => g === 'Yu-Gi-Oh!' ? 'g-ygo' : g === 'Pokémon' ? 'g-pkm' : g === 'One Piece' ? 'g-op' : 'g-x';
const gameAbbr = g => g === 'Yu-Gi-Oh!' ? 'YGO' : g === 'Pokémon' ? 'PKM' : g === 'One Piece' ? 'OP' : (g || '?').slice(0,3).toUpperCase();

const CONDS = ['MT','NM','EX','GD','LP','PL','PO'];
const COND_LBL = {MT:'Mint', NM:'Near Mint', EX:'Excellent', GD:'Good', LP:'Light Played', PL:'Played', PO:'Poor'};
function normCond(v){

function fixUrl(u){

  try {
    const x = new URL(u);

    if (/supabase\.com$/i.test(x.hostname) && m) return `https://${m[1]}.supabase.co`;

const DB = {
  async fetchAll(t){
    if (S.mode === 'local') return LS.get(t);
    const all = [];
    for (let from = 0; ; from += 1000){
      const {data, error} = await sb.from(t).select('*').order('created_at').range(from, from + 999);
      if (error) throw error;
      all.push(...data);
      if (data.length < 1000) break;
    }
    return all;
  },
  async insert(t, rows){
    if (S.mode === 'local'){ LS.put(t, LS.get(t).concat(rows)); return; }
    for (const c of chunk(rows, 500)){ let {error} = await sb.from(t).insert(c.map(strip).map(dbRow)); if (error && colMissing(error)) ({error} = await sb.from(t).insert(c.map(strip).map(dbRow))); if (error) throw error; }
  },
  async upsert(t, rows){
    if (S.mode === 'local'){ const m = new Map(LS.get(t).map(r => [r.id, r])); rows.forEach(r => m.set(r.id, r)); LS.put(t, [...m.values()]); return; }
    for (const c of chunk(rows, 500)){ let {error} = await sb.from(t).upsert(c.map(dbRow)); if (error && colMissing(error)) ({error} = await sb.from(t).upsert(c.map(dbRow))); if (error) throw error; }
  },
  async update(t, ids, patch){
    if (S.mode === 'local'){ const set = new Set(ids); LS.put(t, LS.get(t).map(r => set.has(r.id) ? {...r, ...patch} : r)); return; }
    for (const c of chunk(ids, 200)){ if (!Object.keys(dbRow(patch)).length) return; let {error} = await sb.from(t).update(dbRow(patch)).in('id', c); if (error && colMissing(error)) ({error} = await sb.from(t).update(dbRow(patch)).in('id', c)); if (error) throw error; }
  },
  async remove(t, ids){
    if (S.mode === 'local'){ const set = new Set(ids); LS.put(t, LS.get(t).filter(r => !set.has(r.id))); return; }
    for (const c of chunk(ids, 200)){ const {error} = await sb.from(t).delete().in('id', c); if (error) throw error; }
  }
};

function normRow(t, r){

  if (t === 'lots') o.total_price = Number(o.total_price) || 0;
  return o;
}

/* ===== transazioni con annullamento ===== */
const undoStack = [];
async function commit(label, fn){
  const inv = [];
  const tx = {
    async insert(t, rows){
      rows = [].concat(rows); if (!rows.length) return;
      rows = rows.map(r => ({created_at: new Date().toISOString(), ...r}));
      await DB.insert(t, rows); rows.forEach(r => S[t].set(r.id, normRow(t, r)));
      inv.push({op:'remove', t, ids: rows.map(r => r.id)});
    },
    async update(t, ids, patch){
      ids = [].concat(ids).filter(id => S[t].has(id)); if (!ids.length) return;
      const olds = ids.map(id => ({...S[t].get(id)}));
      await DB.update(t, ids, patch); ids.forEach(id => S[t].set(id, normRow(t, {...S[t].get(id), ...patch})));
      inv.push({op:'upsert', t, rows: olds});
    },
    async remove(t, ids){
      ids = [].concat(ids).filter(id => S[t].has(id)); if (!ids.length) return;
      const olds = ids.map(id => ({...S[t].get(id)}));
      await DB.remove(t, ids); ids.forEach(id => S[t].delete(id));
      inv.push({op:'upsert', t, rows: olds});
    }
  };
  busy(true);
  try {
    await fn(tx);
  } catch (e){
    console.error(e);
    try { await applyInverse(inv.reverse()); } catch (e2){ console.error(e2); }
    busy(false); toast('Errore: ' + (e.message || e), 'err'); render(); return false;
  }
  busy(false);
  if (inv.length){ undoStack.push({label, inv: inv.reverse()}); if (undoStack.length > 40) undoStack.shift(); }
  render();
  toast(label, '', inv.length ? 'Annulla' : null);
  return true;
}
async function applyInverse(ops){
  for (const o of ops){
    if (o.op === 'remove'){ await DB.remove(o.t, o.ids); o.ids.forEach(id => S[o.t].delete(id)); }
    else { await DB.upsert(o.t, o.rows); o.rows.forEach(r => S[o.t].set(r.id, normRow(o.t, r))); }
  }
}
async function undo(){
  const u = undoStack.pop(); if (!u) return;
  busy(true);
  try { await applyInverse(u.inv); toast('Annullato: ' + u.label); }
  catch (e){ toast('Impossibile annullare: ' + e.message, 'err'); }
  busy(false); render();
}

let IX = null;
const OC = new Map(), ESTC = new Map();
function index(){

    if (c.lot_id) (byLot.get(c.lot_id) || byLot.set(c.lot_id, []).get(c.lot_id)).push(c);
  }
  const byKey = new Map(); for (const c of S.cards.values()) byKey.set(keyOf(c), c);
  const games = [...new Set([...GAMES, ...[...S.cards.values()].map(c => c.game)])];
  IX = {byCard, byLot, byOrder, byKey, games};
  return IX;
}
const copiesOf = id => IX.byCard.get(id) || [];
const lotCopies = id => IX.byLot.get(id) || [];
const orderItems = id => IX.byOrder.get(id) || [];
function orderCalc(o){
  const items = orderItems(o.id), gross = sum(items, c => c.sell_price);
  const extra = (o.fee || 0) + (o.shipping_cost || 0) - (o.shipping_charged || 0);
  return {items, gross, extra, net: gross - extra, qty: sum(items, c => c.qty), hasLot: items.some(c => c.lot_id)};
}
function oc(o){ let k = OC.get(o.id); if (!k){ k = orderCalc(o); OC.set(o.id, k); } return k; }
/** incasso netto di una riga venduta: prezzo − la sua quota di commissione e spedizione dell'ordine */
function netSell(c){
  if (c.sell_price == null) return 0;
  const o = c.order_id && S.orders.get(c.order_id); if (!o) return c.sell_price;
  const k = oc(o), share = k.gross ? c.sell_price / k.gross : 1 / (k.items.length || 1);
  return c.sell_price - share * k.extra;
}
function estUnit(cardId){ if (!ESTC.has(cardId)){ const c = S.cards.get(cardId); ESTC.set(cardId, (c && mktUnit(c)) ?? cardStats(cardId).avgSell); } return ESTC.get(cardId); }
function cardStats(id){
  const cs = copiesOf(id);
  const av = cs.filter(c => c.status !== 'venduto'), so = cs.filter(c => c.status === 'venduto');
  const buys = cs.filter(c => c.buy_price != null && !c.lot_id);
  const buyQty = sum(buys, c => c.qty);
  const soldQty = sum(so, c => c.qty);
  const singlesSold = so.filter(c => !c.lot_id && c.buy_price != null && c.sell_price != null);
  const lastSale = so.filter(c => c.sell_date).sort((a, b) => b.sell_date.localeCompare(a.sell_date))[0];
  return {
    avail: sum(av, c => c.qty), sold: soldQty,
    avgBuy: buyQty ? sum(buys, c => c.buy_price * c.qty) / buyQty : null,
    avgSell: (q => q ? sum(so.filter(c => c.sell_price != null), c => c.sell_price) / q : null)(sum(so.filter(c => c.sell_price != null), c => c.qty)),
    earned: sum(so, c => c.sell_price), earnedNet: sum(so, c => netSell(c)),
    margin: singlesSold.length ? sum(singlesSold, c => netSell(c) - c.buy_price * c.qty) : null,
    lastSale, conds: [...new Set(av.map(c => c.condition).filter(Boolean))]
  };
}
const unitSell = c => c.sell_price != null ? c.sell_price / c.qty : null;
function findCard(game, expansion, name, rarity){ return IX.byKey.get(keyOf({game, expansion, name, rarity})); }
async function ensureCard(tx, d){

const sameAvail = (a, b) => a.card_id === b.card_id && a.status !== 'venduto' && (a.lot_id || null) === (b.lot_id || null) &&
  (a.condition || '') === (b.condition || '') && (a.edition || '') === (b.edition || '') && (a.language || '') === (b.language || '') &&
  (a.buy_price ?? null) === (b.buy_price ?? null) && (a.buy_date || null) === (b.buy_date || null);

/* ===== autocomplete ===== */
function autocomplete(input, source, onPick){
  const wrap = input.parentElement; wrap.classList.add('acw');
  const box = document.createElement('div'); box.className = 'ac'; wrap.appendChild(box);
  let items = [], sel = -1, req = 0, t;
  const show = list => {
    items = list; sel = -1;
    if (document.activeElement !== input){ box.innerHTML = ''; return; }
    let html = '', lastG = null;
    list.forEach((it, i) => {
      if (it.group && it.group !== lastG){ html += `<div class="hd">${esc(it.group)}</div>`; lastG = it.group; }
      html += `<div class="it" data-i="${i}">${esc(it.label)}${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</div>`;
    });
    box.innerHTML = html;
  };
  const run = async () => { const my = ++req; const q = input.value.trim(); await source(q, list => { if (my === req) show(list); }); };
  input.setAttribute('autocomplete', 'off');
  input.addEventListener('input', () => { clearTimeout(t); t = setTimeout(run, 220); });
  input.addEventListener('focus', run);
  input.addEventListener('blur', () => setTimeout(() => { box.innerHTML = ''; }, 180));
  input.addEventListener('keydown', e => {
    const els = $$('.it', box); if (!els.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + els.length) % els.length;
      els.forEach((el, i) => el.classList.toggle('on', i === sel)); els[sel].scrollIntoView({block: 'nearest'});
    } else if (e.key === 'Enter' && sel >= 0){ e.preventDefault(); pick(sel); }
    else if (e.key === 'Escape'){ box.innerHTML = ''; e.stopPropagation(); }
  });
  box.addEventListener('mousedown', e => { const it = e.target.closest('.it'); if (it){ e.preventDefault(); pick(+it.dataset.i); } });
  const pick = i => { const it = items[i]; box.innerHTML = ''; req++; onPick(it); };
}

const apiCache = new Map();
async function cachedJson(url){
  if (apiCache.has(url)) return apiCache.get(url);
  const p = fetch(url).then(r => r.ok ? r.json() : null).catch(() => null);
  apiCache.set(url, p); return p;
}
async function remoteNames(game, q){
  if (game === 'Yu-Gi-Oh!' && q.length >= 3){
    const j = await cachedJson(`https://db.ygoprodeck.com/api/v7/cardinfo.php?fname=${encodeURIComponent(q)}&num=12&offset=0`);
    return (j?.data || []).map(c => ({label: c.name, sub: `${c.type || ''}${c.card_sets ? ' · ' + c.card_sets.length + ' stampe' : ''}`, value: c.name, group: 'Database Yu-Gi-Oh!',
      image: c.card_images?.[0]?.image_url_small, sets: (c.card_sets || []).map(s => ({expansion: s.set_name, rarity: s.set_rarity, code: s.set_code, image: c.card_images?.[0]?.image_url_small}))}));
  }
  if (game === 'Pokémon' && q.length >= 2){
    const j = await cachedJson(`https://api.pokemontcg.io/v2/cards?q=${encodeURIComponent(`name:"${q.replace(/"/g, '')}*"`)}&pageSize=20&orderBy=-set.releaseDate&select=id,name,rarity,set,number,images`);
    const data = j?.data || [];
    const setsByName = {};
    data.forEach(c => (setsByName[c.name] ||= []).push({expansion: c.set?.name, rarity: c.rarity || '', code: `${c.set?.id || ''} ${c.number || ''}`.trim(), image: c.images?.small}));
    return data.map(c => ({label: c.name, sub: `${c.set?.name || ''} · ${c.rarity || '—'} · #${c.number || ''}`, value: c.name, group: 'Database Pokémon',
      pick: {expansion: c.set?.name, rarity: c.rarity || '', image: c.images?.small}, sets: setsByName[c.name]}));
  }
  return [];
}

async function findImages(card){

async function resizeBlob(blob, max = 480){

/* ===================== CARDMARKET: catalogo e prezzi di mercato ===================== */
const CM_GAMES = {'Yu-Gi-Oh!': 3, 'Pokémon': 6, 'One Piece': 18};
const CM_SLUG = {3: 'YuGiOh', 6: 'Pokemon', 18: 'OnePiece'};
const CM_REPO = (() => { const m = location.hostname.match(/^([^.]+)\.github\.io$/i), r = location.pathname.split('/').filter(Boolean)[0]; return m && r && !/\.html$/.test(r) ? `${m[1]}/${r}` : 'dsrmn/archivio-carte'; })();
const CM = {idx: {}, loading: {}, byId: new Map(), match: new Map(), expLearn: new Map(), err: {}};
const CM_COND = {1: 'MT', 2: 'NM', 3: 'EX', 4: 'GD', 5: 'LP', 6: 'PL', 7: 'PO'};
const CM_LANG = {1: 'EN', 2: 'FR', 3: 'DE', 4: 'ES', 5: 'IT', 6: 'CN', 7: 'JP', 8: 'PT', 9: 'RU', 10: 'KR', 11: 'TW'};
const cmQuotes = s => String(s ?? '').replace(/""/g, '"');
/** nome "base" per confrontare: senza attacchi [..], senza versioni (V.1 - ...), senza codici (OP01-001) */
const cmBase = s => fold(cmQuotes(s).replace(/\s*\[[^\]]*\]/g, '').replace(/\s*\(V\.\s*\d+[^)]*\)/gi, '').replace(/\s*\((?:[A-Z]{1,6}\d{0,3}[a-z]?-[A-Z]{0,3}\d{1,4}[a-z]?|\d+\/\d+)\)/gi, '').replace(/[“”]/g, '"'));
const cmRar = s => (String(s).match(/\(V\.\s*\d+\s*-\s*([^)]+)\)/i) || [])[1] || '';
const cmDisplayName = (s, gid) => clean(cmQuotes(s).replace(/\s*\[[^\]]*\]/g, '').replace(gid === 3 ? /\s*\(V\.\s*\d+[^)]*\)/gi : /$^/, ''));
const mktPrice = p => p ? (p.trend ?? p.avg30 ?? p.avg7 ?? p.low ?? null) : null;

function cmIndexGame(gid, d){
  const cols = d.cols, ix = {gid, game: d.game, createdAt: d.createdAt, exp: d.exp || {}, byName: new Map(), expByName: new Map(), n: d.p.length};
  const at = Object.fromEntries(cols.map((c, i) => [c, i]));
  for (const r of d.p){
    const p = {id: r[at.id], name: r[at.name], exp: r[at.exp], trend: r[at.trend], avg30: r[at.avg30], low: r[at.low], avg7: r[at.avg7], trendFoil: r[at.trendFoil], gid};
    p.rar = cmRar(p.name);
    CM.byId.set(p.id, p);
    const k = cmBase(p.name); (ix.byName.get(k) || ix.byName.set(k, []).get(k)).push(p);
  }
  for (const [id, n] of Object.entries(ix.exp)){ const k = fold(n); (ix.expByName.get(k) || ix.expByName.set(k, []).get(k)).push(+id); }
  CM.idx[gid] = ix;
}
async function cmLoad(gid){
  if (CM.idx[gid]) return CM.idx[gid];
  if (CM.loading[gid]) return CM.loading[gid];
  CM.loading[gid] = (async () => {
    const url = `https://raw.githubusercontent.com/${CM_REPO}/cm-data/cm_${gid}.json`, stamp = 'cardarchive.cm.' + gid;
    let cache = null, txt = null;
    try { cache = await caches.open('dsr-cm'); } catch {}
    const fresh = Date.now() - (+localStorage.getItem(stamp) || 0) < 6 * 3600e3;
    if (cache && fresh){ const r = await cache.match(url); if (r) txt = await r.text(); }
    if (!txt){
      try {
        const r = await fetch(url, {cache: 'no-cache'}); if (!r.ok) throw new Error('HTTP ' + r.status);
        if (cache) await cache.put(url, r.clone()); txt = await r.text(); localStorage.setItem(stamp, Date.now());
      } catch (e){ if (cache){ const r = await cache.match(url); if (r) txt = await r.text(); } if (!txt) throw e; }
    }
    cmIndexGame(gid, JSON.parse(txt));
    CM.match.clear(); CM.expLearn.clear(); delete CM.err[gid];
    return CM.idx[gid];
  })().catch(e => { delete CM.loading[gid]; CM.err[gid] = e.message || String(e); throw e; });
  return CM.loading[gid];
}
/** carica in sottofondo i listini dei giochi presenti in archivio, poi ridisegna */
async function cmAutoload(all = false){
  const gids = all ? Object.values(CM_GAMES) : [...new Set([...S.cards.values()].map(c => CM_GAMES[c.game]).filter(Boolean))];
  const todo = gids.filter(g => !CM.idx[g] && !CM.loading[g] && (all || !CM.err[g])); if (!todo.length) return;
  await Promise.allSettled(todo.map(cmLoad));
  const a = document.activeElement, typing = a && /INPUT|TEXTAREA/.test(a.tagName) && $('#app')?.contains(a);
  if (S.user && !typing) render();
}
/** id delle espansioni Cardmarket che corrispondono al nome di espansione usato nell'archivio */
function cmExpIds(game, expName){
  const gid = CM_GAMES[game], ix = CM.idx[gid]; const out = new Set(); if (!ix || !expName) return out;
  const f = fold(expName);
  (ix.expByName.get(f) || []).forEach(id => out.add(id));
  if (!out.size && f.length >= 5) for (const [k, ids] of ix.expByName) if (k.length >= 5 && (k.includes(f) || f.includes(k))) ids.forEach(id => out.add(id));
  const lk = game + '|' + f;
  if (!CM.expLearn.has(lk)){ // impara dalle carte dell'archivio: in quale espansione Cardmarket stanno quasi tutte?
    const cards = [...S.cards.values()].filter(c => c.game === game && fold(c.expansion) === f);
    const cnt = new Map();
    for (const c of cards){ const ids = new Set((ix.byName.get(cmBase(c.name)) || []).map(p => p.exp)); ids.forEach(id => cnt.set(id, (cnt.get(id) || 0) + 1)); }
    const best = [...cnt.entries()].sort((a, b) => b[1] - a[1]);
    CM.expLearn.set(lk, best.length && best[0][1] >= 2 && best[0][1] >= cards.length * .6 && (!best[1] || best[1][1] < best[0][1]) ? best[0][0] : null);
  }
  const learned = CM.expLearn.get(lk); if (learned) out.add(learned);
  return out;
}
function cmMatch(card){
  const gid = CM_GAMES[card.game], ix = CM.idx[gid]; if (!ix) return {status: 'loading', cands: []};
  const all = ix.byName.get(cmBase(card.name)) || [];
  if (!all.length) return {status: 'none', cands: []};
  let c = all;
  const ids = cmExpIds(card.game, card.expansion);
  if (ids.size){ const f = c.filter(p => ids.has(p.exp)); if (f.length) c = f; }
  else if (card.expansion && c.length > 1){ const f = c.filter(p => fold(ix.exp[p.exp] || '').includes(fold(card.expansion)) || fold(card.expansion).includes(fold(ix.exp[p.exp] || '~~~'))); if (f.length) c = f; }
  if (c.length > 1){ // lingua: le carte giapponesi stanno nelle espansioni (Japanese)/OCG
    const langs = new Set(copiesOf(card.id).map(x => x.language).filter(Boolean));
    const jp = p => /japanese|ocg|\(jp\)/i.test(ix.exp[p.exp] || '');
    const f = langs.size === 1 && langs.has('JP') ? c.filter(jp) : c.filter(p => !jp(p));
    if (f.length) c = f;
  }
  if (c.length > 1 && card.rarity){ const r = fold(card.rarity); const f = c.filter(p => p.rar && fold(p.rar) === r); if (f.length) c = f; else { const nf = c.filter(p => !p.rar); if (nf.length && nf.length < c.length) c = nf; } }
  if (c.length === 1) return {status: 'ok', p: c[0], cands: all};
  if (new Set(c.map(p => p.exp)).size === 1){ const s = [...c].sort((a, b) => (mktPrice(a) ?? 1e9) - (mktPrice(b) ?? 1e9)); return {status: 'ok', p: s[0], cands: all, guessed: true}; }
  return {status: 'ambiguous', cands: c};
}
/** prodotto Cardmarket della carta (scelto a mano o trovato in automatico) */
function cmFor(card){
  if (!card || !CM_GAMES[card.game]) return null;
  if (card.cm_id === -1 || card.cm_id === '-1') return null;
  if (card.cm_id) return CM.byId.get(Number(card.cm_id)) || null;
  if (!CM.match.has(card.id)){ const r = cmMatch(card); if (r.status === 'loading') return null; CM.match.set(card.id, r.status === 'ok' ? r.p : null); }
  return CM.match.get(card.id);
}
/** correzione % del prezzo di mercato per la lingua della copia (impostazioni) */

/* ===== import CSV di Cardmarket (idProduct, groupCount, price…) ===== */
const isCmCsv = aoa => { const h = (aoa[0] || []).map(x => String(x).trim().toLowerCase()); return h.includes('idproduct') && (h.includes('groupcount') || h.includes('amount')) && h.includes('price'); };
function cmParseRows(aoa){
  const h = aoa[0].map(x => String(x).trim().toLowerCase()), col = n => h.indexOf(n.toLowerCase());
  const flag = (r, n) => col(n) >= 0 && /^(1|true|x|y|yes)$/i.test(String(r[col(n)] ?? '').trim());
  const out = [];
  for (const r of aoa.slice(1)){
    const id = parseInt(r[col('idProduct')]); if (!id) continue;
    let qty = parseInt(r[col('groupCount') >= 0 ? col('groupCount') : col('amount')]) || 1, unit = num(r[col('price')]) || 0;
    if (flag(r, 'isPlayset')){ qty *= 4; unit /= 4; }
    const p = CM.byId.get(id), gid = p?.gid;
    const notes = [flag(r, 'isFoil') && 'Foil', flag(r, 'isReverseHolo') && 'Reverse Holo', flag(r, 'isSigned') && 'Firmata', flag(r, 'isAltered') && 'Alterata'].filter(Boolean).join(' · ') || null;
    out.push({id, p, qty, unit: round2(unit), condition: CM_COND[+r[col('condition')]] || 'NM', language: (l => l === 'EN' ? (SET.enDefault || 'EN') : l)(CM_LANG[+r[col('idLanguage')]] || null),
      edition: flag(r, 'isFirstEd') ? '1st Edition' : null, notes,
      game: p ? CM.idx[gid].game : null, name: p ? cmDisplayName(p.name, gid) : null, expansion: p ? (CM.idx[gid].exp[p.exp] || `Espansione Cardmarket ${p.exp}`) : null, rarity: p ? cmRar(p.name) : ''});
  }
  // unisci righe identiche (Cardmarket a volte divide la stessa carta su più righe)
  const m = new Map();
  for (const x of out){ const k = [x.id, x.unit, x.condition, x.language, x.edition, x.notes].join('|'); const e = m.get(k); if (e) e.qty += x.qty; else m.set(k, {...x}); }
  return [...m.values()];
}
/** trova le copie disponibili da vendere per una riga del CSV */
function cmFindStock(x, taken){
  const cards = [...S.cards.values()].filter(c => (x.p && cmFor(c)?.id === x.p.id) || (x.name && keyOf(c) === keyOf({game: x.game, expansion: x.expansion, name: x.name, rarity: x.rarity})));
  const ids = new Set(cards.map(c => c.id));
  const cps = [...S.copies.values()].filter(c => ids.has(c.card_id) && c.status !== 'venduto')
    .sort((a, b) => ((b.condition === x.condition) + (b.language === x.language)) - ((a.condition === x.condition) + (a.language === x.language)) || (a.buy_date || '').localeCompare(b.buy_date || ''));
  let need = x.qty; const alloc = [];
  for (const c of cps){ const free = c.qty - (taken.get(c.id) || 0); if (free <= 0 || !need) continue; const q = Math.min(free, need); alloc.push({id: c.id, q}); taken.set(c.id, (taken.get(c.id) || 0) + q); need -= q; }
  return {alloc, missing: need};
}

         <div class="full"><label class="f">Registra come</label><div class="seg" id="cmm"><button type="button" data-v="single" class="${mode === 'single' ? 'on' : ''}">Carte singole</button><button type="button" data-v="newlot" class="${mode === 'newlot' ? 'on' : ''}">Nuovo lotto</button><button type="button" data-v="lot" class="${mode === 'lot' ? 'on' : ''}">Lotto esistente</button></div></div>

      } else if (mode === 'lot'){
        if (!$('#cmls')){ toast('Non hai ancora lotti', 'err'); return; }
        lotId = $('#cmls').value; if ($('#cmladd').checked) lotAdd = buyTotal();
      }

        for (const x of ok){
          const cid = await ensureCard(tx, {game: x.game, expansion: x.expansion, name: x.name, rarity: x.rarity, cm_id: x.p.id});

        }

      if (S.noOrders){ upgradeModal(); return; }
      const taken = new Map(), plan = ok.map(x => ({x, s: cmFindStock(x, taken)})).filter(r => r.s.alloc.length);

      const order = {id: uid(), sell_date: date, platform: 'Cardmarket', buyer: null, shipping_charged: round2(num($('#cmsc').value) || 0), shipping_cost: round2(num($('#cmsk').value) || 0),
        fee: round2(num($('#cmfee').value) || 0), notes: tag || null};

      const done = await commit(`Importata vendita Cardmarket: ${sum(plan, r => sum(r.s.alloc, a => a.q))} carte`, async tx => {
        await tx.insert('orders', order);

          if (a.q === c.qty) await tx.update('copies', c.id, sale);
          else { await tx.update('copies', c.id, {qty: c.qty - a.q}); const {id: _i, created_at: _c, user_id: _u, ...rest} = S.copies.get(c.id); await tx.insert('copies', {...rest, id: uid(), qty: a.q, ...sale}); }
        }
      });
      if (done){ celebrateLots(before); location.hash = '#/vendite'; }
    }
  };
}

function totals(game){
  const cards = [...S.cards.values()].filter(c => !game || c.game === game);
  const ids = new Set(cards.map(c => c.id));
  const cps = [...S.copies.values()].filter(c => ids.has(c.card_id));
  const av = cps.filter(c => c.status !== 'venduto');
  const lotIds = new Set(cps.map(c => c.lot_id).filter(Boolean));
  const lots = game ? [...lotIds].map(id => S.lots.get(id)).filter(Boolean) : [...S.lots.values()];
  const spentSingles = sum(cps.filter(c => !c.lot_id), c => (c.buy_price || 0) * c.qty);
  const spentLots = sum(lots, l => l.total_price);
  const soldC = cps.filter(c => c.status === 'venduto');
  const earned = sum(soldC, c => c.sell_price), net = sum(soldC, c => netSell(c));
  let mkt = 0, noMkt = 0; av.forEach(c => { const u = mktUnit(S.cards.get(c.card_id), c); if (u != null) mkt += u * c.qty; else noMkt += c.qty; });
  return {net, costs: earned - net, mkt, noMkt, cards: cards.filter(c => copiesOf(c.id).some(x => x.status !== 'venduto')).length, avail: sum(av, c => c.qty),
    sold: sum(cps.filter(c => c.status === 'venduto'), c => c.qty), spent: spentSingles + spentLots, spentLots, earned,
    stockCost: sum(av.filter(c => !c.lot_id), c => (c.buy_price || 0) * c.qty)};
}

/* ===================== PAGINA CARTA ===================== */
function lineChart(series){
  const W = 640, H = 230, P = {l: 56, r: 14, t: 14, b: 30};
  const all = series.flatMap(s => s.pts);
  if (!all.length) return `<div class="empty">Nessun prezzo registrato per questa carta.</div>`;
  let x0 = Math.min(...all.map(p => p.x)), x1 = Math.max(...all.map(p => p.x));
  if (x1 - x0 < 864e5 * 20){ x0 -= 864e5 * 15; x1 += 864e5 * 15; }
  const y1 = Math.max(...all.map(p => p.y)) * 1.15 || 1;
  const sx = x => P.l + (x - x0) / (x1 - x0) * (W - P.l - P.r), sy = y => H - P.b - y / y1 * (H - P.t - P.b);
  let g = '';
  for (let i = 0; i <= 4; i++){ const v = y1 * i / 4, y = sy(v); g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}" stroke="#243044"/><text x="${P.l - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="#8d99ad">${EUR.format(v).replace(/,00/, '')}</text>`; }
  for (let i = 0; i <= 3; i++){ const x = x0 + (x1 - x0) * i / 3; g += `<text x="${sx(x)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === 3 ? 'end' : 'middle'}" font-size="11" fill="#8d99ad">${fdate(isoLocal(new Date(x)))}</text>`; }
  for (const s of series){
    const pts = [...s.pts].sort((a, b) => a.x - b.x);
    if (pts.length > 1) g += `<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-opacity=".55" points="${pts.map(p => `${sx(p.x)},${sy(p.y)}`).join(' ')}"/>`;
    g += pts.map(p => `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="4.5" fill="${s.color}" stroke="#151d2a" stroke-width="1.5"><title>${esc(s.name)} · ${fdate(isoLocal(new Date(p.x)))} · ${EUR.format(p.y)}${p.n > 1 ? ' (×' + p.n + ')' : ''}</title></circle>`).join('');
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Storico prezzi">${g}</svg>
    <div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}

function lotOptions(sel){

  return lots.map(l => opt(l.id, sel, `${fdate(l.buy_date)} · ${l.description} (${eur(l.total_price)})`)).join('');
}

    <fieldset style="margin-top:12px"><legend>Acquisto</legend>
      <div class="seg" id="ptype" style="margin-bottom:10px"><button type="button" data-v="single" class="${pre.lot ? '' : 'on'}">Carta singola</button><button type="button" data-v="lot" class="${pre.lot ? 'on' : ''}">Da un lotto</button></div>
      <div id="p-single" ${pre.lot ? 'hidden' : ''}><label class="f">Prezzo unitario (€)</label><input class="inp" name="buy_price" inputmode="decimal" placeholder="0,00" style="max-width:160px"></div>
      <div id="p-lot" ${pre.lot ? '' : 'hidden'}>
        <label class="f">Lotto</label><select class="inp" name="lot">${opt('__new', pre.lot, '＋ Nuovo lotto…')}${lotOptions(pre.lot || [...S.lots.values()].at(-1)?.id)}</select>
        <div id="newlot" class="fg" style="margin-top:10px">
          <div class="full"><label class="f">Descrizione lotto</label><input class="inp" name="lot_desc" placeholder="es. Lotto 20 carte da Vinted"></div>
          <div><label class="f">Data</label><input class="inp" name="lot_date" type="date" value="${today()}"></div>
          <div><label class="f">Prezzo totale (€)</label><input class="inp" name="lot_price" inputmode="decimal" placeholder="0,00"></div>
        </div>
        <div class="small muted" style="margin-top:6px">Il costo del lotto resta condiviso: il guadagno si calcola sul lotto intero.</div>

    ${dl('dl-ed', EDITIONS)}<datalist id="dl-rar"></datalist>
  </form>`;
  openModal(base ? 'Aggiungi copie' : 'Aggiungi carta', html, {wide: true, onMount: m => {
    const f = $('#acf', m), E = n => f.elements[n];
    $('[data-close2]', m).onclick = closeModal;
    const curGame = () => E('game').value;
    const fillRar = () => { $('#dl-rar', m).innerHTML = [...new Set([...(RARITIES[curGame()] || []), ...[...S.cards.values()].filter(c => c.game === curGame()).map(c => c.rarity)])].filter(Boolean).map(v => `<option value="${esc(v)}">`).join(''); };
    fillRar();
    const ensureCm = () => { const gid = CM_GAMES[curGame()]; if (gid && !CM.idx[gid]) cmLoad(gid).catch(() => {}); };
    ensureCm();
    E('game').onchange = async () => {
      if (E('game').value === '__new'){
        const n = prompt('Nome del gioco (es. Magic, Lorcana, Dragon Ball):'); const g = gameName(n);
        if (!g){ E('game').value = GAMES[0]; return; }
        if (![...E('game').options].some(o => o.value === g)) E('game').insertAdjacentHTML('afterbegin', opt(g, g));
        E('game').value = g;
      }
      st.sets = null; st.cm_id = null; fillRar(); hint(); ensureCm();
    };
    const hint = () => {
      const ex = findCard(curGame(), E('expansion').value, E('name').value, E('rarity').value);
      const h = $('#mergehint', m);
      if (ex && E('name').value.trim()){ const s = cardStats(ex.id); h.hidden = false; h.innerHTML = `Questa carta è già nel tuo archivio (${s.avail} disponibili): le nuove copie finiranno nella stessa riga.`; } else h.hidden = true;
    };
    ['name', 'expansion', 'rarity'].forEach(n => E(n).addEventListener('change', hint));
    ['name', 'expansion'].forEach(n => E(n).addEventListener('input', () => { st.cm_id = null; }));
    autocomplete(E('name'), async (q, cb) => {
      const f2 = fold(q), g = curGame();
      const seen = new Set();
      const local = [...S.cards.values()].filter(c => c.game === g && (!f2 || fold(c.name).includes(f2)))
        .filter(c => { const k = norm(c.name); if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 8)
        .map(c => ({label: c.name, sub: 'Nel tuo archivio', value: c.name, group: 'Il tuo archivio', localName: true}));
      const cmn = cmNameSuggest(g, q, 10).filter(x => !seen.has(norm(x.label))).map(x => { seen.add(norm(x.label));
        const n = new Set(x.ps.map(p => p.exp)).size; return {label: x.label, sub: `${n} ${n === 1 ? 'espansione' : 'espansioni'} su Cardmarket`, value: x.label, group: 'Catalogo Cardmarket'}; });
      cb([...local, ...cmn]);
      if (q.length >= 3 && (!CM.idx[CM_GAMES[g]] || g === 'Yu-Gi-Oh!')){ const rem = await remoteNames(g, q); if (!CM.idx[CM_GAMES[g]]) cb([...local, ...cmn, ...rem.filter(r => !seen.has(norm(r.value))).slice(0, 12)]); else st.remote = rem; }
    }, it => {
      st.cm_id = null;
      E('name').value = it.value;
      st.sets = it.sets || null;
      if (!it.sets && !it.localName && curGame() === 'Yu-Gi-Oh!') remoteNames('Yu-Gi-Oh!', it.value).then(r => { const x = r.find(y => fold(y.value) === fold(it.value)); if (x && fold(E('name').value) === fold(it.value)){ st.sets = x.sets; if (!st.image) st.image = x.image || null; } }).catch(() => {});
      if (it.localName){
        const vars = [...S.cards.values()].filter(c => c.game === curGame() && norm(c.name) === norm(it.value));
        st.sets = vars.map(c => ({expansion: c.expansion, rarity: c.rarity, code: 'nel tuo archivio', image: c.image_url}));
        if (vars.length === 1){ E('expansion').value = vars[0].expansion; E('rarity').value = vars[0].rarity; }
      }
      if (it.pick){ E('expansion').value = it.pick.expansion || ''; E('rarity').value = it.pick.rarity || ''; st.image = it.pick.image || null; }
      else if (st.sets && st.sets.length === 1){ E('expansion').value = st.sets[0].expansion; E('rarity').value = st.sets[0].rarity; st.image = st.sets[0].image || null; }
      hint();
      if (!E('expansion').value) setTimeout(() => E('expansion').focus(), 50); else E('qty').focus();
    });
    autocomplete(E('expansion'), async (q, cb) => {
      const f2 = fold(q), g = curGame(), out = [];
      const prints = cmPrintings(g, E('name').value);
      if (prints.length){
        const ygo = new Map(((st.sets && st.sets[0] && st.sets[0].code !== 'nel tuo archivio') ? st.sets : []).map(s => [fold(s.expansion), s.rarity]));
        prints.filter(x => !f2 || fold(`${x.expansion} ${x.rarity} ${x.variant}`).includes(f2)).slice(0, 120).forEach(x => {
          const rar = x.rarity || ygo.get(fold(x.expansion)) || '';
          out.push({label: x.expansion, sub: [rar, x.variant && !x.variant.includes(rar || '~') ? x.variant : '', mktPrice(x.p) != null ? 'mercato ' + eur(mktPrice(x.p)) : ''].filter(Boolean).join(' · '),
            set: {expansion: x.expansion, rarity: rar, cm_id: x.p.id}, group: `Espansioni di questa carta su Cardmarket (${prints.length})`});
        });
      }
      if (st.sets && (!prints.length || st.sets[0]?.code === 'nel tuo archivio')) st.sets.filter(s => !f2 || fold(`${s.expansion} ${s.rarity} ${s.code}`).includes(f2)).slice(0, 40)
        .forEach(s => out.push({label: s.expansion, sub: `${s.rarity || '—'}${s.code ? ' · ' + s.code : ''}`, set: s, group: 'Stampe di questa carta'}));
      const exps = [...new Set([...S.cards.values()].filter(c => c.game === g).map(c => c.expansion))].filter(e => e && (!f2 || fold(e).includes(f2))).sort().slice(0, 10);
      exps.forEach(e => out.push({label: e, value: e, group: 'Espansioni del tuo archivio'}));
      cb(out);
    }, it => {
      if (it.set){ E('expansion').value = it.set.expansion; E('rarity').value = it.set.rarity || E('rarity').value; if (it.set.image) st.image = it.set.image; st.cm_id = it.set.cm_id || null; }
      else { E('expansion').value = it.value; st.cm_id = null; }
      hint(); E('rarity').focus();
    });
    const setType = v => { $$('#ptype button', m).forEach(b => b.classList.toggle('on', b.dataset.v === v)); $('#p-single', m).hidden = v !== 'single'; $('#p-lot', m).hidden = v !== 'lot'; };
    $$('#ptype button', m).forEach(b => b.onclick = () => setType(b.dataset.v));
    const lotSel = () => { $('#newlot', m).hidden = E('lot').value !== '__new'; };
    E('lot').onchange = lotSel; lotSel();
    let againFlag = false;
    $$('button[type=submit]', m).forEach(b => b.addEventListener('click', () => { againFlag = b.name === 'again'; }));
    f.onsubmit = async e => {
      e.preventDefault();
      const name = clean(E('name').value); if (!name) return;
      const isLot = $('#ptype button.on', m).dataset.v === 'lot';
      const d = {game: curGame(), name, expansion: clean(E('expansion').value), rarity: clean(E('rarity').value), image_url: st.image, cm_id: st.cm_id || undefined};
      const qty = Math.max(1, parseInt(E('qty').value) || 1);
      let lotId = isLot ? E('lot').value : null;
      if (isLot && lotId === '__new' && !clean(E('lot_desc').value)){ toast('Scrivi una descrizione per il nuovo lotto', 'err'); E('lot_desc').focus(); return; }
      const price = num(E('buy_price').value);
      const ok = await commit(`Aggiunta ${qty}× ${name}`, async tx => {
        const cid = await ensureCard(tx, d);
        if (lotId === '__new'){ lotId = uid(); await tx.insert('lots', {id: lotId, description: clean(E('lot_desc').value), buy_date: E('lot_date').value || null, total_price: num(E('lot_price').value) || 0}); }
        await addCopy(tx, {card_id: cid, lot_id: lotId || null, qty, condition: E('condition').value, edition: clean(E('edition').value) || null, language: E('language').value || null,
          buy_date: E('buy_date').value || null, buy_price: isLot ? null : price, notes: clean(E('notes').value) || null});
        d.id = cid;
      });
      if (!ok) return;
      queueImages([d.id]);
      if (againFlag){ addCardForm({game: d.game, exp: d.expansion, lot: lotId || undefined, lang: E('language').value}); }
      else { closeModal(); if (!base) location.hash = '#/c/' + d.id; }
    };
  }});
}

/* ===== modifica carta (con unione automatica) ===== */
function editCardForm(id){
  const c = S.cards.get(id);
  openModal('Modifica carta', `<form id="ecf"><div class="fg">
    <div><label class="f">Gioco</label><input class="inp" name="game" list="dl-games" value="${esc(c.game)}" required></div>
    <div class="full"><label class="f">Nome carta</label><input class="inp" name="name" value="${esc(c.name)}" required></div>
    <div class="full"><label class="f">Espansione</label><input class="inp" name="expansion" list="dl-exp" value="${esc(c.expansion)}"></div>
    <div><label class="f">Rarità</label><input class="inp" name="rarity" list="dl-rar2" value="${esc(c.rarity)}"></div>
    <div class="full"><label class="f">URL immagine (facoltativo)</label><input class="inp" name="image_url" value="${esc(c.image_url || '')}" placeholder="https://…"></div>
  </div><div class="note" style="margin-top:12px">Se nome, espansione e rarità coincidono con un'altra carta del tuo archivio, le copie verranno unite in quella riga.</div>
  <div class="mfoot"><button type="button" class="btn" data-c>Annulla</button><button class="btn pri">Salva</button></div>
  ${dl('dl-games', IX.games)}${dl('dl-exp', [...S.cards.values()].filter(x => x.game === c.game).map(x => x.expansion))}${dl('dl-rar2', [...(RARITIES[c.game] || []), ...[...S.cards.values()].map(x => x.rarity)])}</form>`,
  {onMount: m => {
    $('[data-c]', m).onclick = closeModal;
    $('#ecf', m).onsubmit = async e => {
      e.preventDefault(); const E = n => e.target.elements[n];
      const d = {game: gameName(E('game').value), name: clean(E('name').value), expansion: clean(E('expansion').value), rarity: clean(E('rarity').value), image_url: clean(E('image_url').value) || null};
      const target = [...S.cards.values()].find(x => x.id !== id && keyOf(x) === keyOf(d));
      let dest = id;
      const ok = await commit(target ? `Unita a ${target.name}` : `Modificata ${d.name}`, async tx => {
        if (target){
          await tx.update('copies', copiesOf(id).map(x => x.id), {card_id: target.id});
          if (d.image_url && !target.image_url) await tx.update('cards', target.id, {image_url: d.image_url});
          await tx.remove('cards', id); dest = target.id;
          // unisci copie disponibili identiche
          const cps = [...S.copies.values()].filter(x => x.card_id === target.id && x.status !== 'venduto');
          const done = new Set();
          for (const a of cps){ if (done.has(a.id)) continue; const twins = cps.filter(b => b.id !== a.id && !done.has(b.id) && sameAvail(a, b));
            if (twins.length){ await tx.update('copies', a.id, {qty: a.qty + sum(twins, t => t.qty)}); await tx.remove('copies', twins.map(t => t.id)); twins.forEach(t => done.add(t.id)); } done.add(a.id); }
        } else await tx.update('cards', id, d);
      });
      if (ok){ closeModal(); location.hash = '#/c/' + dest; }
    };
  }});
}

    <div><label class="f">Stato</label><select class="inp" name="status">${opt('disponibile', x.status, 'Disponibile')}${opt('venduto', x.status, 'Venduta')}</select></div>
    <div class="sellf"><label class="f">Data vendita</label><input class="inp" name="sell_date" type="date" value="${x.sell_date || ''}"></div>
    <div class="sellf"><label class="f">Incasso totale (€)</label><input class="inp" name="sell_price" inputmode="decimal" value="${x.sell_price ?? ''}"></div>
    <div class="sellf"><label class="f">Piattaforma</label><input class="inp" name="platform" list="dl-pl" value="${esc(x.platform || '')}"></div>
    <div class="full"><label class="f">Note</label><input class="inp" name="notes" value="${esc(x.notes || '')}"></div>
  </div><div class="mfoot"><button type="button" class="btn" data-c>Annulla</button><button class="btn pri">Salva</button></div>${dl('dl-ed', EDITIONS)}${dl('dl-pl', PLATFORMS)}</form>`,
  {wide: true, onMount: m => {
    const f = $('#ecp', m), E = n => f.elements[n];
    $('[data-c]', m).onclick = closeModal;
    const tog = () => $$('.sellf', m).forEach(el => el.style.display = E('status').value === 'venduto' ? '' : 'none');
    E('status').onchange = tog; tog();
    f.onsubmit = async e => {
      e.preventDefault();
      const sold = E('status').value === 'venduto';
      const patch = {qty: Math.max(1, parseInt(E('qty').value) || 1), condition: E('condition').value, language: E('language').value || null, edition: clean(E('edition').value) || null,
        buy_date: E('buy_date').value || null, lot_id: E('lot').value || null, buy_price: E('lot').value ? null : num(E('buy_price').value), status: sold ? 'venduto' : 'disponibile',
        sell_date: sold ? (E('sell_date').value || today()) : null, sell_price: sold ? num(E('sell_price').value) : null, platform: sold ? (clean(E('platform').value) || null) : null, order_id: sold ? (x.order_id || null) : null, notes: clean(E('notes').value) || null};
      const ok = await commit(`Modificata copia di ${c.name}`, async tx => {
        await tx.update('copies', id, patch);
        const me = S.copies.get(id);
        const twin = [...S.copies.values()].find(o => o.id !== id && sameAvail(o, me) && (o.notes || '') === (me.notes || ''));
        if (twin && me.status !== 'venduto'){ await tx.update('copies', twin.id, {qty: twin.qty + me.qty}); await tx.remove('copies', id); }
      });
      if (ok) closeModal();
    };
  }});
}

/* ===================== VENDITE (ordini) ===================== */
const fmtIn = n => n ? round2(n).toFixed(2).replace('.', ',') : '';
function lotSnapshot(lotIds){ index(); const m = new Map(); lotIds.forEach(id => { const l = S.lots.get(id); if (l) m.set(id, lotStats(l).profit); }); return m; }
function celebrateLots(before){
  index();
  for (const [id, p0] of before){ const l = S.lots.get(id); if (!l) continue; if (p0 < 0 && lotStats(l).profit >= 0) toast(`🎉 Lotto “${l.description}” ripagato! Da qui in poi è tutto guadagno.`, 'ok'); }
}
async function mergeTwin(tx, id){
  const me = S.copies.get(id); if (!me || me.status === 'venduto') return;
  const twin = [...S.copies.values()].find(o => o.id !== id && sameAvail(o, me) && (o.notes || '') === (me.notes || ''));
  if (twin){ await tx.update('copies', twin.id, {qty: twin.qty + me.qty}); await tx.remove('copies', id); }
}
function orderMargin(k){
  const singles = k.items.filter(c => !c.lot_id && c.buy_price != null);
  return singles.length ? sum(singles, c => netSell(c) - c.buy_price * c.qty) : null;
}
function orderForm(pre = {}){
  if (S.noOrders){ upgradeModal(); return; }
  const rows = [];
  const addRow = id => { const x = S.copies.get(id); if (!x || x.status === 'venduto') return; const r = rows.find(r => r.id === id); if (r){ r.qty = Math.min(x.qty, r.qty + 1); return; } rows.push({id, qty: 1, price: ''}); };
  (pre.items || []).forEach(addRow);
  const plat0 = localStorage.getItem('cardarchive.lastPlatform') || 'Cardmarket';
  openModal('Nuova vendita', `<form id="of" autocomplete="off">
    <div class="fg">
      <div><label class="f">Data</label><input class="inp" type="date" name="date" value="${today()}"></div>
      <div><label class="f">Piattaforma</label><input class="inp" name="platform" list="dl-pl" value="${esc(plat0)}"></div>
      <div><label class="f">Acquirente <span style="font-weight:400">(facoltativo)</span></label><input class="inp" name="buyer" placeholder="nome utente"></div>
    </div>
    <h3 style="margin:16px 0 4px">Carte vendute</h3>
    <div id="orows"></div>
    <div style="margin-top:10px"><div><input class="inp" id="oadd" placeholder="＋ Aggiungi una carta a questo ordine: scrivi il nome…"></div></div>
    <div class="fg" style="margin-top:14px">
      <div><label class="f">Spedizione pagata dall'acquirente €</label><input class="inp" name="sc" inputmode="decimal" value="${fmtIn(SET.shipCharged)}" placeholder="0,00"></div>
      <div><label class="f">Tuo costo spedizione + imballaggio €</label><input class="inp" name="sk" inputmode="decimal" value="${fmtIn(SET.shipCost)}" placeholder="0,00"></div>
      <div><label class="f">Commissione piattaforma €</label><input class="inp" name="fee" inputmode="decimal" placeholder="0,00"><div class="small muted" id="feehint" style="margin-top:3px"></div></div>
    </div>
    <div style="margin-top:12px"><label class="f">Note</label><input class="inp" name="notes"></div>
    <div id="osum" class="osum"></div>
    <div class="mfoot"><button type="button" class="btn" data-c>Annulla</button><button class="btn ok">Registra vendita</button></div>${dl('dl-pl', PLATFORMS)}</form>`,
  {wide: true, onMount: m => {
    const f = $('#of', m), E = n => f.elements[n];
    let feeTouched = false;
    $('[data-c]', m).onclick = closeModal;
    const itemsTotal = () => sum(rows, r => num(r.price) || 0);
    const drawRows = () => {
      $('#orows', m).innerHTML = rows.length ? rows.map((r, i) => {
        const x = S.copies.get(r.id), c = S.cards.get(x.card_id), est = estCopy(c, x);
        return `<div class="orow" data-i="${i}">${thumbHtml(c)}<div class="grow" style="min-width:0"><b>${esc(c.name)}</b>
          <div class="small muted">${esc(c.expansion || '—')}${c.rarity ? ' · ' + esc(c.rarity) : ''} ${condB(x.condition)} ${x.language ? `<span class="b lang">${esc(x.language)}</span>` : ''} · ${x.lot_id ? 'da lotto' : 'pagata ' + eur(x.buy_price) + ' cad.'}${est != null ? ` · ${mktUnit(c, x) != null ? 'mercato' : 'di solito la vendi a'} ${eur(est)}` : ''}</div></div>
          <div class="oq"><label class="f">Q.tà <span style="font-weight:400">/ ${x.qty}</span></label><input class="inp" type="number" min="1" max="${x.qty}" value="${r.qty}" data-q></div>
          <div class="op"><label class="f">Prezzo €</label><input class="inp" inputmode="decimal" value="${esc(r.price)}" data-p placeholder="${est != null ? fmtIn(est * r.qty) : '0,00'}"></div>
          <button type="button" class="x" data-rm title="Togli dall'ordine">×</button></div>`;
      }).join('') : '<div class="empty" style="padding:14px">Nessuna carta: aggiungile con la casella qui sotto.</div>';
      $$('.orow', m).forEach(el => {
        const r = rows[+el.dataset.i];
        $('[data-q]', el).oninput = e => { r.qty = Math.max(1, Math.min(S.copies.get(r.id).qty, parseInt(e.target.value) || 1)); upd(); };
        $('[data-p]', el).oninput = e => { r.price = e.target.value; upd(); };
        $('[data-rm]', el).onclick = () => { rows.splice(+el.dataset.i, 1); drawRows(); upd(); };
      });
    };
    const upd = () => {
      const items = itemsTotal(), pl = clean(E('platform').value), fs = SET.fees[pl];
      if (!feeTouched) E('fee').value = fmtIn(feeFor(pl, items));
      $('#feehint', m).innerHTML = fs && (fs.pct || fs.fixed)
        ? `${String(fs.pct || 0).replace('.', ',')}% degli articoli${fs.fixed ? ' + ' + eur(fs.fixed) : ''} (${esc(pl)})${feeTouched ? ' · <a href="#" id="feere">ricalcola</a>' : ''}`
        : `nessuna commissione impostata per ${esc(pl || 'questa piattaforma')} · <a href="#" id="feeset">imposta</a>`;
      $('#feere', m) && ($('#feere', m).onclick = e => { e.preventDefault(); feeTouched = false; upd(); });
      $('#feeset', m) && ($('#feeset', m).onclick = e => { e.preventDefault(); e.stopPropagation(); feesModal(() => orderForm({items: rows.map(r => r.id)})); });
      const sc = num(E('sc').value) || 0, sk = num(E('sk').value) || 0, fee = num(E('fee').value) || 0;
      const net = items + sc - fee - sk;
      let cost = 0, sGross = 0, lotQ = 0, unk = 0;
      rows.forEach(r => { const x = S.copies.get(r.id), p = num(r.price) || 0; if (x.lot_id) lotQ += r.qty; else if (x.buy_price == null) unk += r.qty; else { cost += x.buy_price * r.qty; sGross += p; } });
      const sNet = items ? sGross * net / items : 0;
      $('#osum', m).innerHTML = `<div class="osum-g">
          <span>Articoli</span><b>${eur(items)}</b>
          <span>+ spedizione pagata dall'acquirente</span><b>${eur(sc)}</b>
          <span>− commissione</span><b>${eur(fee)}</b>
          <span>− spedizione e imballaggio</span><b>${eur(sk)}</b>
          <span class="tot">Ti resta</span><b class="tot">${eur(net)}</b>
        </div>
        <div class="small muted" style="margin-top:8px">${cost ? `Margine netto sulle carte singole: ${signEur(sNet - cost)}` : ''}${lotQ ? `${cost ? ' · ' : ''}${lotQ} ${lotQ === 1 ? 'carta' : 'carte'} da lotto: il ricavo va a ripagare il lotto` : ''}${unk ? ` · ${unk} senza prezzo d'acquisto` : ''}</div>`;
    };
    f.addEventListener('input', e => { if (e.target.closest('.orow') || e.target.id === 'oadd') return; if (e.target === E('fee')) feeTouched = true; upd(); });
    autocomplete($('#oadd', m), async (q, cb) => {
      const fq = fold(q); if (!fq){ cb([]); return; }
      cb([...S.copies.values()].filter(x => x.status !== 'venduto').map(x => ({x, c: S.cards.get(x.card_id)}))
        .filter(o => o.c && fold(`${o.c.name} ${o.c.expansion}`).includes(fq)).slice(0, 15)
        .map(({x, c}) => ({label: c.name, sub: `${c.expansion || '—'} · ${c.rarity || '—'} · ${x.condition || ''}${x.language ? ' ' + x.language : ''} · disponibili ${x.qty}${x.lot_id ? ' · da lotto' : ''}`, id: x.id})));
    }, it => { addRow(it.id); $('#oadd', m).value = ''; drawRows(); upd(); });
    f.onsubmit = async e => {
      e.preventDefault();
      if (!rows.length){ toast('Aggiungi almeno una carta', 'err'); $('#oadd', m).focus(); return; }
      const miss = rows.findIndex(r => num(r.price) == null);
      if (miss >= 0){ toast('Manca il prezzo di una carta', 'err'); $$('[data-p]', m)[miss]?.focus(); return; }
      const date = E('date').value || today(), pl = clean(E('platform').value) || null;
      localStorage.setItem('cardarchive.lastPlatform', pl || '');
      const order = {id: uid(), sell_date: date, platform: pl, buyer: clean(E('buyer').value) || null, shipping_charged: round2(num(E('sc').value) || 0),
        shipping_cost: round2(num(E('sk').value) || 0), fee: round2(num(E('fee').value) || 0), notes: clean(E('notes').value) || null};
      const before = lotSnapshot([...new Set(rows.map(r => S.copies.get(r.id).lot_id).filter(Boolean))]);
      const n = sum(rows, r => r.qty), tot = itemsTotal();
      const ok = await commit(`Vendita registrata: ${n} ${n === 1 ? 'carta' : 'carte'} a ${eur(tot)}`, async tx => {
        await tx.insert('orders', order);
        for (const r of rows){
          const x = S.copies.get(r.id), q = Math.min(r.qty, x.qty);
          const sale = {status: 'venduto', sell_date: date, sell_price: round2(num(r.price)), platform: pl, order_id: order.id};
          if (q === x.qty) await tx.update('copies', x.id, sale);
          else { await tx.update('copies', x.id, {qty: x.qty - q}); const {id: _i, created_at: _c, user_id: _u, ...rest} = S.copies.get(x.id); await tx.insert('copies', {...rest, id: uid(), qty: q, ...sale}); }
        }
      });
      if (ok){ closeModal(); celebrateLots(before); }
    };
    drawRows(); upd();
    if (!rows.length) setTimeout(() => $('#oadd', m).focus(), 50); else setTimeout(() => $('[data-p]', m)?.focus(), 50);
  }});
}

  openModal(`Vendita del ${fdate(o.sell_date)}`, `<form id="ov">
    <div class="fg">

      <div><label class="f">Piattaforma</label><input class="inp" name="platform" list="dl-pl" value="${esc(o.platform || '')}"></div>

    </div>
    <div class="tw" style="margin-top:14px;border:1px solid var(--line);border-radius:6px"><table class="t"><thead><tr><th class="tc"></th><th>Carta</th><th>Q.tà</th><th></th><th class="right">Prezzo</th><th class="right">Netto</th><th class="right">Margine</th><th></th></tr></thead><tbody>
      ${k.items.map(x => { const c = S.cards.get(x.card_id); if (!c) return ''; return `<tr><td class="tc">${thumbHtml(c)}</td><td><a class="cname" href="#/c/${c.id}" data-close-link>${esc(c.name)}</a><div class="small muted">${esc(c.expansion || '')}</div></td><td>${x.qty}</td><td>${condB(x.condition)}</td>
        <td class="right">${eur(x.sell_price)}</td><td class="right">${eur(netSell(x))}</td><td class="right">${x.lot_id ? '<span class="small muted">sul lotto</span>' : x.buy_price != null ? signEur(netSell(x) - x.buy_price * x.qty) : '—'}</td>
        <td class="acts"><button type="button" class="btn sm" data-act="editCopy" data-id="${x.id}">✎</button></td></tr>`; }).join('') || '<tr><td colspan="8" class="empty">Nessuna carta in questo ordine.</td></tr>'}
    </tbody></table></div>
    <div class="osum"><div class="osum-g"><span>Articoli</span><b>${eur(k.gross)}</b><span>+ spedizione pagata</span><b>${eur(o.shipping_charged)}</b><span>− commissione</span><b>${eur(o.fee)}</b><span>− spedizione e imballaggio</span><b>${eur(o.shipping_cost)}</b><span class="tot">Ti è rimasto</span><b class="tot">${eur(k.net)}</b></div>
      ${mg != null ? `<div class="small muted" style="margin-top:8px">Margine netto sulle carte singole: ${signEur(mg)}${k.hasLot ? ' · le carte da lotto contano sul lotto' : ''}</div>` : ''}</div>
    <div class="mfoot"><button type="button" class="btn dan" id="ocancel" style="margin-right:auto">Annulla vendita</button><button type="button" class="btn" data-c>Chiudi</button><button class="btn pri">Salva</button></div>${dl('dl-pl', PLATFORMS)}</form>`,
  {wide: true, onMount: m => {
    const f = $('#ov', m), E = n => f.elements[n];
    $('[data-c]', m).onclick = closeModal;
    $$('[data-close-link]', m).forEach(a => a.addEventListener('click', closeModal));
    f.onsubmit = async e => {
      e.preventDefault();
      const patch = {sell_date: E('date').value || o.sell_date, platform: clean(E('platform').value) || null, buyer: clean(E('buyer').value) || null,
        shipping_charged: round2(num(E('sc').value) || 0), shipping_cost: round2(num(E('sk').value) || 0), fee: round2(num(E('fee').value) || 0), notes: clean(E('notes').value) || null};
      const ok = await commit('Vendita modificata', async tx => {
        await tx.update('orders', id, patch);
        const ids = orderItems(id).map(x => x.id);
        if (ids.length) await tx.update('copies', ids, {sell_date: patch.sell_date, platform: patch.platform});
      });
      if (ok) closeModal();
    };
    $('#ocancel', m).onclick = async () => {
      closeModal();
      if (!await confirmBox('Annulla vendita', `Le ${k.qty} carte di questo ordine torneranno disponibili e l'ordine verrà eliminato.`, 'Annulla vendita')) return;
      await commit('Vendita annullata', async tx => {
        const ids = orderItems(id).map(x => x.id);
        await tx.update('copies', ids, {status: 'disponibile', sell_date: null, sell_price: null, platform: null, order_id: null});
        for (const cid of ids) await mergeTwin(tx, cid);
        await tx.remove('orders', id);
      });
    };
  }});
}

}

  const T = {gross: sum(list, x => x.k.gross), fee: sum(list, x => x.o.fee), ship: sum(list, x => (x.o.shipping_cost || 0) - (x.o.shipping_charged || 0)), net: sum(list, x => x.k.net)};

        <td class="right hide-m">${eur(o.fee)}</td><td class="right hide-m">${eur((o.shipping_cost || 0) - (o.shipping_charged || 0))}</td><td class="right"><b>${eur(k.net)}</b></td>

function lotStats(l){
  const cs = lotCopies(l.id), so = cs.filter(c => c.status === 'venduto'), av = cs.filter(c => c.status !== 'venduto');
  const gross = sum(so, c => c.sell_price), earned = sum(so, c => netSell(c));
  let est = 0, unknown = 0;
  av.forEach(c => { const u = estCopy(S.cards.get(c.card_id), c); if (u != null) est += u * c.qty; else unknown += c.qty; });
  return {copies: sum(cs, c => c.qty), sold: sum(so, c => c.qty), left: sum(av, c => c.qty), gross, earned, profit: earned - l.total_price,
    est, unknown, pct: l.total_price > 0 ? earned / l.total_price * 100 : 100};
}

/* ===================== GUADAGNI MENSILI ===================== */
let EG = '';
function monthly(game){
  const M = new Map(); const get = m => M.get(m) || M.set(m, {m, spent: 0, bought: 0, gross: 0, net: 0, fee: 0, ship: 0, sold: 0, margin: 0}).get(m);
  const okCard = id => !game || S.cards.get(id)?.game === game;
  for (const c of S.copies.values()){
    if (!okCard(c.card_id)) continue;
    if (c.buy_date && !c.lot_id){ const r = get(c.buy_date.slice(0, 7)); r.spent += (c.buy_price || 0) * c.qty; r.bought += c.qty; }
    if (c.status === 'venduto' && c.sell_date){
      const r = get(c.sell_date.slice(0, 7)), n = netSell(c);
      r.gross += c.sell_price || 0; r.net += n; r.sold += c.qty;
      if (!c.lot_id && c.buy_price != null) r.margin += n - c.buy_price * c.qty;
    }
  }
  for (const o of S.orders.values()){
    const items = orderItems(o.id).filter(c => okCard(c.card_id)); if (!items.length || !o.sell_date) continue;
    const k = oc(o), part = k.gross ? sum(items, c => c.sell_price) / k.gross : items.length / k.items.length;
    const r = get(o.sell_date.slice(0, 7)); r.fee += (o.fee || 0) * part; r.ship += ((o.shipping_cost || 0) - (o.shipping_charged || 0)) * part;
  }
  for (const l of S.lots.values()){
    if (game && !lotCopies(l.id).some(c => okCard(c.card_id))) continue;
    if (l.buy_date){ const r = get(l.buy_date.slice(0, 7)); r.spent += l.total_price; r.bought += sum(lotCopies(l.id), c => c.qty); }
  }
  return [...M.values()].sort((a, b) => b.m.localeCompare(a.m));
}
function barChart(rows){
  rows = [...rows].reverse().slice(-12);
  if (!rows.length) return '';
  const W = 760, H = 230, P = {l: 56, r: 10, t: 12, b: 34};
  const mx = Math.max(...rows.flatMap(r => [r.spent, r.net])) * 1.1 || 1;
  const bw = (W - P.l - P.r) / rows.length, sy = v => H - P.b - Math.max(0, v) / mx * (H - P.t - P.b);
  let g = '';
  for (let i = 0; i <= 4; i++){ const v = mx * i / 4, y = sy(v); g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}" stroke="#243044"/><text x="${P.l - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="#8d99ad">${EUR.format(v).replace(/,\d\d/, '')}</text>`; }
  rows.forEach((r, i) => {
    const x = P.l + i * bw, w = Math.min(22, bw * .34);
    g += `<rect x="${x + bw / 2 - w - 1}" y="${sy(r.spent)}" width="${w}" height="${H - P.b - sy(r.spent)}" rx="3" fill="#f0605d"><title>${fmonth(r.m)} · speso ${EUR.format(r.spent)}</title></rect>`;
    g += `<rect x="${x + bw / 2 + 1}" y="${sy(r.net)}" width="${w}" height="${H - P.b - sy(r.net)}" rx="3" fill="#34c27b"><title>${fmonth(r.m)} · incassato netto ${EUR.format(r.net)}</title></rect>`;
    const [y, mm] = r.m.split('-');
    g += `<text x="${x + bw / 2}" y="${H - 18}" text-anchor="middle" font-size="11" fill="#8d99ad">${MESI[+mm - 1].slice(0, 3)}</text><text x="${x + bw / 2}" y="${H - 5}" text-anchor="middle" font-size="10" fill="#6f7b8f">${y}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="legend"><span><i style="background:#f0605d"></i>Speso</span><span><i style="background:#34c27b"></i>Incassato netto</span></div></div>`;
}
